name: Feature idea
description: A new capability, for triage · 新功能建议，经分诊后排期
labels: ["feat", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Write in English or Chinese. New ideas are triaged at the start of each iteration into a planned version
        or Later (GOVERNANCE.md). Please wait for an answer before opening a pull request.
        可以用中文填写。新想法会在每个迭代开始时分诊，排进某个版本或 Later；请等回复后再提交 PR。
  - type: textarea
    id: goal
    attributes:
      label: Goal · 目标
      description: What is different for you when this exists, in one or two sentences. 有了它之后对你有什么不同，一两句话。
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Which goal it serves · 服务于哪个目标
      description: Opening a large session at once and driving it, or moving a session to another machine (docs/spec.md#decisions). 瞬间打开并驱动大会话，或把会话交接到另一台机器。
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options you considered · 考虑过的方案
    validations:
      required: false
