name: Bug report
description: Something doesn't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: You can write in English or Chinese. For security issues, use SECURITY.md instead of a public issue.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. hoplet session new --mode code --dir . --harness claude "..."
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Hoplet version
      placeholder: hoplet --version
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [daemon, shim, relay, CLI, desktop app, iOS app, harness adapter, other]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS and version, harness and version, and the output of `hoplet doctor` if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log lines. Remove tokens, keys and private paths.
      render: text
