# Version updates for every ecosystem Hoplet uses (THIRD_PARTY.md). Titles are Conventional Commits: a runtime
# dependency's update is a fix and shows in the release notes, a development dependency's is a build change.
version: 2
updates:
  - package-ecosystem: npm
    # One pnpm workspace with one lockfile at the root: updated from the root, never per package.
    directory: /
    schedule: { interval: weekly }
    commit-message: { prefix: fix, prefix-development: build, include: scope }
    groups:
      # react and react-dom must have the exact same version, so they come as one pull request.
      react:
        patterns: [react, react-dom]
      # Minor and patch updates of development dependencies come as one pull request; a major update comes on its
      # own, so it can be judged alone.
      development:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: gomod
    directory: /agent
    schedule: { interval: weekly }
    commit-message: { prefix: fix, include: scope }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    commit-message: { prefix: ci, include: scope }
  - package-ecosystem: docker
    directory: /image
    schedule: { interval: weekly }
    commit-message: { prefix: build, include: scope }
