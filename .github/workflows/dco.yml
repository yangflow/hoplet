# Every commit of a pull request carries a Signed-off-by line for its author (CONTRIBUTING.md, Developer
# Certificate of Origin). No third-party app: the check reads the commits with the default read-only token.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    name: Commits are signed off
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            author=$(git log -1 --format='%an <%ae>' "$c")
            if ! git log -1 --format=%B "$c" | grep -qiF "Signed-off-by: $author"; then
              echo "::error::$(git log -1 --format='%h %s' "$c") has no 'Signed-off-by: $author' (git commit -s)"
              missing=1
            fi
          done
          exit $missing
