# A pull request's title becomes its squash commit and a line of the changelog, so it must be a Conventional
# Commit (CONTRIBUTING.md). Reads only the pull request's metadata; never checks out its code.
name: pr-title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    name: Conventional Commit title
    # Dependabot's titles take their type and scope from .github/dependabot.yml but not their length; a skipped
    # required check counts as passed.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            design
          scopes: |
            core
            shared
            web
            agent
            image
            scripts
            deps
          requireScope: false
          # English or Chinese: at most 50 characters, an English subject starting with a capital letter.
          subjectPattern: ^(?![a-z])\S.{0,49}$
          subjectPatternError: |
            The subject "{subject}" must be at most 50 characters; in English it starts with a capital letter, such
            as "Stop the process on external writes" (CONTRIBUTING.md).
            标题主题最多 50 个字符；英文主题需以大写字母开头，中文例如"修复交接后侧边栏不刷新的问题"。
