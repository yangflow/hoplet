<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* one type scale: meta 11/16 · UI 13/20 · prose 15/24 · title 15/20 600 · mono 12.5/20; weights 400/500/600 */
.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.with-insp{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.nosb,.frame.page{grid-template-columns:1fr}
.frame.nosb.with-insp{grid-template-columns:1fr var(--layout-inspector)}
.frame.with-insp.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}

/* icon buttons: the icon carries the intent, the title names it */
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib[disabled]{opacity:.4;cursor:default}
.ib.bd{color:var(--color-text-2);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .ib.bd{background:var(--color-raised)}
.ib .cdg{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--color-git-modified);box-shadow:0 0 0 2px var(--color-bg)}

/* a machine's view options: its name, then Organize and Sort as two radio groups under the row */
.pop{position:absolute;z-index:30;top:calc(100% - var(--space-1));left:var(--space-2);right:var(--space-2);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-title{padding:var(--space-2) var(--space-2) var(--space-1);font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-label{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.menu-check{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.menu-sep{height:1px;margin:var(--space-1) var(--space-2);background:var(--color-line)}
.pm{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sess.on .pm{color:var(--color-text-2)}
.gl{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.gl .spin{color:var(--color-accent)}
.need-dot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring)}
.bad-dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.ready-dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex:none}
.off-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.devg.off .dev,.devg.off .sdir,.devg.off .sess{color:var(--color-text-3)}
.devg.off .dev{font-weight:var(--weight-medium)}
.devg.off .sess.on{color:var(--color-text-2)}
.frozen-side .gl .spin{color:var(--color-text-3);animation:none}
.side-foot{height:var(--layout-foot);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4);box-shadow:inset 0 1px 0 var(--color-line);flex:none}
.conn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);white-space:nowrap}
.conn .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.conn.lost{color:var(--color-danger)}
.conn.lost .dot{background:var(--color-danger)}

/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3) 0 var(--space-5);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.nosb .top{padding-left:var(--space-3)}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.top .sp{flex:1}

/* conversation */
.conv{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:0 0 148px}
.conv::-webkit-scrollbar{display:none}
.col{width:min(var(--layout-column),calc(100% - 104px));margin:0 auto;padding-top:var(--space-2)}
.wide .col{width:calc(100% - 48px)}

.badge{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-variant-numeric:tabular-nums}
/* text buttons: decisions only */
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}
.light .btn{background:var(--color-raised)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);font-weight:var(--weight-semibold);padding:0 var(--space-4)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--color-text-2);padding:0 var(--space-2)}
.btn svg{color:currentColor}
.btn[disabled]{opacity:.5;cursor:default}

/* composer */
.dock{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:var(--space-7) 0 var(--space-4);background:linear-gradient(var(--fade-bg),var(--color-bg) 42%);pointer-events:none}
.composer{pointer-events:auto;border-radius:var(--radius-xl);background:var(--color-raised);box-shadow:var(--shadow-float);padding:var(--space-3) var(--space-2) var(--space-2) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.ph{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text-3)}
.cf{display:flex;align-items:center;gap:var(--space-1);min-height:var(--control-field);margin-left:calc(-1 * var(--space-2))}
.cf .cst{display:flex;align-items:center;gap:var(--space-2);height:20px;color:var(--color-text-2);margin:0 0 0 var(--space-1);padding-left:var(--space-3);box-shadow:inset 1px 0 0 var(--color-line)}
.cf .cst.bad{color:var(--color-danger)}
.cf .r{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.send{width:var(--control-field);height:var(--control-field);border-radius:50%;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);flex:none}
.send[disabled]{background:var(--color-hover);color:var(--color-text-3);box-shadow:none;cursor:default}
.composer.cbar{flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-5);min-height:56px}
.composer.cbar .cst{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2);flex:1}
.composer.cbar .cst svg{color:var(--color-text-3)}
.composer.ro{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.recrow{display:flex;align-items:center;gap:var(--space-3);height:24px;padding-right:var(--space-2)}
.recrow .rdot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-soft);animation:pulse var(--motion-pulse) ease-in-out infinite;flex:none}
.recrow .el{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);font-variant-numeric:tabular-nums;width:36px;flex:none}
.wave{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;height:24px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 18%);mask-image:linear-gradient(to right,transparent,#000 18%)}
.wave i{flex:none;width:3px;border-radius:2px;background:var(--color-accent-text)}
.cf .note{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);margin-left:var(--space-3)}

.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);position:relative}
.light .seg{background:var(--color-hover)}
.seg button{height:24px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:6px;font-weight:var(--weight-medium);color:var(--color-text-2);white-space:nowrap}
.seg button .c{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;font-weight:var(--weight-regular)}
.seg button.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .seg button.on{background:var(--color-raised)}
.seg button.on .c{color:var(--color-text-2)}
.seg button[disabled]{color:var(--color-text-3);opacity:.6;cursor:default}
.fld{display:flex;flex-direction:column;gap:var(--space-1)}
.fld .l{color:var(--color-text-2)}
.input{height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);display:flex;align-items:center;padding:0 var(--space-3);font-family:var(--font-mono);font-size:var(--text-code);color:var(--color-text);white-space:nowrap;overflow:hidden}
.input.on{box-shadow:inset 0 0 0 1.5px var(--color-accent)}
.input.ui{font-family:var(--font-ui);font-size:var(--text-ui)}
.nt{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);display:flex;gap:var(--space-2);color:var(--color-text)}
.nt svg{margin-top:2px}
.nt.bad{background:var(--color-del-bg)}
.nt.bad svg{color:var(--color-danger)}
.nt.ok{background:var(--color-add-bg)}
.nt.ok svg{color:var(--color-success)}
.nt.snap{background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2)}
.nt.snap svg{color:var(--color-text-3)}
.sel{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);white-space:nowrap}
.sel .v{flex:1;overflow:hidden;text-overflow:ellipsis}
.sel > svg{color:var(--color-text-3)}
.sel .pm{color:var(--color-text-2)}
.sel .sl{width:16px;height:16px;display:grid;place-items:center;flex:none}
.tgls{display:flex;gap:var(--space-4);align-items:center;height:var(--control-field)}
.tgl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2)}
.switch{width:28px;height:16px;border-radius:8px;background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--color-text-3)}
.switch.on{background:var(--color-accent);box-shadow:none}
.switch.on::after{left:14px;background:var(--color-on-accent)}
/* settings */
.set{flex:1;min-height:0;display:grid;grid-template-columns:var(--layout-settings-nav) minmax(0,1fr)}
.snav{padding:var(--space-3) var(--space-2);box-shadow:inset -1px 0 0 var(--color-line);display:flex;flex-direction:column;gap:2px}
.ni{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2)}
.ni svg{color:var(--color-text-3)}
.ni.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ni.on svg{color:var(--color-text-2)}
.spage{overflow:auto;padding:var(--space-4) var(--space-7) var(--space-5)}
.spage .in{max-width:620px;margin:0 auto}
.spage h1{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;margin-bottom:var(--space-5)}
.sgrp + .sgrp{margin-top:var(--space-5)}
.sgrp .lb{font-weight:var(--weight-semibold);color:var(--color-text);margin-bottom:var(--space-2)}
.themes{display:flex;gap:var(--space-4)}
.thc{display:flex;flex-direction:column;gap:var(--space-2)}
.thp{width:164px;height:88px;border-radius:var(--radius-md);overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--color-line)}
.thc.on .thp{box-shadow:0 0 0 2px var(--color-accent)}
.thp .mini{position:absolute;inset:0;display:grid;grid-template-columns:40px 1fr}
.thp .mini.half{clip-path:polygon(100% 0,100% 100%,0 100%)}
.thp .ms{display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.thp .ms i,.thp .mc i{display:block;height:4px;border-radius:2px}
.thp .mc{display:flex;flex-direction:column;gap:8px;padding:12px}
.thp .mc .cb{margin-top:auto;height:16px;border-radius:6px}
.rl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text)}

/* stacked view */

/* prose */
.text{font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);margin:var(--space-1) 0 var(--space-3);max-width:var(--measure-prose)}

.hres svg{width:14px;height:14px;color:var(--color-text-3)}

.hq{margin:0 0 var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text);font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body)}

.hf .meta{margin-left:auto}
.hbar{pointer-events:auto;margin-bottom:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-lg);background:var(--color-attention-soft);box-shadow:var(--shadow-float),0 0 0 1px var(--color-attention-ring);display:flex;flex-direction:column;gap:var(--space-2)}

.rsel{height:24px;display:inline-flex;align-items:center;gap:var(--space-1);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text);white-space:nowrap}
.rsel svg{width:14px;height:14px;color:var(--color-text-3)}

.pre{display:flex;gap:var(--space-3);align-items:flex-start;padding:var(--space-3);border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--color-line)}

/* cockpit parts the session list and the conversation need */
/* sidebar: device 32 › directory 28 › session 28; one glyph column (x 8) and one name column (x 32) for all three */
.side,.insp{min-height:0;overflow:hidden}
.side{background:var(--color-sidebar);display:flex;flex-direction:column;min-width:0;box-shadow:inset -1px 0 0 var(--color-line)}
.brand{position:relative;height:var(--layout-topbar);display:flex;align-items:center;gap:6px;padding:0 var(--space-2) 0 14px;flex:none}
.brand b{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.brand .sp{flex:1}
.brand .hb{display:flex;gap:0}
.mark{width:20px;height:20px;border-radius:6px;background:var(--color-accent);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.search{margin:0 var(--space-2);height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-surface);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);color:var(--color-text-3);flex:none;text-align:left;
  box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .search{background:var(--color-raised)}
.search .lbl{flex:1}
.kbd{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--color-line);font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.tree{flex:1;overflow:hidden;padding:0 var(--space-2)}
.devg{padding-top:var(--space-4)}
.dev{position:relative;height:var(--layout-row-device);display:flex;align-items:center;padding-right:var(--space-1);border-radius:var(--radius-sm);font-weight:var(--weight-semibold);color:var(--color-text);white-space:nowrap}
.dev .dt{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2)}
.dev .dt .dn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dev .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.dev .dchv{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.dev .dchv svg{transition:transform .12s}
.dev.open .dchv svg{transform:rotate(90deg)}
.dev .ib{width:24px;height:24px;display:none}
.dev.hov .ib,.dev.menu .ib{display:grid;color:var(--color-text-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-success);flex:none}
.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}
/* machine icon: the system's mark in the folder icon's column, the presence dot at its bottom-right, cut into the mark */
.mch{--md:7px;--mc:5.5px;--mo:-1.5px;position:relative;width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.mch svg{display:block;-webkit-mask-image:radial-gradient(circle at 14px 14px,transparent calc(var(--mc) - .5px),#000 var(--mc));mask-image:radial-gradient(circle at 14px 14px,transparent calc(var(--mc) - .5px),#000 var(--mc))}
.mch .mch-d{position:absolute;right:var(--mo);bottom:var(--mo);width:var(--md);height:var(--md);border-radius:50%;background:var(--color-success)}
.mch.off{color:var(--color-text-3)}
.mch.off .mch-d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}

.sdir,.sess{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap}
.sdir{color:var(--color-text-2);font-weight:var(--weight-medium)}

.sdir .rt{display:flex;align-items:center;gap:var(--space-2);flex:none}
.sdir .cnt{font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-regular);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.sdir .ib{width:24px;height:24px;margin-right:-4px;display:none}
.sdir.hov{background:var(--color-hover)}
.sdir.hov .ib{display:grid;color:var(--color-text-2)}
.sdir.none{color:var(--color-text-3);font-weight:var(--weight-regular);padding-left:32px}
.sess{color:var(--color-text-2)}
.sess .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess .m{gap:var(--space-2);min-width:16px;display:flex;align-items:center;justify-content:flex-end;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;flex:none}
.sess.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.sess.dim{color:var(--color-text-3)}
.sess.dim.on{color:var(--color-text-2)}
.sess.two{height:calc(var(--leading-ui) + var(--leading-meta))}
.sess .t.tt{display:flex;flex-direction:column;overflow:visible}
.sess .t1,.sess .t2{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* ---- child sessions (issue #81, ADR 0035): the list as a tree, the children panel, cancel and stop ---------------- */
.sess.par{height:auto;min-height:calc(var(--leading-ui) + var(--leading-meta));padding-top:2px;padding-bottom:2px}
.sess.two{height:auto;min-height:calc(var(--leading-ui) + var(--leading-meta) + 4px);padding-top:2px;padding-bottom:2px}
.sess .rt{display:flex;align-items:center;gap:var(--space-2);flex:none}

.twist{width:16px;height:16px;display:grid;place-items:center;color:var(--color-text-3);flex:none}

.sess.d1{padding-left:calc(var(--space-2) + 16px)}

.kids{position:relative}
.kids::before{content:"";position:absolute;left:calc(var(--space-2) + 7.5px);top:0;bottom:8px;width:1px;background:var(--color-line)}
.kids .kids::before{left:calc(var(--space-2) + 23.5px);bottom:10px}
.gl.ok{color:var(--color-success)}
.gl.off{color:var(--color-text-3)}
.nd{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 2px var(--color-bg)}
.seg button{position:relative}

/* state labels */
.cs{font-weight:var(--weight-medium)}
.cs.run{color:var(--color-accent-text)}
.cs.need{color:var(--color-attention-text)}
.cs.done{color:var(--color-add-text)}
.cs.out{color:var(--color-danger)}

/* A: the Children tab */
.insp-b.kp{flex:1;gap:var(--space-1);padding-bottom:0}
.roll{display:flex;flex-wrap:wrap;gap:var(--space-1);margin-bottom:var(--space-2)}
.kid{border-radius:var(--radius-md);padding:var(--space-2);position:relative}

.sess .t2.or{display:flex;align-items:center;gap:4px}
.kid.sub::before{content:"";position:absolute;left:-9px;top:-4px;height:26px;width:8px;border-left:1px solid var(--color-line);border-bottom:1px solid var(--color-line);border-bottom-left-radius:5px}

.kid-h{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:var(--space-2);align-items:start}
.kid-h .gl{margin-top:2px}
.kid-h .ib{width:24px;height:24px;margin:-2px -4px 0 0}
.kx{min-width:0;display:flex;flex-direction:column}
.kt{font-weight:var(--weight-medium);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.km,.ks{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);display:flex;align-items:center;gap:var(--space-1);white-space:nowrap;font-variant-numeric:tabular-nums}
.km svg{width:12px;height:12px;flex:none}

.fls{display:flex;flex-direction:column;margin:0 calc(-1 * var(--space-1))}

.fr:hover{background:var(--color-hover)}
.fs{font-family:var(--font-mono);font-size:11px;line-height:16px;font-weight:var(--weight-semibold);text-align:center}
.fs.A{color:var(--color-git-untracked)}.fs.M{color:var(--color-git-modified)}.fs.D{color:var(--color-git-deleted)}.fs.R{color:var(--color-syntax-type)}
.fn{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-meta);line-height:var(--leading-meta)}
.fn b{font-weight:var(--weight-medium);color:var(--color-text)}

.fd{display:flex;gap:var(--space-1);font-family:var(--font-mono);font-size:11px;line-height:16px;font-variant-numeric:tabular-nums}
.fd .pl{color:var(--color-add-text)}.fd .mi{color:var(--color-del-text)}
.kid-f{display:flex;gap:var(--space-2);flex-wrap:wrap}
.kp-f{flex:none;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3);box-shadow:inset 0 1px 0 var(--color-line)}

/* cancel and stop: dialogs, inline confirmations, popovers */

.dx .opt{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}

/* B: the card in the conversation */
.ccard{margin:var(--space-2) 0 var(--space-3) calc(16px + var(--space-2));border-radius:var(--radius-md);background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line);padding:var(--space-1) var(--space-2) var(--space-2)}
.cc-h{display:flex;align-items:center;gap:var(--space-2);height:36px;padding:0 var(--space-1)}

.cc-h .sp{flex:1}
.kw{display:grid;grid-template-columns:16px minmax(0,1fr) 168px 72px 44px 40px 24px;column-gap:var(--space-2);align-items:center;min-height:32px;padding:0 var(--space-1);border-radius:var(--radius-sm);font-size:var(--text-body)}

/* ---- the session: a parent that started children ----------------------------------------------------------------- */
const badge = tm => `<span class="badge" role="img"${tip(t('Running', '运行中'))}><span class="sdot"></span><span>${tm}</span></span>`;

/* ---- cancel and stop ---------------------------------------------------------------------------------------------- */

  const ks = o.cancel === 'sub' ? [sel, byId(sel.kids[0])] : [sel];
  const pop = o.cancel ? `<div class="cpop" role="alertdialog" aria-label="${esc(cancelTitle(ks))}"><div class="ttl">${cancelTitle(ks)}</div>${cancelLead(ks) ? `<div class="meta">${cancelLead(ks)}</div>` : ''}${cancelFacts(ks)}<div class="row">${btn(keepLbl(), '', 'quiet')}${btn(cancelLbl(ks), '', 'danger')}</div></div>` : '';
  const ro = `<div class="ro-bar">${I.eye()}<span>${t('You are reading a child session. Open it to send a message.', '你正在查看子会话。打开它才能发送消息。')}</span><span class="sp" style="flex:1"></span>${btn(t('Open session', '打开会话'), I.ext(), '')}</div>`;
  const right = `<section class="pane"><div class="ph">${kgl(sel)}<span class="title">${kt(sel)}</span><span class="km">${branchLine(sel)}</span><span class="sp"></span>${mt(`<span class="cs ${sel.s}">${sl(sel)}</span>${sepi}${sel.el}${sepi}${sel.tok} tokens`)}${ib(I.ext(), t('Open session', '打开会话'))}${isLive(sel) ? ib(I.stop(), t(`Cancel “${kt(sel)}”`, `取消“${kt(sel)}”`), o.cancel ? 'on' : '') : ''}</div><div class="conv"><div class="col">${childTurn(sel)}</div></div>${dock('', ro)}${pop}</section>`;
  return `${topbar({ sb: true })}${strip}<div class="split">${left}${right}</div>`;
}

/* screen: begin */
const STATES = [
  ['list-open', 'All directions, the session list as a tree: the parent shows how many children it has and the strongest state among them; children are indented under a guide line with machine and worktree branch; one child has a grandchild; a blocked child has the attention dot; a session whose parent was deleted says so'],
  ['list-folded', 'All directions: the parent folded; its count and the attention dot stay on the row, so a child waiting for a permission is visible from the list'],
  ['stop-parent', 'All directions: stopping the parent. “Also stop 4 running children” is checked by default, the four are listed, and the note says what is not affected and that worktrees stay'],
  ['list-open-zh', 'The tree in Simplified Chinese'],
  ['stop-parent-zh', 'The stop dialog in Simplified Chinese'],
  ['a-panel', 'A, a Children tab in the inspector: one row per child with state, elapsed time, tokens, machine and branch; a grandchild hangs under its parent; Cancel all in the footer'],
  ['a-open', 'A: a done child opened in place: its summary, the changed files with status and lines, Open session'],
  ['a-blocked', 'A: a child waits for a permission; its row turns attention-coloured and asks you to open it; the tab carries the dot'],
  ['a-cancel', 'A: cancel one child; a dialog says what stops and what stays (the worktree and branch stay)'],
  ['a-subtree', 'A: cancel a child that has started its own child; the dialog names both and what stays for each'],
  ['a-panel-zh', 'A in Simplified Chinese: the Children tab'],
  ['a-cancel-zh', 'A in Simplified Chinese: the cancel dialog'],
  ['b-card', 'B, a card in the conversation: it replaces the “Started” lines, one table row per child, and the waiting line follows it'],
  ['b-open', 'B: a done child opened in place: summary, changed files, Open session'],
  ['b-blocked', 'B: a child waits for a permission; the strip under its row carries the command and Open to answer'],
  ['b-cancel', 'B: cancel one child; the confirmation opens under its row and says what stops and what stays'],
  ['b-subtree', 'B: cancel a child with a child of its own; the confirmation names both'],
  ['b-card-zh', 'B in Simplified Chinese: the card'],
  ['b-cancel-zh', 'B in Simplified Chinese: the confirmation'],
  ['c-split', 'C, a split view: a strip of children above the session; the selected child is read beside its parent'],
  ['c-blocked', 'C: a child waits for a permission; its chip is attention-coloured and you answer in its pane'],
  ['c-cancel', 'C: cancel the selected child; a popover under its pane header says what stops and what stays'],
  ['c-subtree', 'C: the selected child has a child of its own; the popover names both'],
  ['c-split-zh', 'C in Simplified Chinese: the split view'],
  ['c-blocked-zh', 'C in Simplified Chinese: answering in the pane'],
];
/* screen: end */

function frame(st, scheme) {
  Z = st.endsWith('-zh');
  const lang = Z ? ' lang="zh-Hans"' : '';
  const base = st.replace(/-zh$/, '');
  setBlock(['list-open', 'list-folded', 'stop-parent', 'a-blocked', 'b-blocked', 'c-blocked'].includes(base));
  let o;
  const std = (insp, body, over = '') => ({ cls: insp ? ' with-insp' : '', side: side({ fold: base === 'list-folded' }), main: `${topbar({ insp: !!insp, sb: false })}<div class="conv"><div class="col">${body}</div></div>${dock()}${over}`, insp });
  if (base === 'list-open' || base === 'list-folded') o = std('', pBody());
  else if (base === 'stop-parent') o = std('', pBody({ stopOn: true }), stopDlg());
  else if (base === 'a-panel' || base === 'a-blocked') o = std(panelA(), pBody());
  else if (base === 'a-open') o = std(panelA({ open: 'c5' }), pBody());
  else if (base === 'a-cancel') o = std(panelA(), pBody(), cancelDlg([byId('c1')]));
  else if (base === 'a-subtree') o = std(panelA(), pBody(), cancelDlg([byId('c2'), byId('c2a')]));
  else if (base === 'b-card' || base === 'b-blocked') o = std('', pBody({ card: cardB() }));
  else if (base === 'b-open') o = std('', pBody({ card: cardB({ open: 'c5' }) }));
  else if (base === 'b-cancel') o = std('', pBody({ card: cardB({ cancel: 'c1' }) }));
  else if (base === 'b-subtree') o = std('', pBody({ card: cardB({ cancel: 'c2', sub: true }) }));
  else if (base === 'c-split') o = { cls: ' nosb', main: splitC({ sel: 'c1' }) };
  else if (base === 'c-blocked') o = { cls: ' nosb', main: splitC({ sel: 'c3' }) };
  else if (base === 'c-cancel') o = { cls: ' nosb', main: splitC({ sel: 'c1', cancel: 'leaf' }) };
  else o = { cls: ' nosb', main: splitC({ sel: 'c2', cancel: 'sub' }) };
  if (base === 'a-panel' || base === 'a-open' || base === 'a-cancel' || base === 'a-subtree' || base === 'a-blocked') o.cls = ' with-insp';
  return `<div${lang} class="frame${o.cls || ''} ${scheme}" data-state="${st}">${o.side || ''}<main class="main">${o.main}</main>${o.insp || ''}</div>`;
}

/* ---- the page --------------------------------------------------------------------------------------------------- */
const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  root.innerHTML = `<header class="intro"><h1>Child sessions <span>The session list as a tree, the children of a session, cancel and stop (issue #81, ADR 0035, decision 6)</span></h1>
    <p>ADR 0035 lets a session start sessions of its own, called children, on the same machine or another one, and wait for them. The web UI has to show the tree, show each child’s state without opening it, let the user open a child and read what it did, cancel one child or a whole subtree, and say what stopping a parent does to its children. A child can wait for a permission only the user can answer; that has to reach the user from the list and from the parent. This file mocks up those screens and asks the maintainer to choose where the children live.</p>
    <p><b>Shared.</b> The list is a tree: the parent carries a count and the strongest state among its children (the attention dot when one waits for you, otherwise the spinner), children are indented under a guide line with the machine and the worktree branch, a grandchild goes one level deeper (depth is limited to 2), and a session whose parent was deleted stays at the top level with “Started by a deleted session”. A parent folds like a project folder. Stopping the parent offers “Also stop N running children”, checked by default. Every cancel says what stops and what stays; worktrees and branches always stay. The ids <b>list-open</b>, <b>list-folded</b> and <b>stop-parent</b> are shared by all three directions.</p>
    <p><b>A, a Children tab in the inspector.</b> The panel lives where Changes and Terminal live, so it survives scrolling and stays beside the conversation. One row per child with state, elapsed time and tokens; a done child opens in place to its summary and changed files. Cancel is a button on the row and a confirmation dialog; Cancel all is in the footer. The tab carries the attention dot when a child waits.</p>
    <p><b>B, a card in the conversation.</b> The card replaces the “Started” lines in the parent’s turn: a table, one row per child, opened and cancelled in place, with the permission request as a strip under the row. It reads as part of the story of the turn and needs no panel, but it scrolls away with the turn and cannot stay in view while the parent writes.</p>
    <p><b>C, a split view.</b> A strip of children sits above two panes: the parent on the left, the selected child on the right, read only. A child that waits for a permission is answered in its pane. The most room for reading a child, at the cost of halving the conversation and hiding the sidebar.</p>
    <p>Each state is also shown in Simplified Chinese (ids ending <b>-zh</b>); strings that are not in <b>zh-Hans.json</b> yet are proposals for it. The token cap per tree is not shown because its value is not decided; the limits shown (4 live children per session, 8 per tree) are those of ADR 0035.</p></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}

document.querySelectorAll('.kid.open').forEach(e => { e.parentElement.scrollTop = e.parentElement.scrollHeight; });
document.querySelectorAll('.kw.open').forEach(e => { const c = e.closest('.conv'); c.scrollTop = c.scrollHeight; });
</script></body></html>
