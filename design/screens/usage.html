<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* one type scale: meta 11/16 · UI 13/20 · prose 15/24 · title 15/20 600 · mono 12.5/20; weights 400/500/600 */
.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.with-insp{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.nosb,.frame.page{grid-template-columns:1fr}
.frame.nosb.with-insp{grid-template-columns:1fr var(--layout-inspector)}
.frame.with-insp.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}

/* icon buttons: the icon carries the intent, the title names it */
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib[disabled]{opacity:.4;cursor:default}
.ib.bd{color:var(--color-text-2);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .ib.bd{background:var(--color-raised)}
.ib .cdg{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--color-git-modified);box-shadow:0 0 0 2px var(--color-bg)}

/* a machine's view options: its name, then Organize and Sort as two radio groups under the row */
.pop{position:absolute;z-index:30;top:calc(100% - var(--space-1));left:var(--space-2);right:var(--space-2);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-title{padding:var(--space-2) var(--space-2) var(--space-1);font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-label{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.menu-check{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.menu-sep{height:1px;margin:var(--space-1) var(--space-2);background:var(--color-line)}
.pm{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sess.on .pm{color:var(--color-text-2)}
.gl{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.gl .spin{color:var(--color-accent)}
.need-dot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring)}
.bad-dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.ready-dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex:none}
.off-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.devg.off .dev,.devg.off .sdir,.devg.off .sess{color:var(--color-text-3)}
.devg.off .dev{font-weight:var(--weight-medium)}
.devg.off .sess.on{color:var(--color-text-2)}
.frozen-side .gl .spin{color:var(--color-text-3);animation:none}
.side-foot{height:var(--layout-foot);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4);box-shadow:inset 0 1px 0 var(--color-line);flex:none}
.conn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);white-space:nowrap}
.conn .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.conn.lost{color:var(--color-danger)}
.conn.lost .dot{background:var(--color-danger)}

/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3) 0 var(--space-5);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.nosb .top{padding-left:var(--space-3)}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.top .sp{flex:1}

/* conversation */
.conv{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:0 0 148px}
.conv::-webkit-scrollbar{display:none}
.col{width:min(var(--layout-column),calc(100% - 104px));margin:0 auto;padding-top:var(--space-2)}
.wide .col{width:calc(100% - 48px)}

.badge{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-variant-numeric:tabular-nums}
/* text buttons: decisions only */
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}
.light .btn{background:var(--color-raised)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);font-weight:var(--weight-semibold);padding:0 var(--space-4)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--color-text-2);padding:0 var(--space-2)}
.btn svg{color:currentColor}
.btn[disabled]{opacity:.5;cursor:default}

/* composer */
.dock{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:var(--space-7) 0 var(--space-4);background:linear-gradient(var(--fade-bg),var(--color-bg) 42%);pointer-events:none}
.composer{pointer-events:auto;border-radius:var(--radius-xl);background:var(--color-raised);box-shadow:var(--shadow-float);padding:var(--space-3) var(--space-2) var(--space-2) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.ph{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text-3)}
.cf{display:flex;align-items:center;gap:var(--space-1);min-height:var(--control-field);margin-left:calc(-1 * var(--space-2))}
.cf .cst{display:flex;align-items:center;gap:var(--space-2);height:20px;color:var(--color-text-2);margin:0 0 0 var(--space-1);padding-left:var(--space-3);box-shadow:inset 1px 0 0 var(--color-line)}
.cf .cst.bad{color:var(--color-danger)}
.cf .r{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.send{width:var(--control-field);height:var(--control-field);border-radius:50%;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);flex:none}
.send[disabled]{background:var(--color-hover);color:var(--color-text-3);box-shadow:none;cursor:default}
.composer.cbar{flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-5);min-height:56px}
.composer.cbar .cst{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2);flex:1}
.composer.cbar .cst svg{color:var(--color-text-3)}
.composer.ro{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.recrow{display:flex;align-items:center;gap:var(--space-3);height:24px;padding-right:var(--space-2)}
.recrow .rdot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-soft);animation:pulse var(--motion-pulse) ease-in-out infinite;flex:none}
.recrow .el{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);font-variant-numeric:tabular-nums;width:36px;flex:none}
.wave{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;height:24px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 18%);mask-image:linear-gradient(to right,transparent,#000 18%)}
.wave i{flex:none;width:3px;border-radius:2px;background:var(--color-accent-text)}
.cf .note{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);margin-left:var(--space-3)}

.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);position:relative}
.light .seg{background:var(--color-hover)}
.seg button{height:24px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:6px;font-weight:var(--weight-medium);color:var(--color-text-2);white-space:nowrap}
.seg button .c{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;font-weight:var(--weight-regular)}
.seg button.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .seg button.on{background:var(--color-raised)}
.seg button.on .c{color:var(--color-text-2)}
.seg button[disabled]{color:var(--color-text-3);opacity:.6;cursor:default}
.fld{display:flex;flex-direction:column;gap:var(--space-1)}
.fld .l{color:var(--color-text-2)}
.input{height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);display:flex;align-items:center;padding:0 var(--space-3);font-family:var(--font-mono);font-size:var(--text-code);color:var(--color-text);white-space:nowrap;overflow:hidden}
.input.on{box-shadow:inset 0 0 0 1.5px var(--color-accent)}
.input.ui{font-family:var(--font-ui);font-size:var(--text-ui)}
.nt{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);display:flex;gap:var(--space-2);color:var(--color-text)}
.nt svg{margin-top:2px}
.nt.bad{background:var(--color-del-bg)}
.nt.bad svg{color:var(--color-danger)}
.nt.ok{background:var(--color-add-bg)}
.nt.ok svg{color:var(--color-success)}
.nt.snap{background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2)}
.nt.snap svg{color:var(--color-text-3)}
.sel{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);white-space:nowrap}
.sel .v{flex:1;overflow:hidden;text-overflow:ellipsis}
.sel > svg{color:var(--color-text-3)}
.sel .pm{color:var(--color-text-2)}
.sel .sl{width:16px;height:16px;display:grid;place-items:center;flex:none}
.tgls{display:flex;gap:var(--space-4);align-items:center;height:var(--control-field)}
.tgl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2)}
.switch{width:28px;height:16px;border-radius:8px;background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--color-text-3)}
.switch.on{background:var(--color-accent);box-shadow:none}
.switch.on::after{left:14px;background:var(--color-on-accent)}
/* settings */
.set{flex:1;min-height:0;display:grid;grid-template-columns:var(--layout-settings-nav) minmax(0,1fr)}
.snav{padding:var(--space-3) var(--space-2);box-shadow:inset -1px 0 0 var(--color-line);display:flex;flex-direction:column;gap:2px}
.ni{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2)}
.ni svg{color:var(--color-text-3)}
.ni.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ni.on svg{color:var(--color-text-2)}
.spage{overflow:auto;padding:var(--space-4) var(--space-7) var(--space-5)}
.spage .in{max-width:620px;margin:0 auto}
.spage h1{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;margin-bottom:var(--space-5)}
.sgrp + .sgrp{margin-top:var(--space-5)}
.sgrp .lb{font-weight:var(--weight-semibold);color:var(--color-text);margin-bottom:var(--space-2)}
.themes{display:flex;gap:var(--space-4)}
.thc{display:flex;flex-direction:column;gap:var(--space-2)}
.thp{width:164px;height:88px;border-radius:var(--radius-md);overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--color-line)}
.thc.on .thp{box-shadow:0 0 0 2px var(--color-accent)}
.thp .mini{position:absolute;inset:0;display:grid;grid-template-columns:40px 1fr}
.thp .mini.half{clip-path:polygon(100% 0,100% 100%,0 100%)}
.thp .ms{display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.thp .ms i,.thp .mc i{display:block;height:4px;border-radius:2px}
.thp .mc{display:flex;flex-direction:column;gap:8px;padding:12px}
.thp .mc .cb{margin-top:auto;height:16px;border-radius:6px}
.rl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text)}
.radio{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.radio.on{box-shadow:inset 0 0 0 5px var(--color-accent)}
.plist{border-radius:var(--radius-md);background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line);overflow:hidden}
.light .plist{background:var(--color-raised)}
.pr{height:44px;display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4)}

.plh{display:flex;justify-content:space-between;padding:0 var(--space-4) var(--space-2)}
.sact{margin-top:var(--space-4)}
.mcard{margin-top:var(--space-4);padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-live);display:flex;flex-direction:column;gap:var(--space-4)}
.mcard-h{display:flex;align-items:center;gap:var(--space-2);margin:calc(-1 * var(--space-1)) calc(-1 * var(--space-2)) 0 0}
.mcard-h b{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold)}
.mcard-h .ib{margin-left:auto}
.mrow{display:flex;gap:var(--space-2);align-items:flex-end}
.mrow .fld{flex:1}
.ms-list{display:flex;flex-direction:column;gap:var(--space-4);padding-top:var(--space-4);box-shadow:inset 0 1px 0 var(--color-line)}
.mstep{display:grid;grid-template-columns:20px minmax(0,1fr);column-gap:var(--space-3);align-items:start}
.mstep .n{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-semibold);color:var(--color-text-3);box-shadow:inset 0 0 0 1.5px var(--color-line);font-variant-numeric:tabular-nums}
.mstep .n svg{width:12px;height:12px}
.mstep.ok .n{background:var(--color-add-bg);color:var(--color-success);box-shadow:none}
.mstep.go .n{box-shadow:none}
.mstep.go .n .spin{color:var(--color-accent)}
.mstep .tx{color:var(--color-text)}
.mstep.todo .tx{color:var(--color-text-2)}
.mstep .tx .mono{white-space:nowrap}
.mstep .tx .sub{color:var(--color-text-3)}
.mstep .more{grid-column:2;margin-top:2px}
.mstep .well{grid-column:2;margin:var(--space-3) 0 0}
.cfg-f{grid-column:2;display:flex;align-items:center;gap:var(--space-3);margin-top:var(--space-3)}
.mcard-f{display:flex;justify-content:flex-end}

.pr .nm .meta{display:block;font-weight:var(--weight-regular)}
.pr .seg{flex:none}
.pr.hint{height:48px}
.pr .switch{margin-right:2px}
.tprev{margin-top:var(--space-3);padding:var(--space-4);border-radius:var(--radius-md);background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line);display:flex;flex-direction:column;gap:var(--space-3)}
.light .tprev{background:var(--color-raised)}
.tprev .text{margin:0}
.tprev .pc{padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);white-space:nowrap;overflow:hidden}
.light .tprev .pc{background:var(--color-hover)}
.no-lig .mono,.no-lig .wb,.no-lig .diff,.no-lig .code,.no-lig .text code{font-variant-ligatures:none;font-feature-settings:"liga" 0,"calt" 0}

/* settings › model providers (#16): read-only, from what each connected agent announces in device.hello */
.mp-note{display:flex;gap:var(--space-2);align-items:flex-start;color:var(--color-text-2);margin:calc(-1 * var(--space-3)) 0 var(--space-5)}
.mp-note svg{color:var(--color-text-3);margin-top:2px}
.mp-tabs{display:flex;gap:var(--space-4);margin-bottom:var(--space-4);box-shadow:inset 0 -1px 0 var(--color-line);overflow-x:auto}
.mp-tab{display:inline-flex;align-items:center;gap:var(--space-2);height:var(--control-field);padding:0 2px;color:var(--color-text-2);font-weight:var(--weight-medium);white-space:nowrap;position:relative;flex:none}
.mp-tab[aria-selected="true"]{color:var(--color-text)}
.mp-tab[aria-selected="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;border-radius:2px 2px 0 0;background:var(--color-text)}
.mp-list{border-radius:var(--radius-md);background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line);overflow:hidden}
/* stacked view */
body.stacked{background:#131210;color:#efe9e2;font-family:-apple-system,"SF Pro Text",system-ui,sans-serif;padding:56px 48px 80px;-webkit-font-smoothing:antialiased}
.intro{max-width:1300px;margin:0 auto 56px}
.intro h1{font-size:30px;font-weight:600;letter-spacing:-0.02em}
.intro h1 span{color:#958d83;font-weight:400}
.intro p{max-width:72ch;color:#b8b0a6;font-size:15px;line-height:1.6;margin:14px 0 0}
.intro .cols{display:grid;grid-template-columns:1fr 1fr;gap:48px;margin:32px 0 36px;max-width:1100px}
.intro h2{font-size:22px;font-weight:600;letter-spacing:-0.015em;margin:48px 0 8px}
.intro h3{font-size:14px;font-weight:600;margin-bottom:10px;color:#efe9e2}
.intro ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5;color:#b8b0a6}
.intro li b{color:#efe9e2;font-weight:500}
.intro .chip{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:-1px}
.tok{border-collapse:collapse;font-size:12px;color:#b8b0a6;width:100%;max-width:1100px;margin-top:48px}
.tok th{text-align:left;font-weight:500;color:#958d83;padding:6px 10px;border-bottom:1px solid rgba(255,238,220,.1)}
.tok td{padding:4px 10px;border-bottom:1px solid rgba(255,238,220,.05);font-family:ui-monospace,"SF Mono",Menlo,monospace;vertical-align:middle;word-break:break-all}
.tok td:first-child{color:#efe9e2;white-space:nowrap;word-break:normal}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-2px;box-shadow:0 0 0 1px rgba(255,255,255,.15)}
.st{max-width:1300px;margin:0 auto 56px}
.st h2{font-size:18px;font-weight:600;margin-bottom:16px;letter-spacing:-0.01em}
.st h2 span{color:#958d83;font-weight:400;margin-left:12px;font-size:14px}
.pair{display:flex;gap:20px}
.scaled{width:640px;height:400px;overflow:hidden;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.scaled .frame{transform:scale(.5);transform-origin:0 0}

/* machine resources (#88): the summary, where the load goes, the session processes */
.rmeta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-2);font-variant-numeric:tabular-nums;font-weight:var(--weight-regular)}
.rmeta.dim{color:var(--color-text-3)}
p.rmeta{margin:0}
.rbody{display:flex;flex-direction:column;gap:var(--space-4);font-weight:var(--weight-regular);white-space:normal}
.rst{display:flex;align-items:center;gap:var(--space-1)}
.rst svg{width:14px;height:14px;flex:none}
.rtiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-2)}
.rtile{display:flex;flex-direction:column;gap:2px;min-width:0;padding:var(--space-2) var(--space-3);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line)}
.rtile .rk{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.rtile .rv{font-size:var(--text-title);line-height:20px;font-weight:var(--weight-semibold);color:var(--color-text);font-variant-numeric:tabular-nums;white-space:nowrap}
.rtile .rv .rmeta{font-weight:var(--weight-regular)}
.rtile .rsp{width:100%;height:24px;margin-top:var(--space-1)}
.rdisk{display:block;height:4px;margin:14px 0 6px;border-radius:2px;background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);overflow:hidden}
.rdisk i{display:block;height:100%;background:var(--color-text-3)}
.rtile.warn .rdisk i{background:var(--color-attention)}
.rtile.warn .rv,.rtile.warn .rsp{color:var(--color-attention-text)}
.rwn{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-attention-text);margin:calc(var(--space-2) * -1) 0 0}
.rwn svg{width:14px;height:14px;flex:none}
.rsp{display:block;color:var(--color-text-3)}
.rsp.sm{width:64px;height:16px}
.rsec{display:flex;flex-direction:column;gap:var(--space-2)}
.rbar{display:grid;grid-template-columns:56px minmax(0,1fr) 76px;align-items:center;gap:var(--space-2)}
.rbar .rl2{color:var(--color-text-2)}
.rbar .rn{text-align:right;font-variant-numeric:tabular-nums;color:var(--color-text-2);font-size:var(--text-meta);line-height:var(--leading-meta)}
.rstack{position:relative;display:flex;gap:1px;height:10px;border-radius:3px;background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);overflow:hidden}
.rstack i{display:block;height:100%;background:var(--color-accent);flex:none}
.rstack i.s0,.rw.s0{opacity:.95}.rstack i.s1,.rw.s1{opacity:.7}.rstack i.s2,.rw.s2{opacity:.5}.rstack i.s3,.rw.s3{opacity:.34}
.rstack i.ot,.rw.ot{background:var(--color-text-3);opacity:.55}
.rtick{position:absolute;top:0;bottom:0;width:1px;background:var(--color-text-2);opacity:.7}
.rtick.warn{background:var(--color-attention);opacity:1}
.rleg{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);padding-left:calc(56px + var(--space-2));font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.rleg span{display:inline-flex;align-items:center;gap:var(--space-1)}
.rw{display:block;width:8px;height:8px;border-radius:2px;background:var(--color-accent);flex:none}
.rw.fr{background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);opacity:1}
.rps{display:flex;flex-direction:column}
.rp{display:grid;grid-template-columns:8px 16px minmax(0,1fr) 16px 64px 40px 64px;gap:var(--space-2);align-items:center;height:44px;box-shadow:inset 0 1px 0 var(--color-line)}
.rp.hd{height:28px;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.rp.hd .h1{grid-column:1/5}
.rp .ti{min-width:0;display:flex;flex-direction:column}
.rp:not(.hd){margin:0 calc(-1 * var(--space-2));padding:0 var(--space-2);border-radius:6px;cursor:pointer}
.rp:not(.hd):hover,.rp.hov{background:var(--color-hover)}
.rp:not(.hd):focus-visible{outline:2px solid var(--color-accent);outline-offset:-2px}
.rp .t1{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-text)}
.rp:hover .t1,.rp.hov .t1{text-decoration:underline;text-decoration-color:var(--color-text-3);text-underline-offset:2px}
.rp .t2{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.rp .n{text-align:right;font-variant-numeric:tabular-nums}
.rp:not(.hd) .n{color:var(--color-text-2)}
.rp .pm,.rp .gl{width:16px;height:16px}
.rbody.stale .rv,.rbody.stale .rk{color:var(--color-text-3)}
.rbody.stale .rsp{opacity:.6}
.mt-bar{display:flex;align-items:flex-start;gap:var(--space-4);margin-bottom:var(--space-4);box-shadow:inset 0 -1px 0 var(--color-line)}
.mt-bar .mp-tabs{flex:1;min-width:0;margin-bottom:0;box-shadow:none}
.mt-bar .btn{flex:none;height:var(--control-field)}
.rmeta.mt-facts{margin:0 0 var(--space-3)}
.rfoot{margin:0}
.rth{display:flex;flex-direction:column;gap:var(--space-3);padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--color-line)}
.th-h{display:flex;align-items:center;gap:var(--space-3)}
.th-h b{font-weight:var(--weight-semibold);flex:1}
.th-h>:last-child{margin-left:auto}
.th-sum{display:flex;align-items:center;gap:var(--space-3);color:var(--color-text-2)}
.th-sum .btn{margin-left:auto;flex:none}
.th-sum b{color:var(--color-text);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums}
.th-row{display:flex;gap:var(--space-3)}
.th-f{width:160px}
.th-in{justify-content:space-between;font-variant-numeric:tabular-nums}
.rth p.meta{margin:0}
.ctag{display:inline-flex;align-items:center;gap:var(--space-1);height:20px;padding:0 var(--space-2) 0 var(--space-1);border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2);font-size:var(--text-meta);line-height:var(--leading-meta)}
.ctag .pm{width:16px;height:16px}
.toast{position:absolute;left:50%;bottom:var(--space-4);transform:translateX(-50%);z-index:8;height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4) 0 var(--space-3);border-radius:999px;background:var(--color-raised);box-shadow:var(--shadow-float);white-space:nowrap}
.toast svg{color:var(--color-success)}

/* usage, cost and budgets (#75) */
.light .mp-list{background:var(--color-raised)}
.text{font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);margin:var(--space-1) 0 var(--space-3);max-width:var(--measure-prose)}
.dim{color:var(--color-text-3)}
.ph.typed{color:var(--color-text)}

/* the range bar and the section heads */
.ubar{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-4)}
.ubar .sp{flex:1}
.rnav{display:flex;align-items:center;gap:var(--space-1)}
.rnav .lab{min-width:132px;text-align:center;font-weight:var(--weight-medium);font-variant-numeric:tabular-nums}
.ubar .input{width:132px;font-family:var(--font-ui);font-size:var(--text-ui)}
.ubar .to{color:var(--color-text-3)}
.ugh{display:flex;align-items:center;gap:var(--space-3);margin:var(--space-5) 0 var(--space-2)}
.ugh b{font-weight:var(--weight-semibold);flex:1}
.ufoot{margin:var(--space-2) 0 0;color:var(--color-text-3)}
.ufoot.dim{color:var(--color-text-3)}

/* totals */
.utot{display:flex;align-items:baseline;gap:var(--space-3);flex-wrap:wrap}
.utot b{font-size:20px;line-height:28px;font-weight:var(--weight-semibold);letter-spacing:-0.012em;font-variant-numeric:tabular-nums}
.utot .u{color:var(--color-text-2)}
.utot .cost{color:var(--color-text-2);font-variant-numeric:tabular-nums}
.utot .cost b{font-size:var(--text-title);line-height:var(--leading-title);color:var(--color-text)}
.ubrk{display:flex;gap:var(--space-4);flex-wrap:wrap;margin-top:var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.ubrk b{font-weight:var(--weight-medium);color:var(--color-text-2)}
.ucard{padding:var(--space-4);border-radius:var(--radius-md);background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.light .ucard{background:var(--color-raised)}

/* the chart: a column per day, stacked by model with the accent in opacity steps */
.uleg{display:flex;flex-wrap:wrap;gap:var(--space-1) var(--space-3);margin:var(--space-3) 0 0;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.uleg span{display:inline-flex;align-items:center;gap:var(--space-1)}
.uchart{display:grid;grid-template-columns:32px minmax(0,1fr);margin-top:var(--space-4)}
.uy{height:120px;display:flex;flex-direction:column;justify-content:space-between;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;margin-top:-8px;padding-bottom:0}
.uy span:last-child{margin-bottom:-8px}
.uplot{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--space-4);padding:0 var(--space-2)}
.ugl{position:absolute;left:0;right:0;top:0;height:120px;pointer-events:none}
.ugl i{position:absolute;left:0;right:0;height:1px;background:var(--color-line)}
.uc{position:relative;display:flex;flex-direction:column;align-items:stretch;min-width:0}
.ucs{height:120px;display:flex;flex-direction:column-reverse;justify-content:flex-start;position:relative}
.ucs i{display:block;width:100%;background:var(--color-accent);box-shadow:0 -1px 0 var(--color-surface)}
.light .ucs i{box-shadow:0 -1px 0 var(--color-raised)}
.ucs i.s0{opacity:.95}.ucs i.s1{opacity:.7}.ucs i.s2{opacity:.5}.ucs i.ot{background:var(--color-text-3);opacity:.55}
.ucs i:last-child{border-radius:3px 3px 0 0}
.ucs.pend{border-bottom:1px dashed var(--color-line)}
.ucl{margin-top:var(--space-1);text-align:center;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.uc.hov .ucl{color:var(--color-text)}
.uc.hov .ucs i{filter:brightness(1.12)}
.utip{position:absolute;z-index:4;top:0;left:50%;transform:translateX(-50%);min-width:148px;padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float);display:flex;flex-direction:column;white-space:nowrap}
.light .utip{background:var(--color-raised)}
.utip b{font-weight:var(--weight-semibold)}
.utip span{color:var(--color-text-2);font-variant-numeric:tabular-nums}

/* the group tables */
.ur{display:grid;grid-template-columns:var(--cols);gap:var(--space-3);align-items:center;min-height:40px;padding:0 var(--space-4)}
.ur + .ur{box-shadow:inset 0 1px 0 var(--color-line)}
.ur.hd{min-height:28px;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.ur .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--color-text-2)}
.ur .n.c{color:var(--color-text)}
.ur.hd .n{color:var(--color-text-3)}
.ur .un{min-width:0;display:flex;flex-direction:column}
.ur .t1{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ur .t2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.np{display:inline-flex;align-items:center;height:20px;padding:0 var(--space-2);border-radius:var(--radius-sm);box-shadow:inset 0 0 0 1px var(--color-line);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);justify-self:end}

/* empty, backfill */
.uempty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-7) var(--space-6)}
.uempty .tile{width:40px;height:40px;border-radius:var(--radius-md);display:grid;place-items:center;background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-3)}
.uempty b{font-weight:var(--weight-semibold)}
.uempty p{margin:0;max-width:44ch;color:var(--color-text-2)}
.uempty .acts{margin-top:var(--space-2);display:flex;gap:var(--space-2)}
.bf{display:flex;flex-direction:column;gap:var(--space-1);flex:1;min-width:0}
.bf b{font-weight:var(--weight-semibold);color:var(--color-text)}
.bf .pbar{flex:none;align-self:stretch}
.nt .spin{color:var(--color-accent)}
.nt .acts{margin-left:auto;align-self:center;flex:none}

/* budgets */
.pbar{position:relative;height:6px;border-radius:3px;background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);flex:1}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--color-text-3)}
.pbar u{position:absolute;top:-3px;bottom:-3px;width:1.5px;background:var(--color-text-2);opacity:.8;text-decoration:none}
.pbar.warn i{background:var(--color-attention)}
.pbar.stop i{background:var(--color-danger)}
.pbar.go i{background:var(--color-accent)}
.bg{display:flex;flex-direction:column;gap:var(--space-2);padding:var(--space-3) var(--space-4)}
.bg + .bg{box-shadow:inset 0 1px 0 var(--color-line)}
.bgh{display:flex;align-items:center;gap:var(--space-3)}
.bgh .pm{color:var(--color-text-2)}
.bgh .tx{flex:1;min-width:0;display:flex;flex-direction:column}
.bgh .nm{font-weight:var(--weight-medium)}
.bgv{font-variant-numeric:tabular-nums;font-weight:var(--weight-medium);white-space:nowrap}
.bgv i{font-style:normal;font-weight:var(--weight-regular);color:var(--color-text-3)}
.bgb{display:flex;align-items:center;gap:var(--space-3);padding-left:calc(16px + var(--space-3))}
.bgb .pc{width:40px;text-align:right;font-variant-numeric:tabular-nums;color:var(--color-text-2)}

.opt .tx{display:flex;flex-direction:column}

.opt .tx span{color:var(--color-text-3)}
.mcard .del{margin-right:auto;color:var(--color-danger)}
.mcard-f{gap:var(--space-2)}

/* prices */
.pt{--cols:minmax(0,1fr) 68px 68px 76px 76px 64px}
.pt .ur{min-height:44px}
.pt .ur .n{color:var(--color-text)}
.pt .ur.hd .n{color:var(--color-text-3)}
.pt .own{justify-self:end;display:inline-flex;align-items:center;gap:var(--space-1)}

.prow-edit{padding:var(--space-3) var(--space-4) var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);background:var(--color-bg);box-shadow:inset 0 1px 0 var(--color-line)}
.light .prow-edit{background:var(--color-hover)}
.prow-edit .hd2{display:flex;align-items:baseline;gap:var(--space-3)}

.prow-edit .f4{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-3)}
.prow-edit .fo{display:flex;justify-content:flex-end;gap:var(--space-2)}

/* the session top bar */
.top .ctx{color:var(--color-text-3);margin-left:var(--space-2)}

.uchip:hover,.uchip[aria-expanded="true"]{background:var(--color-hover);color:var(--color-text)}
.uchip[aria-expanded="true"]{background:var(--color-selected);box-shadow:inset 0 1px 0 var(--color-highlight)}
.uchip .sep{color:var(--color-text-3)}
.uchip .adot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);flex:none}
.upop{position:absolute;z-index:30;top:calc(var(--layout-topbar) - var(--space-1));right:var(--space-7);width:var(--layout-popover-wide);padding:var(--space-3) var(--space-4) var(--space-4);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float);display:flex;flex-direction:column;gap:var(--space-3)}
.upop .ph1{display:flex;align-items:baseline;gap:var(--space-2)}
.upop .ph1 b{font-weight:var(--weight-semibold);flex:1}
.upop .big{display:flex;align-items:baseline;gap:var(--space-3)}
.upop .big b{font-size:20px;line-height:28px;font-weight:var(--weight-semibold);letter-spacing:-0.012em;font-variant-numeric:tabular-nums}
.upop .big span{color:var(--color-text-2);font-variant-numeric:tabular-nums}
.ukv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:var(--space-1) var(--space-4);align-items:baseline}
.ukv .k{color:var(--color-text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ukv .v{text-align:right;font-variant-numeric:tabular-nums}
.ukv .v.m{color:var(--color-text-2);min-width:56px}
.ukv.hd{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.ukv .k.mono{font-family:var(--font-mono);font-size:var(--text-code)}
.upop .rule{height:1px;background:var(--color-line);margin:0 calc(-1 * var(--space-4))}
.upop .bl{display:flex;flex-direction:column;gap:var(--space-1)}
.upop .bl .row{display:flex;align-items:center;gap:var(--space-2)}
.upop .bl .row span{flex:1;color:var(--color-text-2)}
.upop .bl .row em{font-style:normal;font-variant-numeric:tabular-nums}
.upop .bl .row em.warn{color:var(--color-attention-text)}
.upop .bl .pbar{margin-left:calc(16px + var(--space-2));flex:none;width:auto}
.mu{display:flex;gap:var(--space-2);flex-wrap:wrap;margin:calc(-1 * var(--space-1)) 0 var(--space-3);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.cp{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;padding:var(--space-5) 0 var(--space-2)}
.cwork{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2);margin:var(--space-2) 0}
.cf .cst.warn{color:var(--color-attention-text)}
.composer.cbar .cst.warn{color:var(--color-attention-text)}
.composer.cbar .cst.warn svg{color:var(--color-attention-text)}
.composer.cbar .cst .sub{color:var(--color-text-3)}
.solo .scaled{width:auto;height:auto}
</style>
</head>
<body>
<div id="root"></div>
<script>
const T = JSON.parse(document.getElementById('tokens').textContent);
const vars = o => Object.entries(o).map(([k, v]) => `${k}:${v};`).join('');
document.getElementById('token-css').textContent =
  `.frame{${vars(T.shared)}}.frame.dark{${vars(T.dark)}}.frame.light{${vars(T.light)}}`;

/* icons: one family, Lucide (ISC licence), inlined; 24-unit grid drawn at 16 px, stroke 1.5, round caps and joins */
const sv = (d, cls = '') => `<svg${cls ? ` class="${cls}"` : ''} width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const rot = (deg, d) => `<g transform="rotate(${deg} 12 12)">${d}</g>`;
const L = {
  'panel-left': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/>',
  'panel-right': '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M15 3v18"/>',
  plus: '<path d="M5 12h14"/><path d="M12 5v14"/>',
  'chevron-right': '<path d="m9 18 6-6-6-6"/>',
  'arrow-up': '<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  folder: '<path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/>',
  globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
  paperclip: '<path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/>',
  mic: '<path d="M12 19v3"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><rect x="9" y="2" width="6" height="13" rx="3"/>',
  x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  'circle-alert': '<circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/>',
  info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/>',
  'rotate-cw': '<path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/>',
  pencil: '<path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/>',
  laptop: '<path d="M20 16V7a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9m16 0H4m16 0 1.28 2.55a1 1 0 0 1-.9 1.45H3.62a1 1 0 0 1-.9-1.45L4 16"/>',
  contrast: '<circle cx="12" cy="12" r="10"/><path d="M12 18a6 6 0 0 0 0-12v12z"/>',
  plug: '<path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/>',
  bell: '<path d="M10.268 21a2 2 0 0 0 3.464 0"/><path d="M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326"/>',
  trash: '<path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>',
  'loader-circle': '<path d="M21 12a9 9 0 1 1-6.219-8.56"/>',
  'chart-column': '<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/>',
  pause: '<rect x="14" y="3" width="5" height="18" rx="1"/><rect x="5" y="3" width="5" height="18" rx="1"/>',
  square: '<rect width="18" height="18" x="3" y="3" rx="2"/>',
  lock: '<rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
};
const I = {
  sidebar: () => sv(L['panel-left']),
  panel: () => sv(L['panel-right']),
  plus: () => sv(L.plus),
  chev: () => sv(L['chevron-right']),
  down: () => sv(rot(90, L['chevron-right'])),
  back: () => sv(rot(180, L['chevron-right'])),
  up: () => sv(L['arrow-up']),
  folder: () => sv(L.folder),
  globe: () => sv(L.globe),
  clip: () => sv(L.paperclip),
  mic: () => sv(L.mic),
  x: () => sv(L.x),
  check: () => sv(L.check),
  alert: () => sv(L['circle-alert']),
  info: () => sv(L.info),
  retry: () => sv(L['rotate-cw']),
  pen: () => sv(L.pencil),
  laptop: () => sv(L.laptop),
  contrast: () => sv(L.contrast),
  plug: () => sv(L.plug),
  bell: () => sv(L.bell),
  trash: () => sv(L.trash),
  chart: () => sv(L['chart-column']),
  pause: () => sv(L.pause),
  stop: () => sv(L.square),
  lock: () => sv(L.lock),
};
const spin = () => sv(L['loader-circle'], 'spin');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const tip = s => ` title="${s}" aria-label="${s}"`;
const ib = (icon, s, cls = '', off = false) => `<button class="ib ${cls}"${tip(s)}${off ? ' disabled' : ''}>${icon}</button>`;
const btn = (label, icon = '', cls = '', s = '', off = false) => `<button class="btn ${cls}"${s ? tip(s) : ''}${off ? ' disabled' : ''}>${icon}${label}</button>`;
const code = s => `<span class="mono">${esc(s)}</span>`;

/* the interface language of the frame being drawn: the mockup is written in English, Simplified Chinese is the zh-Hans.json wording */
let Z = false;
const t = (en, zh) => (Z ? zh : en);

/* ---- the invented data: one week, every table adds up to the same totals ------------------------------------- */
const fm = v => (v >= 1 ? `${v.toFixed(1)}M` : `${Math.round(v * 1000)}k`);
const fc = c => (c == null ? '—' : `$${c.toFixed(2)}`);
const TOTAL = { tok: 18.4, cost: 36.04, br: [1.2, 0.9, 2.1, 14.2] };
const DAYS = [['Mon', '周一', 12], ['Tue', '周二', 13], ['Wed', '周三', 14], ['Thu', '周四', 15], ['Fri', '周五', 16], ['Sat', '周六', 17], ['Sun', '周日', 18]];
/* tokens per day in M by model: opus, sonnet, haiku, glm */
const DM = [[0.4, 1.5, 0.6, 0.3], [0.6, 1.9, 0.8, 0.3], [0.1, 0.7, 0.3, 0.1], [0.2, 0.8, 0.4, 0.2], [0.5, 1.6, 0.7, 0.3], [0.7, 1.9, 0.8, 0.5], [0.4, 1.0, 0.4, 0.4]];
const DC = [5.2, 7.1, 1.9, 2.4, 6.3, 8.5, 4.64];
const MODELS = [
  ['claude-opus-5', 'claude-opus-5', 2.9, 18.23, 's0'],
  ['claude-sonnet-5', 'claude-sonnet-5', 9.4, 15.59, 's1'],
  ['claude-haiku-5', 'claude-haiku-5', 4.0, 2.22, 's2'],
  ['glm-5', 'glm-5', 2.1, null, 'ot'],
];
/* [name, sub, tokens in M, estimated cost, [input, output, cache write, cache read]] */
const GROUPS = {
  session: [
    ['byte cursor catalog', 'hoplet · MacBook Pro', 3.2, 8.12],
    ['Wire protocol review', 'hoplet · MacBook Pro', 2.4, 6.5],
    ['Fix flaky clone test', 'hoplet-agent · studio', 1.9, 4.33],
    ['Trim the settings copy', 'hoplet-docs · MacBook Pro', 1.4, 3.1],
    ['Backfill the blog tags', 'blog-site · office-mini', 1.1, null],
    [['41 more sessions', '另外 41 个会话'], '', 8.4, 13.99],
  ],
  project: [
    ['hoplet', '', 10.5, 24.37, [0.7, 0.5, 1.2, 8.1]],
    ['hoplet-agent', '', 4.1, 8.41, [0.3, 0.2, 0.5, 3.1]],
    ['hoplet-docs', '', 1.7, 3.26, [0.1, 0.1, 0.2, 1.3]],
    ['blog-site', '', 2.1, null, [0.1, 0.1, 0.2, 1.7]],
  ],
  machine: [
    ['MacBook Pro', 'macOS · arm64', 10.8, 24.4],
    ['studio', 'Linux · arm64', 5.5, 11.64],
    ['office-mini', 'Linux · amd64', 2.1, null],
  ],
  model: MODELS.map(([n, , tk, c]) => [n, '', tk, c]),
};
const GN = { session: ['Session', '会话'], project: ['Project', '项目'], machine: ['Machine', '机器'], model: ['Model', '模型'] };
const nm = n => (Array.isArray(n) ? t(n[0], n[1]) : n);

/* ---- Settings frame --------------------------------------------------------------------------------------------- */
function nav() {
  const ni = (on, icon, label) => `<div class="ni${on ? ' on' : ''}">${icon}${label}</div>`;
  return `<nav class="snav" aria-label="${t('Settings sections', '设置分区')}">
    ${ni(false, I.contrast(), t('Appearance', '外观'))}${ni(false, I.laptop(), t('Machines', '机器'))}${ni(false, I.plug(), t('Model providers', '模型提供方'))}${ni(false, I.bell(), t('Notifications', '通知'))}${ni(true, I.chart(), t('Usage', '用量'))}
  </nav>`;
}
function tabs(active) {
  const tab = (k, label, n) => `<span class="mp-tab" role="tab" aria-selected="${active === k}">${label}${n ? `<span class="meta">${n}</span>` : ''}</span>`;
  return `<div class="mp-tabs" role="tablist">${tab('usage', t('Usage', '用量'))}${tab('budgets', t('Budgets', '预算'), 4)}${tab('prices', t('Prices', '价格'))}</div>`;
}
function settingsShell(body) {
  return `<header class="top">${ib(I.back(), t('Back to the conversation · Esc', '返回会话 · Esc'))}<span class="title">${t('Settings', '设置')}</span></header>
    <div class="set">${nav()}<div class="spage"><div class="in">${body}</div></div></div>`;
}

/* ---- Usage ------------------------------------------------------------------------------------------------------ */
const RANGE = [['day', 'Day', '日'], ['week', 'Week', '周'], ['month', 'Month', '月'], ['custom', 'Custom', '自定义']];
function rangeBar(sel, custom) {
  const seg = `<div class="seg" role="radiogroup" aria-label="${t('Time range', '时间范围')}">${RANGE.map(([k, en, zh]) => `<button role="radio" aria-checked="${k === sel}" class="${k === sel ? 'on' : ''}">${t(en, zh)}</button>`).join('')}</div>`;
  const label = t('Oct 12 – 18, 2026', '2026年10月12日–18日');
  const nav2 = custom
    ? `<div class="rnav"><div class="input ui on">${t('Oct 12, 2026', '2026年10月12日')}</div><span class="to">–</span><div class="input ui">${t('Oct 18, 2026', '2026年10月18日')}</div></div>`
    : `<div class="rnav">${ib(I.back(), t('Previous week', '上一周'))}<span class="lab">${label}</span>${ib(I.chev(), t('Next week', '下一周'))}</div>`;
  return `<div class="ubar">${seg}${nav2}</div>`;
}
function groupSeg(sel) {
  return `<div class="seg" role="radiogroup" aria-label="${t('Group by', '分组')}">${Object.keys(GN).map(k => `<button role="radio" aria-checked="${k === sel}" class="${k === sel ? 'on' : ''}">${t(GN[k][0], GN[k][1])}</button>`).join('')}</div>`;
}
const head = (grp, title) => `<div class="ugh"><b>${title || t(`By ${GN[grp][0].toLowerCase()}`, `按${GN[grp][1]}`)}</b>${groupSeg(grp)}</div>`;
const breakdown = () => `<div class="ubrk">${[['Input', '输入', 0], ['Output', '输出', 1], ['Cache write', '缓存写入', 2], ['Cache read', '缓存读取', 3]].map(([en, zh, i]) => `<span>${t(en, zh)} <b>${fm(TOTAL.br[i])}</b></span>`).join('')}</div>`;
const costTitle = t('Estimated from the price table', '按价格表估算');
const footnote = (tokOnly) => `<p class="rmeta ufoot">${tokOnly
  ? t('Showing tokens only. Turn it off in Prices to show estimated cost.', '仅显示 token。可在“价格”中关闭此选项以显示估算费用。')
  : t('Costs are estimates from the price table. — marks a model without a price: its tokens are counted, its cost is not.', '费用为按价格表得出的估算值。“—”表示该模型没有价格：其 token 会计入，费用不计入。')}</p>`;

const legend = () => `<div class="uleg">${MODELS.map(([n, , , c, s]) => `<span><i class="rw ${s}"></i>${n}</span>`).join('')}</div>`;

function chart({ hov = 3, tokOnly = false, partial = false } = {}) {
  const max = 4;
  const days = partial ? [[0.3, 1.0, 0.5, 0], [0.5, 1.4, 0.7, 0], [0.3, 0.9, 0.5, 0]] : DM;
  const first = DAYS.length - days.length;
  const cols = DAYS.map((d, i) => {
    const row = days[i - first];
    const pend = i < first;
    const sum = row ? row.reduce((a, b) => a + b, 0) : 0;
    const segs = row ? row.map((v, k) => (v ? `<i class="${['s0', 's1', 's2', 'ot'][k]}" style="height:${(v / max) * 100}%"></i>` : '')).join('') : '';
    const tipHtml = i === hov && !partial ? `<div class="utip" role="tooltip"><b>${t(`${d[0]}, Oct ${d[2]}`, `10月${d[2]}日 ${d[1]}`)}</b><span>${sum.toFixed(1)}M ${t('tokens', 'token')}</span>${tokOnly ? '' : `<span>${fc(DC[i])} ${t('estimated', '估算')}</span>`}</div>` : '';
    return `<div class="uc${i === hov && !partial ? ' hov' : ''}" role="img" aria-label="${t(`${d[0]} ${d[2]}`, `${d[1]} ${d[2]}`)}: ${sum.toFixed(1)}M ${t('tokens', 'token')}${tokOnly ? '' : `, ${fc(DC[i])}`}">${tipHtml}<div class="ucs${pend ? ' pend' : ''}">${segs}</div><span class="ucl">${t(d[0], d[1])} ${d[2]}</span></div>`;
  }).join('');
  return `<div class="uchart"><div class="uy"><span>4M</span><span>2M</span><span>0</span></div>
    <div class="uplot"><div class="ugl"><i style="top:0"></i><i style="top:50%"></i><i style="top:100%"></i></div>${cols}</div></div>${legend()}`;
}
const totals = ({ tokOnly = false, partial = false, unpriced = true } = {}) => {
  const tk = partial ? '6.1M' : '18.4M';
  const c = partial ? '$11.90' : '$36.04';
  return `<div class="utot"><b>${tk}</b><span class="u">${t('tokens', 'token')}</span>${tokOnly ? '' : `<span class="cost"${tip(costTitle)}><b>${c}</b> ${t('estimated', '估算')}${unpriced && !partial ? `<span class="meta"> · ${t('excludes 2.1M tokens without a price', '不含 2.1M 无价格的 token')}</span>` : ''}</span>`}</div>`;
};

/* the ranked table */
function tableA(grp, { tokOnly = false, unknown = false, rows } = {}) {
  const data = rows || GROUPS[grp];
  const cols = tokOnly ? 'minmax(0,1fr) 84px 56px' : 'minmax(0,1fr) 84px 96px';
  const body = data.map(([n, sub, tk, c]) => {
    const sh = `${Math.round((tk / TOTAL.tok) * 100)}%`;
    const cost = unknown && c == null ? `<span class="np"${tip(t('No price for this model', '该模型没有价格'))}>${t('No price', '无价格')}</span>` : `<span class="n c">${fc(c)}</span>`;

    <div class="cp" style="padding-top:var(--space-4)">${t('Add a test for the gz rename order', '为 gz 重命名顺序添加测试')}</div>
    <p class="text">${t('Added. The test fails first, then passes with the order swapped.', '已添加。该测试先失败，调换顺序后通过。')}</p>
    <div class="mu"><span>claude-sonnet-5</span><span>8.1k ${t('in', '输入')}</span><span>0.9k ${t('out', '输出')}</span><span>31k ${t('cache read', '缓存读取')}</span><span>≈ $0.05</span></div>`;
}
const send = on => `<button class="send"${on ? '' : ' disabled'}${tip(t('Send · ↩', '发送 · ↩'))}>${I.up()}</button>`;
function composerBox(state) {
  if (state === 'composer-over-budget' || state === 'composer-over-budget-zh') {
    return `<div class="composer" aria-live="polite"><div class="ph typed">${t('Document the notification kinds in docs/api.md', '在 docs/api.md 中记录通知类型')}</div>
      <div class="cf">${ib(I.clip(), t('Attach', '附件'))}<span class="cst warn" role="status"${tip(t('over-budget · hoplet-docs monthly, $10.60 of $10.00', 'over-budget · hoplet-docs 每月，$10.60 / $10.00'))}>${I.alert()}${t('Not sent. hoplet-docs is over its monthly budget.', '未发送。hoplet-docs 已超出每月预算。')}</span>
        <span class="r">${btn(t('Allow until Oct 31', '允许至 10月31日'))}${ib(I.mic(), t('Dictate · transcribed on your machines', '听写 · 在你的机器上转写'))}${send(false)}</span></div></div>`;
  }
  return `<div class="composer cbar" aria-live="polite"><span class="cst warn" role="status">${I.pause()}<span>${t('Queue paused. 2 prompts wait; hoplet-docs is over its monthly budget.', '队列已暂停，2 条消息在等待；hoplet-docs 已超出每月预算。')}</span></span>${btn(t('Allow until Oct 31', '允许至 10月31日'))}${ib(I.stop(), t('Stop Claude Code', '停止 Claude Code'))}</div>`;
}
function sessionFrame(state, scheme) {
  const comp = state.startsWith('composer');
  const unknown = state === 'session-usage-unknown';
  const titleName = comp ? 'Update the API docs' : SESS.title[0];
  const ctx = comp ? 'hoplet-docs · MacBook Pro' : unknown ? 'blog-site · office-mini' : SESS.title[1];
  const running = state === 'composer-over-budget-running';
  const top = `<header class="top">${ib(I.sidebar(), t('Show sidebar · ⌘\\', '显示侧边栏 · ⌘\\'))}<span class="title">${unknown ? t('Backfill the blog tags', '补全博客标签') : comp ? t('Update the API docs', '更新 API 文档') : titleName}</span><span class="ctx meta">${ctx}</span><span class="sp"></span>${comp ? '' : chip(state)}${ib(I.panel(), t('Show workspace', '显示工作区'))}</header>`;
  const body = running
    ? `<div class="cp">${t('Update the API reference for the usage routes', '更新用量相关路由的 API 参考')}</div><div class="cwork">${spin()}<span>${t('Running pnpm check…', '正在运行 pnpm check…')}</span></div>`
    : turns(comp);
  const dock = comp ? `<div class="dock"><div class="col">${composerBox(state)}</div></div>` : `<div class="dock"><div class="col"><div class="composer"><div class="ph">${t('Ask Claude Code…', '向 Claude Code 提问…')}</div><div class="cf">${ib(I.clip(), t('Attach', '附件'))}<span class="r">${ib(I.mic(), t('Dictate · transcribed on your machines', '听写 · 在你的机器上转写'))}${send(false)}</span></div></div></div></div>`;
  return `<div class="frame nosb ${scheme}" data-state="${state}"><main class="main">${top}<div class="conv"><div class="col">${body}</div></div>${dock}${comp ? '' : popover(state)}</main></div>`;
}

  ['usage-empty', 'Usage with nothing counted yet: one message'],

function frame(state, scheme) {
  Z = state.endsWith('-zh');
  const lang = Z ? ' lang="zh-Hans"' : '';
  if (state.startsWith('session-') || state.startsWith('composer-')) return sessionFrame(state, scheme).replace('<div class="frame', `<div${lang} class="frame`);
  let page;
  if (state.startsWith('budgets')) page = budgetsPage(state === 'budgets-zh' ? 'budgets' : state);
  else if (state.startsWith('prices')) page = pricesPage(state);
  else page = usagePage(state === 'usage-zh' ? 'usage' : state);
  return `<div${lang} class="frame page ${scheme}" data-state="${state}"><main class="main">${settingsShell(page)}</main></div>`;
}

/* ---- the page --------------------------------------------------------------------------------------------------- */
const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  root.innerHTML = `<header class="intro"><h1>Usage, cost and budgets <span>Settings › Usage and the session top bar</span></h1>
    <p>Usage per message and per session, an estimated cost, and budgets (issue #75). Tokens are counted as the four kinds the model reports: input, output, cache write and cache read. The cost is an estimate from a price table that ships with Hoplet and that the host can override; it is labelled estimated wherever it appears. A model without a price shows tokens only, and the host can choose to show tokens only everywhere.</p>
    <p><b>Settings › Usage</b> shows the totals and the token breakdown on top, a column per day stacked by model (the accent in opacity steps, the one model without a price in grey), then a ranked table. The range bar (day, week, month, custom) and the group-by control (session, project, machine, model) sit above. The maintainer chose this layout over compact tiles and a table-first page.</p>
    <p><b>Budgets</b> are rows with a bar and an alert tick; amber means the alert line or an over-limit that only warns, red means new prompts are refused. The pause row carries its one action, Allow until the end of the period. A refused prompt keeps its text in the composer and says why once. The session top bar holds one chip, tokens and estimated cost; it opens to the four token kinds and a line per model. All numbers are invented and add up across the tables.</p></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}
