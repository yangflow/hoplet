<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:1fr var(--layout-inspector-wide);grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.narrow{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.phones{display:flex;align-items:center;justify-content:center;gap:var(--space-7)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib.sm{width:24px;height:24px}
.ib.sm svg{width:14px;height:14px}
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}
.light .btn{background:var(--color-raised)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);font-weight:var(--weight-semibold);padding:0 var(--space-4)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--color-text-2);padding:0 var(--space-2)}
.btn.sm{height:24px;padding:0 var(--space-2)}
.btn.primary.sm{padding:0 var(--space-3)}
.btn[disabled]{opacity:.5;cursor:default}
.kbd{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--color-line);font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);height:20px;padding:0 6px;border-radius:4px;background:var(--color-hover);color:var(--color-text-2);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);white-space:nowrap;flex:none}
.light .tag{background:var(--color-selected)}
.tag svg{width:12px;height:12px}
.tag.acc{background:var(--color-accent-soft);color:var(--color-accent-text)}
.tag.ok{background:var(--color-add-bg);color:var(--color-add-text)}
.tag.line{background:transparent;box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-3)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line)}
.light .seg{background:var(--color-hover)}
.seg button{height:24px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:6px;font-weight:var(--weight-medium);color:var(--color-text-2);white-space:nowrap}
.seg button.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .seg button.on{background:var(--color-raised)}
.nt{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);display:flex;gap:var(--space-2);color:var(--color-text)}
.nt svg{margin-top:2px}
.nt.bad{background:var(--color-del-bg)}
.nt.bad svg{color:var(--color-danger)}
.nt.snap{background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2)}
.nt.snap svg{color:var(--color-text-3)}
.cbx{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--color-text-3);display:grid;place-items:center;color:var(--color-on-accent);flex:none}
.cbx svg{width:12px;height:12px}
.cbx.on{background:var(--color-accent);box-shadow:none}

/* main column */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.conv{position:relative;flex:1;min-height:0;overflow:hidden;padding:0 0 160px}
.col{width:calc(100% - 64px);max-width:var(--layout-column);margin:0 auto;padding-top:var(--space-2)}
.turn{position:relative;padding-bottom:var(--space-5)}
.turn + .turn{border-top:1px solid var(--color-line)}
.turn.live{margin:var(--space-2) calc(-1 * var(--space-5)) 0;padding:0 var(--space-5) var(--space-4);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-live);border-top:0}
.turn.live::before{content:"";position:absolute;left:0;top:var(--space-4);bottom:var(--space-4);width:3px;border-radius:0 3px 3px 0;background:var(--color-accent)}
.th{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--space-4);align-items:baseline;padding:var(--space-5) 0 var(--space-3)}
.turn.live .th{padding-top:var(--space-4)}
.th .p{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;max-width:var(--measure-prose)}
.th .tm{grid-column:1;display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1)}
.th .rt{grid-row:1;grid-column:2;display:flex;align-items:center;gap:var(--space-2)}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-soft);animation:pulse var(--motion-pulse) ease-in-out infinite}
.text{font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);margin:var(--space-1) 0 var(--space-3);max-width:var(--measure-prose)}
.text code{font-family:var(--font-mono);font-size:var(--text-code);background:var(--color-surface);padding:1px 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--color-line)}
.act{display:grid;grid-template-columns:16px minmax(var(--layout-act-verb),max-content) minmax(0,1fr) auto;column-gap:var(--space-2);align-items:center;height:var(--layout-row);white-space:nowrap}
.act .i{color:var(--color-text-3)}
.act .k{color:var(--color-text-2);font-weight:var(--weight-medium)}
.act .a{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--color-text-2)}
.act .m{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.act.run .m{color:var(--color-accent-text)}
.act.run .i .spin{color:var(--color-accent)}
.add-n{color:var(--color-add-text)} .del-n{color:var(--color-del-text)}
.dock{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:var(--space-7) var(--space-6) var(--space-4);background:linear-gradient(var(--fade-bg),var(--color-bg) 42%)}
.composer{max-width:var(--layout-column);margin:0 auto;border-radius:var(--radius-xl);background:var(--color-raised);box-shadow:var(--shadow-float);padding:var(--space-3) var(--space-2) var(--space-2) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2);position:relative}
.ph{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text-3)}
.ph.typed{color:var(--color-text)}
.cf{display:flex;align-items:center;gap:var(--space-1);min-height:var(--control-field);margin-left:calc(-1 * var(--space-2))}
.cf .r{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.send{width:var(--control-field);height:var(--control-field);border-radius:50%;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);flex:none}

/* inspector */
.insp{background:var(--color-sidebar);box-shadow:var(--shadow-drawer);display:flex;flex-direction:column;min-width:0;min-height:0;position:relative;z-index:4;overflow:hidden}
.insp-h{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);flex:none;box-shadow:inset 0 -1px 0 var(--color-line)}
.tabs{flex:1;min-width:0;display:flex;align-items:center;gap:2px}
.tab{height:28px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2);font-weight:var(--weight-medium);white-space:nowrap;flex:none}
.tab > svg{color:var(--color-text-3)}
.tab .c{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;font-weight:var(--weight-regular)}
.tab .c.acc{color:var(--color-accent-text);font-weight:var(--weight-semibold)}
.tab.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .tab.on{background:var(--color-raised)}
.md{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) var(--layout-inspector-list)}
.mlist{display:flex;flex-direction:column;min-height:0;min-width:0;box-shadow:inset 1px 0 0 var(--color-line);padding:var(--space-1) var(--space-2) 0}
.chg-sum{display:flex;align-items:center;gap:var(--space-1);height:var(--layout-row-tree);padding:0 var(--space-2);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-2);font-variant-numeric:tabular-nums}
.cr{height:var(--layout-row-tree);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap;color:var(--color-git-modified)}
.cr .gt{width:16px;text-align:center;font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-semibold);flex:none}
.cr .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.cr .cmc{display:inline-flex;align-items:center;gap:2px;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-accent-text);font-variant-numeric:tabular-nums}
.cr .cmc svg{width:12px;height:12px}
.cr .cmc.sent{color:var(--color-text-3)}
.cr.on{background:var(--color-selected);box-shadow:inset 0 1px 0 var(--color-highlight)}
.viewer{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--color-bg);position:relative}
.vh{height:48px;flex:none;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.vh b{font-weight:var(--weight-semibold)}
.vh .sp{flex:1}
.vb{flex:1;min-height:0;overflow:hidden}

/* the diff, with the annotation layer */
.diff{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0;padding:var(--space-2) 0}
.dl{display:grid;grid-template-columns:var(--layout-gutter) var(--layout-gutter) 16px minmax(0,1fr);color:var(--color-text);position:relative}
.dl .n{font-family:var(--font-ui);font-size:var(--text-meta);color:var(--color-text-3);text-align:right;padding-right:var(--space-2);font-variant-numeric:tabular-nums}
.dl .s{text-align:center}
.dl .c{white-space:pre;overflow:hidden;text-overflow:ellipsis;padding-right:var(--space-3)}
.dl.add{background:var(--color-add-bg)}
.dl.del{background:var(--color-del-bg)}
.dl.add .s,.dl.add .n{color:var(--color-add-text)}
.dl.del .s,.dl.del .n{color:var(--color-del-text)}
.dl.hunk{color:var(--color-text-3);background:var(--color-surface)}
.dl.pick{background:var(--color-accent-soft);box-shadow:inset 3px 0 0 var(--color-accent)}
.dl.pick .n{color:var(--color-accent-text)}
.dl.hov{background:var(--color-hover)}
/* the + that starts a comment sits over the sign column of the hovered line */
.dl .plus{position:absolute;left:calc(2 * var(--layout-gutter) - 10px);top:0;width:20px;height:20px;border-radius:4px;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent)}
.dl .plus svg{width:14px;height:14px}
/* a dot in the gutter: a comment on this line (B) */
.dl .cdot{position:absolute;left:4px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--color-accent)}
.dl .cdot.sent{background:var(--color-text-3)}
.dl .cdot.done{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}
.ann{margin:var(--space-2) var(--space-3) var(--space-2) calc(var(--layout-gutter) + var(--space-3));padding:var(--space-3);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-live);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);display:flex;flex-direction:column;gap:var(--space-2);white-space:normal}
.ann.edit{box-shadow:var(--shadow-live),0 0 0 1.5px var(--color-accent)}
.ann.sent{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.light .ann.sent{background:var(--color-raised)}
.ann .ah{display:flex;align-items:center;gap:var(--space-2);margin:calc(-1 * var(--space-1)) calc(-1 * var(--space-1)) 0 0}

  }
  if (st === 'b-sent') {
    const v = `<div class="viewer">${vhead()}<div class="vb">${diffView(D1, { dots: { 8: 'sent', 9: 'sent', 10: 'sent', 13: 'sent' } })}</div></div>`;
    return mainCol(turn7() + liveReviewTurn('b')) + wide(v, changesList(F1, { [F1]: { n: 2, sent: true }, [F2]: { n: 1, sent: true } }), tabsB);
  }
  if (st === 'b-resolve') {
    const v = `<div class="viewer">${vhead()}<div class="vb">${diffView(D1b, { dots: { 7: 'done', 8: 'done', 9: 'done', 12: 'sent' } })}</div></div>`;
    return mainCol(doneReviewTurn('b')) + wide(v, changesList(F1, { [F1]: { n: 1, sent: true }, [F2]: { n: 1, sent: true } }), tabsB);
  }
  return '';
}

/* ---- direction C: a Review tab --------------------------------------------------------------------------------- */
const rc = (loc, c, o = {}) => `<div class="rc${o.done ? ' done' : ''}${o.on ? ' on' : ''}">${o.check !== undefined ? `<span class="cbx${o.check ? ' on' : ''}">${o.check ? I.check() : ''}</span>` : `<span class="i">${I.cm()}</span>`}
  <div style="min-width:0"><div class="loc">${loc}${o.outd ? ` <span class="tag line">${t('Lines changed', '行已变化')}</span>` : ''}</div><div class="tx">${ic(c)}</div>${o.snip ? `<div class="snip">${esc(o.snip)}</div>` : ''}</div>
  <div class="acts">${o.check !== undefined ? ib(I.chev(), t('Show in the diff', '在差异中显示'), 'sm') : ib(I.pen(), t('Edit', '编辑'), 'sm') + ib(I.trash(), t('Delete', '删除'), 'sm')}</div></div>`;
function cFrame(st) {
  const tabsC = (on, n, acc) => tab(on === 'changes', t('Changes', '变更'), 3) + tab(on === 'review', t('Review', '评审'), n, acc) + tab(false, t('Files', '文件'));
  if (st === 'c-select') {
    const dock = `<div class="vdock"><div class="vdh"><span class="tag acc">${I.cm()}chunks.ts · ${lines(42, 44)}</span><span class="sp"></span>${ib(I.x(), t('Cancel', '取消'), 'sm')}</div>
      <div class="ta">${ic(C1())}<span class="caret"></span></div><div class="af"><span class="meta">${t('Goes to the Review tab', '会加入“评审”标签页')} · <span class="kbd">⌘↵</span></span>${btn(t('Add comment', '添加评论'), '', 'primary sm')}</div></div>`;
    const v = `<div class="viewer">${vhead()}<div class="vb">${diffView(D1, { pick: [8, 10] })}</div>${dock}</div>`;
    return mainCol(turn7()) + wide(v, changesList(F1, { [F2]: { n: 1 } }), tabsC('changes', 1, true));
  }
  const reviewTab = (body, foot) => `<div class="insp">${tabsBar(tabsC('review', st === 'c-rounds' ? 2 : 3, st !== 'c-rounds'))}<div class="rtab"><div class="rb">${body}</div>${foot}</div></div>`;
  if (st === 'c-review' || st === 'c-send') {
    const draft = `<div class="rg"><b>${t('Draft', '草稿')}</b><span class="meta">${t('3 comments · 2 files', '3 条评论 · 2 个文件')}</span><span class="sp"></span><div class="seg"><button class="${st === 'c-review' ? 'on' : ''}">${t('Comments', '评论')}</button><button class="${st === 'c-send' ? 'on' : ''}">${t('Message', '消息')}</button></div></div>`;
    const body = st === 'c-review'
      ? draft + rc(`${F1}:42-44`, C1(), { snip: '    const start = offset;\n    const end = start + line.length;\n    offset = end;', on: true }) + rc(`${F1}:47`, C2(), { snip: '  store.setByteSize(s.id, offset);' }) + rc(`${F2}:58`, C3(), { snip: '  expect(size).toBe(input.length);' })
        + `<div class="rg">${I.chev()}<b>${t('Turn 5', '第 5 轮')}</b><span class="meta">${t('2 comments · all resolved', '2 条评论 · 全部已解决')}</span></div>`
      : draft + `<div class="compose" style="max-height:520px;margin-top:var(--space-2)">${composed()}</div>`;
    const foot = `<div class="rfoot"><div class="ta idle">${st === 'c-send' ? `<span style="color:var(--color-text)">${esc(NOTE())}</span>` : t('Add a note (optional)', '添加附言（可选）')}</div>
      <div class="rr"><span class="meta">${t(`${COUNT()} / 8,000 characters`, `${COUNT()} / 8,000 字符`)}</span>${btn(t('Discard', '丢弃'), '', 'quiet')}${st === 'c-send' ? btn(t('Steer now', '立即插话'), I.steer()) + btn(t('Queue', '排队'), I.send(), 'primary') : btn(t('Send 3 comments', '发送 3 条评论'), I.send(), 'primary')}</div></div>`;
    return mainCol(st === 'c-send' ? turn7() + liveTurn() : turn7()) + reviewTab(body, foot);
  }
  if (st === 'c-rounds') {
    const body = `<div class="rg"><b>${t('Draft', '草稿')}</b><span class="meta">${t('empty', '空')}</span></div><div class="rempty">${I.cm()}<span>${t('Select lines in Changes to comment on them.', '在“变更”中选中行即可评论。')}</span></div>
      <div class="rg">${I.down()}<b>${t('Turn 8', '第 8 轮')}</b><span class="meta">${t('sent 14:11 · 2 open', '14:11 发送 · 2 条未解决')}</span><span class="sp"></span>${btn(t('Resolve all', '全部标记已解决'), '', 'quiet sm')}</div>
      ${rc(`${F1}:43-45`, C1(), { check: true, done: true })}${rc(`${F1}:47`, C2(), { check: false, outd: true, snip: '  store.setByteSize(s.id, offset);' })}${rc(`${F2}:58`, C3(), { check: false })}
      <div class="rg">${I.chev()}<b>${t('Turn 5', '第 5 轮')}</b><span class="meta">${t('2 comments · all resolved', '2 条评论 · 全部已解决')}</span></div>`;
    return mainCol(turn7() + doneReviewTurn()) + reviewTab(body, '');
  }
  return '';
}

/* ---- phone references (the native client, not the web UI: ADR 0011) --------------------------------------------- */
const psb = () => `<div class="psb"><span>9:41</span><span class="meta">●●●</span></div>`;
const phoneDiff = (o = {}) => {
  const rows = D1.slice(4, 16).map((r, i) => {
    const [k, , b, c] = r; const pick = o.pick && i >= 4 && i <= 6;
    return `<div class="dl${k === '+' ? ' add' : k === '-' ? ' del' : ''}${pick ? ' pick' : ''}"><span class="n">${b}</span><span class="s">${k === ' ' ? '' : k}</span><span class="c">${esc(c.trim() ? c.replace(/^ {2}/, '') : c)}</span></div>` + (o.after && o.after[i] ? o.after[i] : '');
  });
  return `<div class="diff">${rows.join('')}</div>`;
};
const phone = (nav, body) => `<div class="phone">${psb()}<div class="pnav">${ib(I.back(), t('Back', '返回'))}<b>${nav}</b>${ib(I.more(), t('More', '更多'))}</div><div class="pbody">${body}</div></div>`;
const cap = (title, text) => `<div class="phcap"><b>${title}</b><span>${text}</span><span class="meta">${t('A reference for the native client. The web UI stays desktop-only at 1024 px and wider (ADR 0011).', '供原生客户端参考。Web UI 仍只面向 1024 px 及以上的桌面（ADR 0011）。')}</span></div>`;
function phoneFrame(st) {
  const dir = st[0];
  if (dir === 'a') {
    const p1 = phone('chunks.ts', phoneDiff({ pick: true }) + `<span class="handle" style="top:${8 + 4 * 20 - 6}px"></span><span class="handle" style="top:${8 + 7 * 20 - 6}px"></span>
      <div class="sheet"><div class="grab"></div><div class="sr"><span class="tag acc">${I.cm()}${lines(42, 44)}</span><span class="sp"></span></div><div class="ta">${ic(C1())}</div><div class="sr">${btn(t('Cancel', '取消'))}${btn(t('Add comment', '添加评论'), '', 'primary')}</div></div>`);
    const p2 = phone('chunks.ts', phoneDiff({ after: { 6: pendCard(42, 44, C1()), 9: pendCard(47, 47, C2()) } }) + `<div class="pbar"><span class="l"><b>${t('3 pending', '3 条待发送')}</b></span>${btn(t('Review and send', '检查并发送'), I.send(), 'primary')}</div>`);
    return cap(t('A on a phone', '手机上的 A'), t('Drag the handles to select lines, then write in a sheet. Comments sit inline; the bar sends them. The send preview is a full-screen sheet.', '拖动选择手柄选中行，在底部面板中撰写。评论显示在行内，底栏负责发送；发送预览为全屏面板。')) + p1 + p2;
  }
  if (dir === 'b') {
    const p1 = phone('chunks.ts', phoneDiff({ pick: true }) + `<div class="sheet"><div class="grab"></div><div class="sr"><span class="tag acc">${I.cm()}${lines(42, 44)}</span></div><div class="ta">${ic(C1())}</div><div class="sr">${btn(t('Cancel', '取消'))}${btn(t('Add to message', '加入消息'), '', 'primary')}</div></div>`);
    const it = [[`chunks.ts:42-44`, C1()], [`chunks.ts:47`, C2()], [`chunks.test.ts:58`, C3()]];
    const tray = `<div class="tray"><div class="trh">${I.cm()}<b>${t('Review', '评审')}</b><span class="meta">3</span><span class="sp"></span></div>${it.map(([l, c]) => `<div class="tri"><span class="i">${I.cm()}</span><span class="loc">${l}</span><span class="tx">${ic(c)}</span>${ib(I.x(), t('Remove', '移除'), 'sm')}</div>`).join('')}</div>`;
    const p2 = phone(SESSION(), `<div style="padding:0 var(--space-4)">${turn7()}</div><div class="dock"><div class="composer">${tray}<div class="ph typed">${esc(NOTE())}</div><div class="cf">${ib(I.plus(), t('Attach', '附加'))}<div class="r"><button class="send">${I.up()}</button></div></div></div></div>`);
    return cap(t('B on a phone', '手机上的 B'), t('The same sheet adds to the message instead; the tray rides on the composer like attachments, and Send is the usual one.', '同样的面板改为加入消息；评论托盘像附件一样跟着输入框，用平常的发送按钮发送。')) + p1 + p2;
  }
  const list = `<div style="padding:var(--space-2) var(--space-3)"><div class="rg"><b>${t('Draft', '草稿')}</b><span class="meta">3</span></div>${rc('chunks.ts:42-44', C1())}${rc('chunks.ts:47', C2())}${rc('chunks.test.ts:58', C3())}</div>
    <div class="pbar"><span class="l meta">${COUNT()} / 8,000</span>${btn(t('Send 3', '发送 3 条'), I.send(), 'primary')}</div>`;
  const rounds = `<div style="padding:var(--space-2) var(--space-3)"><div class="rg"><b>${t('Turn 8', '第 8 轮')}</b><span class="meta">${t('2 open', '2 条未解决')}</span></div>${rc('chunks.ts:43-45', C1(), { check: true, done: true })}${rc('chunks.ts:47', C2(), { check: false, outd: true })}${rc('chunks.test.ts:58', C3(), { check: false })}
    <div class="rg">${I.chev()}<b>${t('Turn 5', '第 5 轮')}</b><span class="meta">${t('all resolved', '全部已解决')}</span></div></div>`;
  return cap(t('C on a phone', '手机上的 C'), t('A list first: the Review screen reads well at phone width, and a row opens the diff at its lines. Rounds keep their checkboxes.', '以列表为主：评审页在手机宽度下易读，点一行即可打开对应行的差异；各轮保留勾选框。')) + phone(t('Review', '评审'), list) + phone(t('Review', '评审'), rounds);
}

/* ---- states ----------------------------------------------------------------------------------------------------- */
const STATES = [
  ['a-hover', 'A, inline in the diff: hovering a line shows + over the sign column; click, shift-click or drag selects a range'],
  ['a-select', 'A: lines 42–44 selected, the comment box opens under them'],
  ['a-pending', 'A: two pending comments inline (a third is in chunks.test.ts), a count per file in the list, and the review bar'],
  ['a-send', 'A: Send review, with an optional note and the composed message, counted against the 8,000-character prompt limit'],
  ['a-send-busy', 'A: Send review while a turn runs: Queue (default) or Steer now, as in the composer'],
  ['a-send-over', 'A: the composed message is over 8,000 characters; Send is off and the comments stay pending'],
  ['a-sent', 'A: sent as turn 8; the cards are marked Sent in turn 8 and cannot be edited; the turn shows a Review block'],
  ['a-resolve', 'A: turn 8 finished; each comment offers Resolve; the second is re-anchored as Lines changed and shows the code as sent'],
  ['a-resolved', 'A: one comment resolved and folded to a line, with Reopen'],
  ['a-phone', 'A as a native-client reference at 390 px: select with handles, write in a sheet; pending comments and the review bar'],
  ['a-select-zh', 'A in Simplified Chinese: selecting lines'],
  ['a-pending-zh', 'A in Simplified Chinese: pending comments'],
  ['a-send-zh', 'A in Simplified Chinese: Send review'],
  ['a-resolve-zh', 'A in Simplified Chinese: resolving after the turn'],
  ['b-select', 'B, a tray above the composer: selecting lines opens a popover that adds the comment to the message'],
  ['b-pending', 'B: three comments in the composer tray with a typed note; dots in the gutter mark commented lines'],
  ['b-send', 'B: Preview over the tray, and the send menu (Queue or Steer) while a turn runs'],
  ['b-sent', 'B: the sent turn lists the comments with checkboxes, off until the turn ends; grey dots in the gutter'],
  ['b-resolve', 'B: turn 8 done; one comment ticked resolved, one marked Lines changed; hollow dots for resolved lines'],
  ['b-phone', 'B as a native-client reference: the sheet adds to the message, the tray rides on the composer'],
  ['b-pending-zh', 'B in Simplified Chinese: the tray'],
  ['c-select', 'C, a Review tab: the comment editor docks at the foot of the diff; the Review tab counts drafts'],
  ['c-review', 'C: the Review tab with three draft comments and their snippets, the note and Send in the footer, an earlier round folded'],
  ['c-send', 'C: the Message view of the draft, the composed text; Queue or Steer now while a turn runs'],
  ['c-rounds', 'C: after sending, rounds by turn with checkboxes, Lines changed on a moved comment, Resolve all'],
  ['c-phone', 'C as a native-client reference: the draft list with Send, and a round with checkboxes'],
  ['c-review-zh', 'C in Simplified Chinese: the Review tab'],
  ['c-rounds-zh', 'C in Simplified Chinese: rounds'],
];

function frame(st, scheme) {
  Z = st.endsWith('-zh');
  const s = st.replace(/-zh$/, '');
  if (s.endsWith('-phone')) return `<div class="frame phones ${scheme}" lang="${Z ? 'zh-Hans' : 'en'}">${phoneFrame(s)}</div>`;
  const body = s[0] === 'a' ? aFrame(s) : s[0] === 'b' ? bFrame(s) : cFrame(s);
  return `<div class="frame ${scheme}" lang="${Z ? 'zh-Hans' : 'en'}">${body}</div>`;
}

const SAMPLE = () => { Z = false; return new DOMParser().parseFromString(composed(), 'text/html').body.textContent; };

/* ---- the page --------------------------------------------------------------------------------------------------- */
const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  root.innerHTML = `<header class="intro"><h1>Diff annotations <span>Comment on lines of the Changes diff and send them as the next turn (issue #84)</span></h1>
    <p><b>The maintainer chose A, built in <code>web/src/screens/workspace/</code> under <code>/__states/workspace/comments-*</code>, <code>comment-edit</code> and <code>review-send*</code>; B and C stay as the alternatives considered.</b> Not built: the conversation’s Review block with Reply and the Working on it link, and the phone states. A sent card says Sent in review N, since the core does not number turns. The user selects one or more lines in the inspector’s Changes diff and writes a comment. Comments collect as pending; sending composes them, each with its path, line numbers and code snippet, into one message that goes to the session as the next turn. Sent comments stay where they were, marked with the turn that sent them, and can be resolved after that turn. The message is an ordinary prompt: it obeys the 8,000-character limit, and while a turn runs it is queued or steered like anything typed in the composer.</p>
    <p><b>A, inline in the diff.</b> A + over the sign column starts a comment; click, shift-click or drag selects a range. Comments are cards under their lines, a review bar at the foot of the diff counts them, and Send review opens a dialog with a note and the exact message. After the turn each card offers Resolve; a resolved card folds to a line. Closest to code review tools, and the comment sits by its code the whole time.</p>
    <p><b>B, a tray above the composer.</b> A popover under the selection adds the comment to the message being written; the comments ride above the text like attachments and go with the normal Send, so Queue and Steer need nothing new. The sent turn lists them with checkboxes. Least new UI, but a long review crowds the composer and the comments leave the diff once added.</p>
    <p><b>C, a Review tab.</b> The editor docks at the foot of the diff and each comment lands in a Review tab beside Changes: a draft, then one round per sent turn with checkboxes, and a Message view of the composed text. List-first, so it suits a phone and a long review best; the comment is one step away from its code.</p>
    <p><b>Shared.</b> A comment stores the path, the side, the line range and the snippet as it was. When the diff changes it is re-anchored by its snippet; if the snippet is gone it shows <b>Lines changed</b> with the code as sent. Phone states are references for the native client (ADR 0011 keeps the web UI desktop-only). <b>message-square</b> is new to the closed icon set. States ending <b>-zh</b> are in Simplified Chinese; the built strings are in zh-Hans.json. The composed message, as drawn in every direction:</p>
    <pre>${esc(SAMPLE())}</pre></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}
</script></body></html>
