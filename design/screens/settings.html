<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* one type scale: meta 11/16 · UI 13/20 · prose 15/24 · title 15/20 600 · mono 12.5/20; weights 400/500/600 */
.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.with-insp{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.nosb{grid-template-columns:1fr}
.frame.nosb.with-insp{grid-template-columns:1fr var(--layout-inspector)}
.frame.with-insp.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}

/* icon buttons: the icon carries the intent, the title names it */
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib[disabled]{opacity:.4;cursor:default}
.ib.bd{color:var(--color-text-2);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .ib.bd{background:var(--color-raised)}
.ib .cdg{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--color-git-modified);box-shadow:0 0 0 2px var(--color-bg)}

/* sidebar: device 32 › directory 28 › session 28; one glyph column (x 8) and one name column (x 32) for all three */
.side,.insp{min-height:0;overflow:hidden}
.side{background:var(--color-sidebar);display:flex;flex-direction:column;min-width:0;box-shadow:inset -1px 0 0 var(--color-line)}
.brand{position:relative;height:var(--layout-topbar);display:flex;align-items:center;gap:6px;padding:0 var(--space-2) 0 14px;flex:none}
.brand b{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.brand .sp{flex:1}
.brand .hb{display:flex;gap:0}
.mark{width:20px;height:20px;border-radius:6px;background:var(--color-accent);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.search{margin:0 var(--space-2);height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-surface);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);color:var(--color-text-3);flex:none;text-align:left;
  box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .search{background:var(--color-raised)}
.search .lbl{flex:1}
.kbd{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--color-line);font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.tree{flex:1;overflow:hidden;padding:0 var(--space-2)}
.devg{padding-top:var(--space-4)}
.dev{position:relative;height:var(--layout-row-device);display:flex;align-items:center;padding-right:var(--space-1);border-radius:var(--radius-sm);font-weight:var(--weight-semibold);color:var(--color-text);white-space:nowrap}
.dev .dt{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2)}
.dev .dt .dn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dev .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.dev .dchv{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.dev .dchv svg{transition:transform .12s}
.dev.open .dchv svg{transform:rotate(90deg)}
.dev .ib{width:24px;height:24px;display:none}
.dev.hov .ib,.dev.menu .ib{display:grid;color:var(--color-text-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-success);flex:none}
.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}
.sdir,.sess{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap}
.sdir{color:var(--color-text-2);font-weight:var(--weight-medium)}
.sdir .fi{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sdir .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sdir .rt{display:flex;align-items:center;gap:var(--space-2);flex:none}
.sdir .cnt{font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-regular);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.sdir .ib{width:24px;height:24px;margin-right:-4px;display:none}
.sdir.hov{background:var(--color-hover)}
.sdir.hov .ib{display:grid;color:var(--color-text-2)}
.sdir.none{color:var(--color-text-3);font-weight:var(--weight-regular);padding-left:32px}
.sess{color:var(--color-text-2)}
.sess .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess .m{gap:var(--space-2);min-width:16px;display:flex;align-items:center;justify-content:flex-end;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;flex:none}
.sess.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.sess.dim{color:var(--color-text-3)}
.sess.dim.on{color:var(--color-text-2)}
.sess.two{height:calc(var(--leading-ui) + var(--leading-meta))}
.sess .t.tt{display:flex;flex-direction:column;overflow:visible}
.sess .t1,.sess .t2{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess .t2{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
/* a machine's view options: its name, then Organize and Sort as two radio groups under the row */
.pop{position:absolute;z-index:30;top:calc(100% - var(--space-1));left:var(--space-2);right:var(--space-2);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-title{padding:var(--space-2) var(--space-2) var(--space-1);font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-label{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.menu-check{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.menu-sep{height:1px;margin:var(--space-1) var(--space-2);background:var(--color-line)}
.pm{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sess.on .pm{color:var(--color-text-2)}
.gl{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.gl .spin{color:var(--color-accent)}
.need-dot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring)}
.bad-dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.ready-dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex:none}
.off-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.devg.off .dev,.devg.off .sdir,.devg.off .sess{color:var(--color-text-3)}
.devg.off .dev{font-weight:var(--weight-medium)}
.devg.off .sess.on{color:var(--color-text-2)}
.frozen-side .gl .spin{color:var(--color-text-3);animation:none}
.side-foot{height:var(--layout-foot);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4);box-shadow:inset 0 1px 0 var(--color-line);flex:none}
.conn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);white-space:nowrap}
.conn .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.conn.lost{color:var(--color-danger)}
.conn.lost .dot{background:var(--color-danger)}

/* modal chrome: command palette and New session */
.scrim{position:absolute;inset:0;z-index:19;background:var(--color-scrim)}
.modal{position:absolute;z-index:20;left:50%;top:var(--layout-modal-top);transform:translateX(-50%);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-float);overflow:hidden}
.hl{color:var(--color-accent-text);font-weight:var(--weight-semibold)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:4px;background:var(--color-hover);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;flex:none}
.pal{width:var(--layout-palette)}
.pal-in{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4) 0 18px;font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text)}
.pal-in .q{display:flex;align-items:center}
.pal-in svg{color:var(--color-text-3)}
.pal-in .cr2{width:1.5px;height:20px;background:var(--color-accent);margin-left:2px}
.pal-b{padding:0 var(--space-2) var(--space-2)}
.pal-sec{padding:var(--space-3) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.po{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.po .lead{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.po .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.po .t.ex{color:var(--color-text-2)}
.po .m{display:flex;align-items:baseline;min-width:0;max-width:52%;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.po .m .ms{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.po .m .ln{flex:none;white-space:pre}
.po.on{background:var(--color-selected);box-shadow:inset 0 1px 0 var(--color-highlight)}
.po.on .lead{color:var(--color-text-2)}
.po.on .kc{background:var(--color-raised);color:var(--color-text-2);box-shadow:0 0 0 1px var(--color-line)}
.dark .po.on .kc{background:var(--color-hover)}
.po.scan{color:var(--color-text-3)}
.pal-f{height:36px;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-4);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);box-shadow:inset 0 1px 0 var(--color-line)}
.pal-f span{display:flex;align-items:center;gap:var(--space-1)}

/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3) 0 var(--space-5);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.nosb .top{padding-left:var(--space-3)}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.top .sp{flex:1}

/* conversation */
.conv{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:0 0 148px}
.conv::-webkit-scrollbar{display:none}
.col{width:min(var(--layout-column),calc(100% - 104px));margin:0 auto;padding-top:var(--space-2)}
.wide .col{width:calc(100% - 48px)}

/* turn block */
.turn{position:relative;padding-bottom:var(--space-5)}
.turn + .turn{margin-top:var(--space-2)}
.turn.done + .turn.done{border-top:1px solid var(--color-line)}
.th{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--space-5);align-items:baseline;
  padding:var(--space-5) 0 var(--space-3);background:var(--color-bg)}
.th.stuck{box-shadow:0 1px 0 var(--color-line)}
.th.stuck .p,.wide .th .p{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:none}
.th .p{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;color:var(--color-text);max-width:var(--measure-prose)}
.th .tm{grid-column:1;display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1)}
.th .tm .src{display:flex;align-items:center;color:var(--color-text-3)}
.sum{grid-row:1;grid-column:2;display:flex;gap:var(--space-1);white-space:nowrap}
.sum i{font-style:normal;opacity:.6}
.tb{display:flex;flex-direction:column}

/* live turn */
.turn.live{margin:0 calc(-1 * var(--space-5));padding:0 var(--space-5) var(--space-4);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-live)}
.turn.live::before{content:"";position:absolute;left:0;top:var(--space-4);bottom:var(--space-4);width:3px;border-radius:0 3px 3px 0;background:var(--color-accent)}
.turn.live.need::before{background:var(--color-attention)}
.turn.live.need{box-shadow:var(--shadow-live),0 0 0 1px var(--color-attention-ring)}
.turn.live .th{position:static;background:none;padding-top:var(--space-4);align-items:center}
.rt{grid-row:1/span 2;grid-column:2;display:flex;align-items:center;gap:var(--space-3);align-self:center}
.badge{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-soft);animation:pulse var(--motion-pulse) ease-in-out infinite}
.need .sdot{background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring);animation:none}
@keyframes pulse{50%{box-shadow:0 0 0 6px transparent}}
.turn.live .tsep{height:1px;background:var(--color-line);margin:0 0 var(--space-2)}

/* prose */
.text{font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);margin:var(--space-1) 0 var(--space-3);max-width:var(--measure-prose)}
.text code{font-family:var(--font-mono);font-size:var(--text-code);background:var(--color-surface);padding:1px 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--color-line)}
.live .text code{background:var(--color-bg)}
.caret{display:inline-block;width:7px;height:16px;background:var(--color-accent);vertical-align:-3px;margin-left:2px;border-radius:1px;animation:blink var(--motion-blink) steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* tool rows: icon | past-tense verb | object | meta; one 28 px row per call */
.acts{margin:var(--space-1) 0 var(--space-2)}
.act{position:relative;display:grid;grid-template-columns:16px minmax(var(--layout-act-verb),max-content) minmax(0,1fr) auto;column-gap:var(--space-2);align-items:center;height:var(--layout-row);margin:0 calc(-1 * var(--space-2));padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap}
.act:hover{background:var(--color-hover)}
.act .i{color:var(--color-text-3);display:grid;place-items:center}
.act .k{color:var(--color-text-2);font-weight:var(--weight-medium)}
.act .a{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--color-text-2)}
.act .a .d{color:var(--color-text-3)}
.act .a.dim{color:var(--color-text-3)}
.act.think .a{font-style:italic;color:var(--color-text-3)}
.act .m{display:flex;align-items:center;gap:var(--space-1);justify-content:flex-end;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.act .m i{font-style:normal;opacity:.6}
.act .m .chv{color:var(--color-text-3);margin-left:var(--space-1)}
.act .m .chv svg{transition:transform .12s}
.act.open .m .chv svg{transform:rotate(90deg)}
.act.run .m{color:var(--color-accent-text)}
.act.run .m .spin{color:var(--color-accent)}
.act.bad::before{content:"";position:absolute;left:calc(var(--space-2) - var(--space-3));top:var(--space-1);bottom:var(--space-1);width:2px;border-radius:1px;background:var(--color-danger)}
.act.bad .m{color:var(--color-danger)}
.add-n{color:var(--color-add-text)} .del-n{color:var(--color-del-text)}
.thought{margin:0 0 var(--space-2) calc(16px + var(--space-2));max-width:var(--measure-prose);font-style:italic;color:var(--color-text-3)}

/* the output well: one frame for every expanded result */
.well{--well-bg:var(--color-surface);position:relative;margin:var(--space-1) 0 var(--space-2) calc(16px + var(--space-2));border-radius:var(--radius-md);background:var(--well-bg);box-shadow:inset 0 0 0 1px var(--color-line);overflow:hidden}
.well.solo{margin-left:0}
.live .well{--well-bg:var(--color-bg)}
.well.peek::after{content:"";position:absolute;right:0;top:0;bottom:0;width:240px;background:linear-gradient(to right,transparent,var(--well-bg) 40%)}
.wb{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0;color:var(--color-text);padding:var(--space-2) 0;max-height:var(--layout-well-max);overflow:hidden}
.well.fade .wb{-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 48px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 48px),transparent)}
.well.peek .wb{max-height:76px}
.wl{display:grid;grid-template-columns:minmax(0,1fr);padding:0 48px 0 var(--space-3);white-space:pre}
.well.ln .wl{grid-template-columns:var(--layout-gutter) minmax(0,1fr);column-gap:var(--space-3);padding-left:0}
.wl .n{font-family:var(--font-ui);font-size:var(--text-meta);color:var(--color-text-3);text-align:right;font-variant-numeric:tabular-nums}
.wl .c{min-width:0;overflow:hidden;text-overflow:ellipsis}
.wl.cmd{color:var(--color-text)}
.wl.cmd .c::before{content:"$ ";color:var(--color-text-3)}
.wl.bad{color:var(--color-del-text)}
.wl.ok{color:var(--color-add-text)}
.wl.dim{color:var(--color-text-3)}
.wl .p{color:var(--color-text-3)}
.wl .c .p{white-space:pre}
.well.err{background:var(--color-del-bg);box-shadow:inset 0 0 0 1px var(--color-del-bg)}
.well.err .wl{color:var(--color-del-text)}
.wact{position:absolute;top:var(--space-1);right:var(--space-1);display:flex;z-index:1;border-radius:var(--radius-sm);background:var(--well-bg)}
.wact .ib{width:28px;height:28px}
.wopen{position:absolute;right:var(--space-2);bottom:var(--space-2);z-index:1;height:var(--control-icon);display:inline-flex;align-items:center;padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);font-variant-numeric:tabular-nums}
.light .wopen{background:var(--color-raised)}
.diff{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0;padding:var(--space-2) 0}
.dl{display:grid;grid-template-columns:var(--layout-gutter) var(--layout-gutter) 16px minmax(0,1fr);color:var(--color-text);padding-right:48px}
.dl .n{font-family:var(--font-ui);font-size:var(--text-meta);color:var(--color-text-3);text-align:right;padding-right:var(--space-2);font-variant-numeric:tabular-nums}
.dl.add{background:var(--color-add-bg)}
.dl.del{background:var(--color-del-bg)}
.dl.add .s,.dl.add .n{color:var(--color-add-text)}
.dl.del .s,.dl.del .n{color:var(--color-del-text)}
.dl .s{text-align:center}
.dl .c{white-space:pre;overflow:hidden;text-overflow:ellipsis}

/* syntax */
.sx-kw{color:var(--color-syntax-keyword)}
.sx-st{color:var(--color-syntax-string)}
.sx-cm{color:var(--color-syntax-comment);font-style:italic}
.sx-nu{color:var(--color-syntax-number)}
.sx-ty{color:var(--color-syntax-type)}
.sx-fn{color:var(--color-syntax-function)}
.sx-pu{color:var(--color-syntax-comment)}
.sx-h{font-weight:var(--weight-semibold)}

/* permission request inside the live block */
.ask{margin:var(--space-3) calc(-1 * var(--space-5)) calc(-1 * var(--space-4));padding:var(--space-4) var(--space-5);background:var(--color-attention-soft);border-radius:0 0 var(--radius-lg) var(--radius-lg);box-shadow:inset 0 1px 0 var(--color-attention-ring)}
.ask-h{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-3)}
.ask-h svg{color:var(--color-attention-text)}
.ask-h .q{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.ask .well{margin:0}
.ask-f{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-3)}
.ask-f .meta{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.ask-f .meta svg{color:var(--color-text-3)}

/* text buttons: decisions only */
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}
.light .btn{background:var(--color-raised)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);font-weight:var(--weight-semibold);padding:0 var(--space-4)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--color-text-2);padding:0 var(--space-2)}
.btn svg{color:currentColor}
.btn[disabled]{opacity:.5;cursor:default}

/* composer */
.dock{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:var(--space-7) 0 var(--space-4);background:linear-gradient(var(--fade-bg),var(--color-bg) 42%);pointer-events:none}
.composer{pointer-events:auto;border-radius:var(--radius-xl);background:var(--color-raised);box-shadow:var(--shadow-float);padding:var(--space-3) var(--space-2) var(--space-2) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.ph{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text-3)}
.cf{display:flex;align-items:center;gap:var(--space-1);min-height:var(--control-field);margin-left:calc(-1 * var(--space-2))}
.cf .cst{display:flex;align-items:center;gap:var(--space-2);height:20px;color:var(--color-text-2);margin:0 0 0 var(--space-1);padding-left:var(--space-3);box-shadow:inset 1px 0 0 var(--color-line)}
.cf .cst.bad{color:var(--color-danger)}
.cf .r{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.send{width:var(--control-field);height:var(--control-field);border-radius:50%;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);flex:none}
.send[disabled]{background:var(--color-hover);color:var(--color-text-3);box-shadow:none;cursor:default}
.composer.cbar{flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-5);min-height:56px}
.composer.cbar .cst{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2);flex:1}
.composer.cbar .cst svg{color:var(--color-text-3)}
.composer.ro{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.recrow{display:flex;align-items:center;gap:var(--space-3);height:24px;padding-right:var(--space-2)}
.recrow .rdot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-soft);animation:pulse var(--motion-pulse) ease-in-out infinite;flex:none}
.recrow .el{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);font-variant-numeric:tabular-nums;width:36px;flex:none}
.wave{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;height:24px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 18%);mask-image:linear-gradient(to right,transparent,#000 18%)}
.wave i{flex:none;width:3px;border-radius:2px;background:var(--color-accent-text)}
.cf .note{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);margin-left:var(--space-3)}

/* floating pills, loading */
.pillw{display:flex;justify-content:center;margin-bottom:var(--space-3)}
.pill{pointer-events:auto;height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-4) 0 var(--space-3);border-radius:999px;background:var(--color-raised);box-shadow:var(--shadow-float);font-weight:var(--weight-medium);color:var(--color-text);font-variant-numeric:tabular-nums}
.pill svg{color:var(--color-accent-text)}
.loadbar{position:absolute;left:0;right:0;height:var(--control-field);z-index:4;display:flex;align-items:center;justify-content:center;background:var(--color-bg)}
.loadbar .spin{color:var(--color-accent)}
.conv.loading .th{top:var(--control-field)}

/* live turn states */
.turn.live.fail::before{background:var(--color-danger)}
.fail .badge svg{color:var(--color-danger)}
.frozen .sdot{animation:none;box-shadow:none;background:var(--color-text-3)}
.turn.live.frozen::before{background:var(--color-text-3)}
.frozen .spin{animation:none;color:var(--color-text-3)!important}
.frozen .act.run .m{color:var(--color-text-3)}
.frozen .caret{animation:none;background:var(--color-text-3)}
.quiet-line{display:flex;align-items:center;gap:var(--space-2);height:var(--layout-row);color:var(--color-text-3)}
.quiet-line .spin{color:var(--color-accent)}

/* empty */
.empty{flex:1;display:grid;place-items:center;padding-bottom:var(--layout-topbar)}
.empty .in{display:flex;flex-direction:column;align-items:center;gap:var(--space-4)}
.empty .tile{width:48px;height:48px;border-radius:var(--radius-lg);display:grid;place-items:center;background:var(--color-raised);box-shadow:var(--shadow-live)}
.empty p{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text-2);letter-spacing:-0.01em}
.empty .k{display:flex;align-items:center;gap:var(--space-3);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);margin-top:calc(-1 * var(--space-2))}
.empty .k span{display:flex;align-items:center;gap:var(--space-1)}

/* inspector */
.insp{background:var(--color-sidebar);box-shadow:var(--shadow-drawer);display:flex;flex-direction:column;min-width:0;position:relative;z-index:4}
.insp-h{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);flex:none;box-shadow:inset 0 -1px 0 var(--color-line)}
.insp-h .sp{flex:1}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);position:relative}
.light .seg{background:var(--color-hover)}
.seg button{height:24px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:6px;font-weight:var(--weight-medium);color:var(--color-text-2);white-space:nowrap}
.seg button .c{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;font-weight:var(--weight-regular)}
.seg button.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .seg button.on{background:var(--color-raised)}
.seg button.on .c{color:var(--color-text-2)}
.seg button[disabled]{color:var(--color-text-3);opacity:.6;cursor:default}
.tip{position:absolute;left:calc(100% + 8px);top:50%;transform:translateY(-50%);z-index:6;display:block;padding:var(--space-1) var(--space-2);font-size:var(--text-meta);line-height:var(--leading-meta);border-radius:var(--radius-sm);background:var(--color-raised);box-shadow:var(--shadow-float);color:var(--color-text-2);white-space:nowrap}
.tip::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;margin-top:-4px;transform:rotate(45deg);background:var(--color-raised);border-radius:1px}
.ft{width:16px;height:16px;display:grid;place-items:center;flex:none}
.files{flex:1;min-height:0;padding:var(--space-2) var(--space-2) 0;overflow:hidden}
.f{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding-right:var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2);white-space:nowrap}
.f .chv{width:16px;height:16px;color:var(--color-text-3);display:grid;place-items:center;flex:none}
.f.open .chv svg{transform:rotate(90deg)}
.f .nm{overflow:hidden;text-overflow:ellipsis}
.f .tag{margin-left:auto}
.tag{width:16px;text-align:center;font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-semibold);font-variant-numeric:tabular-nums;flex:none}
.f.g-m .nm{color:var(--color-git-modified)}.f.g-u .nm{color:var(--color-git-untracked)}.f.g-d .nm{color:var(--color-git-deleted)}
.f.g-m .tag{color:var(--color-git-modified)}.f.g-u .tag{color:var(--color-git-untracked)}
.f.g-c .tag::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--color-git-modified);opacity:.85;vertical-align:1px}
.f.on,.cr.on{background:var(--color-selected);box-shadow:inset 0 1px 0 var(--color-highlight)}
.chg{flex:1;min-height:0;overflow:hidden;padding:var(--space-2) var(--space-2) 0}
.chg .nt{margin:0 0 var(--space-2)}
.chg-sum{display:flex;align-items:center;gap:var(--space-1);height:var(--layout-row);padding:0 var(--space-2);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-2);font-variant-numeric:tabular-nums}
.chg-sum i{font-style:normal;color:var(--color-text-3)}
.cr{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap;color:var(--color-text-2)}
.cr .nm{flex:none}
.cr.g-m .nm{color:var(--color-git-modified)}.cr.g-u .nm{color:var(--color-git-untracked)}.cr.g-d .nm{color:var(--color-git-deleted)}
.cr .dir{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.cr .cnt{display:flex;gap:var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-variant-numeric:tabular-nums}
.cr .bin{color:var(--color-text-3)}
.cr.g-m .tag,.vh .tag.g-m{color:var(--color-git-modified)}.cr.g-u .tag{color:var(--color-git-untracked)}.cr.g-d .tag{color:var(--color-git-deleted)}

/* handoff card */
.ho{margin:var(--space-3);margin-top:auto;padding:var(--space-4);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-live);display:flex;flex-direction:column;gap:var(--space-3);flex:none}
.ho b{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold)}
.ho p{color:var(--color-text-2);margin-top:calc(-1 * var(--space-1))}
.ho.focus{box-shadow:var(--shadow-live),0 0 0 1.5px var(--color-accent)}
.ho .hh{display:flex;align-items:baseline;gap:var(--space-2)}
.ho .hh .meta{margin-left:auto}
.ho .btn{justify-content:center}
.pick{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-3);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line)}
.pick .v{flex:1}
.pick > svg{color:var(--color-text-3)}
.why{color:var(--color-text-2);display:flex;gap:var(--space-2)}
.why svg{color:var(--color-text-3);margin-top:2px}
.fld{display:flex;flex-direction:column;gap:var(--space-1)}
.fld .l{color:var(--color-text-2)}
.input{height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);display:flex;align-items:center;padding:0 var(--space-3);font-family:var(--font-mono);font-size:var(--text-code);color:var(--color-text);white-space:nowrap;overflow:hidden}
.input.on{box-shadow:inset 0 0 0 1.5px var(--color-accent)}
.input.ui{font-family:var(--font-ui);font-size:var(--text-ui)}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:var(--space-2);align-items:center;height:var(--layout-row);color:var(--color-text)}
.step .si{display:grid;place-items:center;color:var(--color-text-3)}
.step .si .spin{color:var(--color-accent)}
.step .sm{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.step.ok .si{color:var(--color-success)}
.step.bad,.step.bad .si,.step.bad .sm{color:var(--color-danger)}
.step.todo{color:var(--color-text-3)}
.pend{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);opacity:.8}
.bar{grid-column:2/4;height:4px;border-radius:2px;background:var(--color-line);overflow:hidden;margin:0 0 var(--space-2)}
.bar i{display:block;height:100%;width:60%;border-radius:2px;background:var(--color-accent)}
.nt{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);display:flex;gap:var(--space-2);color:var(--color-text)}
.nt svg{margin-top:2px}
.nt.bad{background:var(--color-del-bg)}
.nt.bad svg{color:var(--color-danger)}
.nt.ok{background:var(--color-add-bg)}
.nt.ok svg{color:var(--color-success)}
.nt.snap{background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2)}

  const head = `<div class="vh">${ftOf(n)}<span class="nm"><b>${n}</b><span>${d}</span></span><span class="tag g-${g.toLowerCase()}" title="${GIT[g]}">${g}</span>${!fileMode && a != null ? `<span class="cnt">${counts(a, r)}</span>` : ''}<span class="sp"></span>${ro}
      <div class="seg"><button class="${fileMode ? '' : 'on'}">Diff</button><button class="${fileMode ? 'on' : ''}"${snap ? ' disabled title="Files need MacBook Pro online"' : ''}>File</button></div>${nav}</div>`;

  else if (state === 'diff-binary') body = `<div class="bin2">

      <div class="bside now"><div class="bl"><span>After</span><span class="meta">21.0 KiB</span></div><div class="ckr">${iconArt('now', 120)}</div><span class="cap">512 × 512</span></div></div>`;

function inspector(state) {
  const off = OFFLINE.includes(state);

    </div><span class="sp"></span>${ib(I.panel(), 'Hide workspace · ⌘I', 'on')}</div>`;

  if (wide) {
    const sel = { 'diff-large': 1, 'diff-binary': 3 }[state] ?? 0;
    const list = tab === 'changes' ? changesList(off, sel, true) : filesTree(state === 'file-image' ? 'icon.png' : 'chunks.ts', 14);
    return `<aside class="insp">${head}<div class="md">

  const pick = `<div class="pick" title="Connected machines"><span class="dot"></span><span class="v">studio</span>${I.down()}</div>`;
  const step = (cls, icon, label, meta = '') => `<div class="step ${cls}"><span class="si">${icon}</span><span>${label}</span><span class="sm">${meta}</span></div>`;

        <button class="btn" disabled>${I.handoff()}Hand off to studio</button>
        <div class="why">${I.lock()}<span>Available when the turn ends</span></div></div>`; break;
    case 'handoff':
      card = `<div class="ho focus"><b>Hand off</b><p>Move this session and its working tree to another machine.</p>${pick}
        <button class="btn primary">${I.handoff()}Hand off to studio</button>
        <div class="why">${I.info()}<span>studio adds a worktree and continues the session. Nothing moves until it verifies the copy.</span></div></div>`; break;
    case 'handoff-path':

        <div class="fld"><span class="l">studio has no clone of <span class="mono">github.com/yangflow/hoplet</span>.</span></div>
        <div class="fld"><span class="l">Clone on studio</span><div class="input on">/Users/mark/github/hoplet</div></div>
        <button class="btn primary">${I.handoff()}Hand off to studio</button></div>`; break;
    case 'handoff-progress':
      card = `<div class="ho"><div class="hh"><b>Handing off to studio</b><span class="meta">2 of 5</span></div>
        <div class="steps">
          ${step('ok', I.check(), 'Prepare', 'MacBook Pro · 0.8 s')}
          ${step('', spin(), 'Transfer', '6.2 / 10.4 MiB')}<div class="bar"><i></i></div>
          ${step('todo', pend, 'Install')}${step('todo', pend, 'Verify')}${step('todo', pend, 'Commit')}

        <div class="why">${I.lock()}<span>Nothing moves until commit. A failure leaves owner and cursor unchanged.</span></div></div>`; break;
    case 'handoff-failed':
      card = `<div class="ho"><b>Hand off failed</b>
        <div class="steps">
          ${step('ok', I.check(), 'Prepare', 'MacBook Pro · 0.8 s')}
          ${step('ok', I.check(), 'Transfer', '10.4 MiB · 2.9 s')}
          ${step('bad', I.x(), 'Install', 'no-clone')}

        <button class="btn primary">${I.handoff()}Hand off to studio</button></div>`; break;
    case 'handoff-done':
      card = `<div class="ho"><b>Handed off to studio</b>
        <div class="steps">
          ${step('ok', I.check(), 'Prepare', 'MacBook Pro · 0.8 s')}
          ${step('ok', I.check(), 'Transfer', '10.4 MiB · 2.9 s')}
          ${step('ok', I.check(), 'Install', 'studio · 1.6 s')}
          ${step('ok', I.check(), 'Verify', 'SHA-256 and tree match')}
          ${step('ok', I.check(), 'Commit', '14:07')}
        </div>

    case 'handoff-offline': case 'changes-offline':

        ${pick}

    default:
      card = `<div class="ho"><b>Hand off</b>${pick}

  }
  return `<aside class="insp">${head}${body}${card}</aside>`;

    main = top + body;
  }
  const cls = `frame ${scheme}${insp ? ' with-insp' : ''}${wide ? ' wide' : ''}${nosb ? ' nosb' : ''}`;
  return `<div class="${cls}" data-state="${state}">
    ${nosb ? '' : sidebar(state)}
    <main class="main">${main}</main>
    ${insp ? inspector(state) : ''}
    ${state === 'new-session' ? newSessionModal() : state.startsWith('add-project') ? addProjectModal(state) : state === 'search' ? palette() : ''}
  </div>`;
}

const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
// ?state= picks one of STATES; only the matching entry's own name reaches the markup, never the address's text.
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  const keys = Object.keys(T.dark);
  const c = v => (/^#|^rgba/.test(v) ? `<span class="sw" style="background:${esc(v)}"></span>` : '') + esc(v);
  const rows = keys.map(k => `<tr><td>${esc(k)}</td><td>${c(T.dark[k])}</td><td>${c(T.light[k])}</td></tr>`).join('') +
    Object.entries(T.shared).map(([k, v]) => `<tr><td>${esc(k)}</td><td colspan="2">${esc(v)}</td></tr>`).join('');
  const chip = v => `<span class="chip" style="background:${esc(v)}"></span>`;
  root.innerHTML = `<header class="intro"><h1>${SCREEN.name} <span>Relay + Blocks</span></h1>
    <p>${SCREEN.blurb} Relay’s shell, Blocks’ conversation. A native-feeling sidebar, top bar and inspector frame a centred column where each prompt and everything it caused forms one turn. Finished turns rest flat on the warm canvas with a hairline between them and a terse summary, so a long session can be skimmed turn by turn. The live turn is the only elevated object on screen; a permission request opens inside it. State is carried by glyph shape and colour, with words only where a state blocks or changes what the user can do; actions are icon buttons with titles, and only decisions keep text.</p>
    <div class="cols">
      <div><h3>Colour roles</h3><ul>
        <li>${chip('#ff7a1a')}<b>Orange</b> means live or primary: the running turn, its edge, Send, Allow, recording.</li>
        <li>${chip('#e8b31a')}<b>Amber</b> means needs you: a permission request, here and in the sidebar, with the only static ring.</li>
        <li>${chip('#ff7366')}<b>Red</b> means failed, disconnected, and deleted lines.</li>
        <li>${chip('#4cc38a')}<b>Green</b> means online, connected to the core, done, and added lines.</li>
        <li>${chip('#d9b77e')}<b>Git colours</b> live only in the workspace, as in VS Code: tan M modified, green U untracked, red D deleted; a folder with changes carries a dot.</li>
        <li>${chip('#7ec3e3')}<b>Syntax</b> tokens tint code and file-type badges: blue types and code files, violet keywords and Markdown, sand numbers and JSON, green strings and images.</li>
      </ul></div>
      <div><h3>Design principles</h3><ul>
        <li><b>The turn is the unit.</b> Prompt, work and answer stay together and summarise themselves.</li>
        <li><b>State by shape.</b> On the right of a session row, where the time sits when idle: spinner running or starting, ringed amber dot waiting, red dot failed, orange dot ready, eye external; a hollow dot marks an offline device, whose sessions dim and keep their time. A folded directory shows its session count and the strongest state that needs you. Each glyph names its state in its title.</li>
        <li><b>The provider is a mark, not a colour.</b> Monochrome in the row’s text colour, named in its title; orange stays reserved for live.</li>
        <li><b>Needing the user is the loudest signal.</b> Amber, a ring, and the only dot that does not move.</li>
        <li><b>One accent means live.</b> Nothing decorative is orange.</li>
        <li><b>The shell maps to native.</b> Source list, content, inspector; the wide inspector is a master–detail split, and the sidebar folds while it is open below 1408 px.</li>
        <li><b>Prose reads, output scans.</b> Sans 15/24 under 68ch; tool calls as one row grammar; output in one mono well.</li>
        <li>The inspector tab bar holds Changes and Files; Terminal and Browser are reserved (#14, #15). Settings sections are a list with room for more.</li>
      </ul></div>
    </div>
    ${SCREEN.system ? systemSection() : ''}
    <table class="tok"><tr><th>Token</th><th>Dark</th><th>Light</th></tr>${rows}</table></header>` +
    STATES.map(([s, d]) => `<section class="st"><h2>${s}<span>${d}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}

/* scroll each conversation: to its anchor when the state names one, else to the end; then pin headers */
document.querySelectorAll('.frame').forEach(f => {
  const conv = f.querySelector('.conv');
  if (!conv) return;
  const scale = conv.getBoundingClientRect().height / conv.offsetHeight || 1;
  const off = conv.classList.contains('loading') ? 32 : 0;
  const place = () => {
    const a = conv.querySelector('[data-anchor]');
    if (!a) { conv.scrollTop = conv.scrollHeight; return; }
    const th = a.closest('.turn').querySelector('.th');
    conv.scrollTop += (a.getBoundingClientRect().top - conv.getBoundingClientRect().top) / scale - th.offsetHeight - off - 6;
  };
  const pin = () => conv.querySelectorAll('.turn.done').forEach(t => {
    const th = t.querySelector('.th');
    th.classList.toggle('stuck', t.offsetTop < conv.scrollTop + off - 1 && t.offsetTop + t.offsetHeight - th.offsetHeight > conv.scrollTop + off);
  });
  place(); pin(); place(); pin(); place();
  const load = f.querySelector('.loadbar');
  if (load) load.style.top = `${conv.offsetTop}px`;
});
