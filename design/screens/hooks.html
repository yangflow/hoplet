<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* one type scale: meta 11/16 · UI 13/20 · prose 15/24 · title 15/20 600 · mono 12.5/20; weights 400/500/600 */
.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.with-insp{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.nosb,.frame.page{grid-template-columns:1fr}
.frame.nosb.with-insp{grid-template-columns:1fr var(--layout-inspector)}
.frame.with-insp.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}

/* icon buttons: the icon carries the intent, the title names it */
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib[disabled]{opacity:.4;cursor:default}
.ib.bd{color:var(--color-text-2);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .ib.bd{background:var(--color-raised)}
.ib .cdg{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--color-git-modified);box-shadow:0 0 0 2px var(--color-bg)}

/* a machine's view options: its name, then Organize and Sort as two radio groups under the row */
.pop{position:absolute;z-index:30;top:calc(100% - var(--space-1));left:var(--space-2);right:var(--space-2);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-title{padding:var(--space-2) var(--space-2) var(--space-1);font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-label{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.menu-check{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.menu-sep{height:1px;margin:var(--space-1) var(--space-2);background:var(--color-line)}
.pm{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sess.on .pm{color:var(--color-text-2)}
.gl{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.gl .spin{color:var(--color-accent)}
.need-dot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring)}
.bad-dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.ready-dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex:none}
.off-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.devg.off .dev,.devg.off .sdir,.devg.off .sess{color:var(--color-text-3)}
.devg.off .dev{font-weight:var(--weight-medium)}
.devg.off .sess.on{color:var(--color-text-2)}
.frozen-side .gl .spin{color:var(--color-text-3);animation:none}
.side-foot{height:var(--layout-foot);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4);box-shadow:inset 0 1px 0 var(--color-line);flex:none}
.conn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);white-space:nowrap}
.conn .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.conn.lost{color:var(--color-danger)}
.conn.lost .dot{background:var(--color-danger)}

/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3) 0 var(--space-5);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.nosb .top{padding-left:var(--space-3)}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.top .sp{flex:1}

/* conversation */
.conv{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:0 0 148px}
.conv::-webkit-scrollbar{display:none}
.col{width:min(var(--layout-column),calc(100% - 104px));margin:0 auto;padding-top:var(--space-2)}
.wide .col{width:calc(100% - 48px)}

.badge{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-variant-numeric:tabular-nums}
/* text buttons: decisions only */
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}
.light .btn{background:var(--color-raised)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);font-weight:var(--weight-semibold);padding:0 var(--space-4)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--color-text-2);padding:0 var(--space-2)}
.btn svg{color:currentColor}
.btn[disabled]{opacity:.5;cursor:default}

/* composer */
.dock{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:var(--space-7) 0 var(--space-4);background:linear-gradient(var(--fade-bg),var(--color-bg) 42%);pointer-events:none}
.composer{pointer-events:auto;border-radius:var(--radius-xl);background:var(--color-raised);box-shadow:var(--shadow-float);padding:var(--space-3) var(--space-2) var(--space-2) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.ph{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text-3)}
.cf{display:flex;align-items:center;gap:var(--space-1);min-height:var(--control-field);margin-left:calc(-1 * var(--space-2))}
.cf .cst{display:flex;align-items:center;gap:var(--space-2);height:20px;color:var(--color-text-2);margin:0 0 0 var(--space-1);padding-left:var(--space-3);box-shadow:inset 1px 0 0 var(--color-line)}
.cf .cst.bad{color:var(--color-danger)}
.cf .r{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.send{width:var(--control-field);height:var(--control-field);border-radius:50%;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);flex:none}
.send[disabled]{background:var(--color-hover);color:var(--color-text-3);box-shadow:none;cursor:default}
.composer.cbar{flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-5);min-height:56px}
.composer.cbar .cst{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2);flex:1}
.composer.cbar .cst svg{color:var(--color-text-3)}
.composer.ro{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.recrow{display:flex;align-items:center;gap:var(--space-3);height:24px;padding-right:var(--space-2)}
.recrow .rdot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-soft);animation:pulse var(--motion-pulse) ease-in-out infinite;flex:none}
.recrow .el{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);font-variant-numeric:tabular-nums;width:36px;flex:none}
.wave{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;height:24px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 18%);mask-image:linear-gradient(to right,transparent,#000 18%)}
.wave i{flex:none;width:3px;border-radius:2px;background:var(--color-accent-text)}
.cf .note{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);margin-left:var(--space-3)}

.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);position:relative}
.light .seg{background:var(--color-hover)}
.seg button{height:24px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:6px;font-weight:var(--weight-medium);color:var(--color-text-2);white-space:nowrap}
.seg button .c{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;font-weight:var(--weight-regular)}
.seg button.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .seg button.on{background:var(--color-raised)}
.seg button.on .c{color:var(--color-text-2)}
.seg button[disabled]{color:var(--color-text-3);opacity:.6;cursor:default}
.fld{display:flex;flex-direction:column;gap:var(--space-1)}
.fld .l{color:var(--color-text-2)}
.input{height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);display:flex;align-items:center;padding:0 var(--space-3);font-family:var(--font-mono);font-size:var(--text-code);color:var(--color-text);white-space:nowrap;overflow:hidden}
.input.on{box-shadow:inset 0 0 0 1.5px var(--color-accent)}
.input.ui{font-family:var(--font-ui);font-size:var(--text-ui)}
.nt{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);display:flex;gap:var(--space-2);color:var(--color-text)}
.nt svg{margin-top:2px}
.nt.bad{background:var(--color-del-bg)}
.nt.bad svg{color:var(--color-danger)}
.nt.ok{background:var(--color-add-bg)}
.nt.ok svg{color:var(--color-success)}
.nt.snap{background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2)}
.nt.snap svg{color:var(--color-text-3)}
.sel{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);white-space:nowrap}
.sel .v{flex:1;overflow:hidden;text-overflow:ellipsis}
.sel > svg{color:var(--color-text-3)}
.sel .pm{color:var(--color-text-2)}
.sel .sl{width:16px;height:16px;display:grid;place-items:center;flex:none}
.tgls{display:flex;gap:var(--space-4);align-items:center;height:var(--control-field)}
.tgl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2)}
.switch{width:28px;height:16px;border-radius:8px;background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--color-text-3)}
.switch.on{background:var(--color-accent);box-shadow:none}
.switch.on::after{left:14px;background:var(--color-on-accent)}
/* settings */
.set{flex:1;min-height:0;display:grid;grid-template-columns:var(--layout-settings-nav) minmax(0,1fr)}
.snav{padding:var(--space-3) var(--space-2);box-shadow:inset -1px 0 0 var(--color-line);display:flex;flex-direction:column;gap:2px}
.ni{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2)}
.ni svg{color:var(--color-text-3)}
.ni.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ni.on svg{color:var(--color-text-2)}
.spage{overflow:auto;padding:var(--space-4) var(--space-7) var(--space-5)}
.spage .in{max-width:620px;margin:0 auto}
.spage h1{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;margin-bottom:var(--space-5)}
.sgrp + .sgrp{margin-top:var(--space-5)}
.sgrp .lb{font-weight:var(--weight-semibold);color:var(--color-text);margin-bottom:var(--space-2)}
.themes{display:flex;gap:var(--space-4)}
.thc{display:flex;flex-direction:column;gap:var(--space-2)}
.thp{width:164px;height:88px;border-radius:var(--radius-md);overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--color-line)}
.thc.on .thp{box-shadow:0 0 0 2px var(--color-accent)}
.thp .mini{position:absolute;inset:0;display:grid;grid-template-columns:40px 1fr}
.thp .mini.half{clip-path:polygon(100% 0,100% 100%,0 100%)}
.thp .ms{display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.thp .ms i,.thp .mc i{display:block;height:4px;border-radius:2px}
.thp .mc{display:flex;flex-direction:column;gap:8px;padding:12px}
.thp .mc .cb{margin-top:auto;height:16px;border-radius:6px}
.rl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text)}

/* stacked view */

/* prose */
.text{font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);margin:var(--space-1) 0 var(--space-3);max-width:var(--measure-prose)}

<body>
<div id="root"></div>
<script>
const T = JSON.parse(document.getElementById('tokens').textContent);
const vars = o => Object.entries(o).map(([k, v]) => `${k}:${v};`).join('');

const spin = () => sv(L['loader-circle'], 'spin');
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
const tip = s => ` title="${s}" aria-label="${s}"`;
const ib = (icon, s, cls = '', off = false) => `<button class="ib ${cls}"${tip(s)}${off ? ' disabled' : ''}>${icon}</button>`;
const btn = (label, icon = '', cls = '', s = '', off = false) => `<button class="btn ${cls}"${s ? tip(s) : ''}${off ? ' disabled' : ''}>${icon}${label}</button>`;
const code = s => `<span class="mono">${esc(s)}</span>`;

/* the interface language of the frame being drawn: the mockup is written in English, Simplified Chinese is the zh-Hans.json wording */
let Z = false;
const t = (en, zh) => (Z ? zh : en);
/* ---- icons added for the rules screens (Lucide) ---------------------------------------------------------------- */

/* ---- icons added for the hooks screens (all in the closed set) --------------------------------------------------- */
Object.assign(L, {

});
Object.assign(I, { hook: () => sv(L.webhook), play: () => sv(L.play), copy: () => sv(L.copy), more: () => sv(L.ellipsis), audit: () => sv(L['list-checks']) });

const sw = (on, label, off = false) => `<span class="switch${on ? ' on' : ''}" role="switch" aria-checked="${on}" aria-label="${esc(label)}"${off ? ' aria-disabled="true"' : ''}></span>`;
const seg = (items, on, label) => `<div class="seg" role="radiogroup" aria-label="${label}">${items.map(([k, en, zh]) => `<button role="radio" aria-checked="${k === on}" class="${k === on ? 'on' : ''}">${t(en, zh)}</button>`).join('')}</div>`;
const field = (label, inner, hint = '') => `<div class="fld"><span class="l">${label}</span>${inner}${hint ? `<span class="meta">${hint}</span>` : ''}</div>`;
const list = rows => `<div class="mp-list">${rows}</div>`;
const ch = s => `<span class="hqc">${esc(s)}</span>`;
const cb = on => `<span class="hcb${on ? ' on' : ''}" role="checkbox" aria-checked="${on}">${on ? sv(L.check) : ''}</span>`;

function nav() {
  const ni = (on, icon, label) => `<div class="ni${on ? ' on' : ''}">${icon}${label}</div>`;
  return `<nav class="snav" aria-label="${t('Settings sections', '设置分区')}">
    ${ni(false, I.contrast(), t('Appearance', '外观'))}${ni(false, I.laptop(), t('Machines', '机器'))}${ni(false, I.plug(), t('Model providers', '模型提供方'))}${ni(false, I.bell(), t('Notifications', '通知'))}${ni(false, I.rules(), t('Permission rules', '权限规则'))}${ni(true, I.hook(), t('Hooks', '钩子'))}${ni(false, I.audit(), t('Audit', '审计'))}${ni(false, I.chart(), t('Usage', '用量'))}
  </nav>`;
}
function settingsShell(body, wide = '') {
  return `<header class="top">${ib(I.back(), t('Back to the conversation · Esc', '返回会话 · Esc'))}<span class="title">${t('Settings', '设置')}</span></header>
    <div class="set">${nav()}<div class="spage ${wide}"><div class="in">${body}</div></div></div>`;
}

/* ---- data ------------------------------------------------------------------------------------------------------- */

const ALL = Object.keys(EV);
const SECRET = 'whsec_EXAMPLE-NOT-A-REAL-SECRET-0000000000000000';
const HK = [
  { id: 'slack', label: 'Slack relay', url: 'ops.example.net/hoplet', ev: ['turn.completed', 'session.error', 'permission.requested'], scope: 'all', on: true, st: 'ok', last: ['Delivered 2 min ago', '2 分钟前已送达'], sum: true },

    { id: 'pull-branch', cmd: '/Users/yang/bin/pull-branch.sh', ev: ['handoff.completed'], proj: ['every project', '所有项目'], to: 30, env: [], en: true, st: 'bad', last: ['Exit 1 · 0.4 s · 13:40', '退出码 1 · 0.4 秒 · 13:40'], err: 'error: cannot fast-forward origin/main\nhint: run git pull --rebase first' },

  ] },
  { m: 'mini', on: false, hooks: [
    { id: 'chime', cmd: '/Users/yang/bin/chime', ev: ['turn.completed'], proj: ['every project', '所有项目'], to: 10, env: [], en: true, st: 'gone', last: ['Offline · events dropped', '离线 · 事件已丢弃'], err: '' },
  ] },
];

/* ---- rows ------------------------------------------------------------------------------------------------------- */
function hookRow(h, o = {}) {
  const name = t(stText[h.st][0], stText[h.st][1]);
  const lcls = h.st === 'bad' ? ' bad' : h.st === 'att' ? ' att' : '';
  return `<div class="hk${o.sm ? ' sm' : ''}${h.on ? '' : ' off'}${o.sel ? ' sel' : ''}"><span class="hd ${h.st}" role="img" aria-label="${esc(name)}" title="${esc(name)}"></span>

function scriptRow(s, o = {}) {

function deliveries(rows, o = {}) {
  const head = o.hookCol
    ? `<div class="dv w6 th2"><span>${t('Time', '时间')}</span><span>${t('Hook', '钩子')}</span><span>${t('Event', '事件')}</span><span>${t('State', '状态')}</span><span class="n">${t('Tries', '次数')}</span><span>${t('Response', '响应')}</span></div>`
    : `<div class="dv th2"><span>${t('Time', '时间')}</span><span>${t('Event', '事件')}</span><span>${t('State', '状态')}</span><span class="n">${t('Tries', '次数')}</span><span>${t('Response', '响应')}</span></div>`;
  const hk = ['Slack relay', 'CI trigger', 'Pager', 'Slack relay', 'Pager', 'Pager', 'Slack relay', 'Log sink'];
  const body = rows.map((r, i) => {
    const s = DST[r[2]];

    return o.hookCol
      ? `<div class="dv w6"><span class="mono num">${r[0]}</span><span>${hk[i]}</span><span class="mono">${r[1]}</span>${stt}<span class="n">${r[3]}</span><span class="r">${r[4]}</span></div>`

  }).join('');
  return `<div class="mp-list">${head}${body}<div class="dvf">${t('The latest 100 deliveries, kept 14 days. The response body is not stored.', '最近 100 次投递，保留 14 天。不保存响应正文。')}</div></div>`;
}

/* ---- the editor ------------------------------------------------------------------------------------------------- */
function editorFields(h, mode) {
  const evs = ALL.map(k => `<div class="hev">${cb(h.ev.includes(k))}<div class="tx"><span class="mono">${k}</span><span class="meta">${t(EV[k][0], EV[k][1])}</span></div></div>`).join('');
  return `${field(t('Label', '名称'), `<div class="input ui">${h.label}</div>`)}
    ${field(t('URL', '地址'), `<div class="input">https://${h.url}</div>`, t('https only. The query string is stored but never shown again, so it can carry a token.', '仅支持 https。查询字符串会保存但不再显示，可以放令牌。'))}
    ${field(t('Events', '事件'), `<div class="hevs">${evs}</div>`)}
    ${field(t('Projects', '项目'), `<div style="display:flex;gap:var(--space-2);align-items:center">${seg([['all', 'All projects', '所有项目'], ['proj', 'One project', '单个项目']], h.scope, t('Projects', '项目'))}${h.scope === 'proj' ? `<div class="sel" style="width:232px;flex:none"><span class="sl">${I.folder()}</span><span class="v">hoplet · MacBook Pro</span>${I.down()}</div>` : ''}</div>`)}
    <div class="hsw">${sw(!!h.sum, t('Include a summary', '包含摘要'))}<div class="tx"><span>${t('Include a summary', '包含摘要')}</span><span class="meta">${t('Adds the session title and usage to turn.completed, a redacted command or path to permission.requested and the reason to session.error. Off sends names, codes, counts and times only.', '为 turn.completed 增加会话标题和用量，为 permission.requested 增加已脱敏的命令或路径，为 session.error 增加原因。关闭时只发送名称、代码、数量和时间。')}</span></div></div>
    <div class="hsw">${sw(h.on !== false, t('Enabled', '启用'))}<div class="tx"><span>${t('Enabled', '启用')}</span></div></div>`;
}
const ADD = { label: 'Deploy notifier', url: 'deploy.example.org/hoplet', ev: ['session.ended', 'handoff.completed'], scope: 'all', on: true, sum: false };
const formFoot = (mode, cls = 'mcard-f') => `<div class="${cls}">${mode === 'edit' ? btn(t('Delete', '删除'), I.trash(), 'quiet del') : ''}${mode === 'edit' ? btn(t('Send test event', '发送测试事件'), I.play(), 'quiet') : ''}${btn(t('Cancel', '取消'), '', 'quiet')}${btn(mode === 'edit' ? t('Save', '保存') : t('Add hook', '添加钩子'), '', 'primary')}</div>`;
const editorCard = (h, mode, title) => `<div class="mcard" role="group" aria-label="${title}"><div class="mcard-h"><b>${title}</b>${ib(I.x(), t('Close · Esc', '关闭 · Esc'))}</div>${editorFields(h, mode)}${formFoot(mode)}</div><div style="height:var(--space-5)"></div>`;
const editorDialog = (h, mode, title) => `<div class="scrim"></div><div class="modal dlg hd-dlg" role="dialog" aria-modal="true" aria-label="${title}"><div class="dlg-h">${title}</div><div class="dlg-b">${editorFields(h, mode)}</div>${formFoot(mode, 'dlg-f')}</div>`;

/* the one-time secret */
function secretBody(rotated) {
  return `<div class="hwarn" role="note">${I.alert()}<span>${t('Copy this secret now. Hoplet keeps it to sign deliveries and never shows it again.', '请现在复制此密钥。Hoplet 用它为投递签名，之后不会再显示。')}</span></div>
    ${field(t('Signing secret', '签名密钥'), `<div class="hsec"><span class="mono">${SECRET}</span>${btn(t('Copy', '复制'), I.copy(), '')}</div>`)}
    ${rotated ? `<div class="nt snap" role="note">${I.info()}<span>${t('The previous secret keeps working until 14:32 tomorrow. Until then each delivery carries both signatures, so you can switch the receiver without a gap.', '旧密钥在明天 14:32 之前仍然有效。在此之前，每次投递都带有两个签名，接收方可以无缝切换。')}</span></div>` : ''}
    <div class="meta">${t('A receiver checks', '接收方校验')} <span class="mono">Hoplet-Signature: t=&lt;unix seconds&gt;,v1=&lt;hex&gt;</span> ${t('over the raw body and refuses a time more than 5 minutes off.', '针对原始请求体，并拒绝与当前时间相差超过 5 分钟的时间戳。')}</div>`;
}
const secretCard = (title, rotated) => `<div class="mcard" role="group" aria-label="${title}"><div class="mcard-h"><b>${title}</b></div>${secretBody(rotated)}<div class="mcard-f">${btn(t('Done', '完成'), '', 'primary')}</div></div><div style="height:var(--space-5)"></div>`;
const secretDialog = (title, rotated) => `<div class="scrim"></div><div class="modal dlg hd-dlg" role="dialog" aria-modal="true" aria-label="${title}" style="top:120px"><div class="dlg-h">${title}</div><div class="dlg-b">${secretBody(rotated)}</div><div class="dlg-f">${btn(t('Done', '完成'), '', 'primary')}</div></div>`;
const rotateConfirm = () => `<div class="scrim"></div><div class="modal dlg hd-dlg" role="dialog" aria-modal="true" aria-label="${t('Rotate the secret of Slack relay?', '轮换 Slack relay 的密钥？')}" style="top:200px;width:480px"><div class="dlg-h">${t('Rotate the secret of Slack relay?', '轮换 Slack relay 的密钥？')}</div><div class="dlg-b"><p style="color:var(--color-text-2)">${t('Hoplet makes a new secret and shows it once. The old one keeps working for 24 hours, so the receiver can switch without missing a delivery.', 'Hoplet 会生成新密钥并只显示一次。旧密钥在 24 小时内仍然有效，接收方可以在不漏掉投递的情况下切换。')}</p></div><div class="dlg-f">${btn(t('Cancel', '取消'), '', 'quiet')}${btn(t('Rotate secret', '轮换密钥'), I.retry(), 'primary')}</div></div>`;

/* ---- the parts of a page ---------------------------------------------------------------------------------------- */
const lead = () => `<p class="rmeta qlead" style="margin-bottom:var(--space-5);color:var(--color-text-2)">${t('A hook tells another program when something happens in a session. It only observes: what a hook does or fails to do never changes a session, a permission or a handoff. Delivery is at least once, so a receiver keeps the event id.', '钩子在会话中发生事件时通知其他程序。它只做观察：钩子做了什么或没做成什么，都不会改变会话、权限或交接。投递至少一次，接收方应记住事件 id。')}</p>`;
const addHook = (primary = true) => btn(t('Add webhook', '添加 Webhook'), I.plus(), primary ? 'primary' : '');
const grpHead = (title, right = '') => `<div class="hgh"><span class="lb">${title}</span><span class="sp"></span>${right}</div>`;
const emptyHooks = () => `<div class="uempty"><span class="tile">${I.hook()}</span><b>${t('No hooks yet', '还没有钩子')}</b>
  <p>${t('Add a webhook to post session events to another service, such as a chat room or a CI job. A script on one of your machines is declared in that machine’s agent configuration and appears here.', '添加 Webhook，把会话事件发送到其他服务，例如聊天室或 CI 任务。机器上的脚本在该机器的 agent 配置中声明，并会显示在这里。')}</p>
  <div class="acts">${addHook()}</div></div>`;
const testOk = () => `<div class="nt ok" role="status">${I.check()}<span>${t('Test event delivered to ops.example.net · 200 · 84 ms', '测试事件已送达 ops.example.net · 200 · 84 毫秒')}</span></div>`;
const testBad = () => `<div class="nt bad" role="status">${I.alert()}<span>${t('Test event failed · blocked-address. The host resolves to a private address; set HOPLET_HOOK_ALLOW_PRIVATE on the host to allow it.', '测试事件失败 · blocked-address。该主机解析为私有地址；如需允许，请在主机上设置 HOPLET_HOOK_ALLOW_PRIVATE。')}</span></div>`;
const detailBlock = (h, withDel = true) => `<div class="hxd">
  <div class="hkv"><span class="k">${t('URL', '地址')}</span><span class="v mono">https://${h.url}</span>
    <span class="k">${t('Events', '事件')}</span><span class="v">${h.ev.map(ch).join('')}</span>
    <span class="k">${t('Projects', '项目')}</span><span class="v">${scopeText(h)}</span>
    <span class="k">${t('Summary', '摘要')}</span><span class="v">${h.sum ? t('Included', '包含') : t('Not included', '不包含')}</span>
    <span class="k">${t('Secret', '密钥')}</span><span class="v">${h.needs ? t('Lost — rotate to send again', '已丢失，轮换后才能继续发送') : t('Set · created 3 Oct', '已设置 · 创建于 10 月 3 日')}</span></div>
  ${h.needs ? `<div class="hwarn" role="note">${I.alert()}<span>${t('The secret file lost this hook’s secret. Nothing is sent until you rotate it.', '密钥文件丢失了这个钩子的密钥。轮换之前不会发送任何内容。')}</span>${btn(t('Rotate secret', '轮换密钥'), I.retry(), '')}</div>` : ''}
  <div class="hacts">${btn(t('Edit', '编辑'), I.pen(), '')}${btn(t('Send test event', '发送测试事件'), I.play(), '', '', !!h.needs)}${h.needs ? '' : btn(t('Rotate secret', '轮换密钥'), I.retry(), '')}${btn(t('Delete', '删除'), I.trash(), 'quiet del')}</div>
  ${withDel ? `<div class="meta" style="margin-top:var(--space-1)">${t('Deliveries', '投递记录')}</div>${deliveries(DEL.slice(0, 6))}` : ''}</div>`;

/* ---- direction A: one page ------------------------------------------------------------------------------------- */
function aPage(st) {
  const h1 = `<h1>${t('Hooks', '钩子')}</h1>${lead()}`;
  if (st === 'a-empty') return `${h1}${grpHead(t('Webhooks', 'Webhook'), addHook())}${list(emptyHooks())}<div class="sgrp" style="margin-top:var(--space-5)">${grpHead(t('Scripts on your machines', '机器上的脚本'))}${scriptNote()}<div class="nt snap" style="margin-top:var(--space-3)">${I.info()}<span>${t('No machine declares a script hook.', '没有机器声明脚本钩子。')}</span></div></div>`;
  let top = '';
  const open = st === 'a-deliveries' ? 'slack' : st === 'a-needs-secret' ? 'relay' : '';
  let rows = HK.map(h => hookRow(h, { sel: h.id === open }) + (h.id === open ? detailBlock(h, !h.needs) : '')).join('');
  if (st === 'a-add') top = editorCard(ADD, 'add', t('Add webhook', '添加 Webhook'));
  if (st === 'a-edit') top = editorCard(HK[1], 'edit', t('Edit CI trigger', '编辑 CI trigger'));
  if (st === 'a-secret') top = secretCard(t('Hook added · deploy.example.org', '钩子已添加 · deploy.example.org'), false);
  if (st === 'a-test') rows = HK.map(h => hookRow(h, { sel: h.id === 'slack' }) + (h.id === 'slack' ? `<div class="hxd">${testOk()}</div>` : '')).join('');
  if (st === 'a-test-bad') rows = HK.map(h => hookRow(h, { sel: h.id === 'ci' }) + (h.id === 'ci' ? `<div class="hxd">${testBad()}</div>` : '')).join('');
  const scripts = `<div class="sgrp" style="margin-top:var(--space-5)">${grpHead(t('Scripts on your machines', '机器上的脚本'))}${scriptNote()}${scriptGroups({ err: st === 'a-script-run' })}</div>`;
  const editing = st === 'a-add' || st === 'a-edit' || st === 'a-secret';
  return `${editing ? `<h1>${t('Hooks', '钩子')}</h1>` : h1}${top}${grpHead(t('Webhooks', 'Webhook'), editing ? '' : addHook())}${list(rows)}${scripts}`;
}
const aOverlay = st => (st === 'a-rotate-confirm' ? rotateConfirm() : '');

/* ---- direction B: a list with the hook beside it ---------------------------------------------------------------- */
function bPage(st) {
  if (st === 'b-empty') return `<h1>${t('Hooks', '钩子')}</h1>${lead()}${list(emptyHooks())}`;
  const sel = st === 'b-script' ? 'notify-done' : 'slack';
  const left = `${grpHead(t('Webhooks', 'Webhook'), ib(I.plus(), t('Add webhook', '添加 Webhook')))}${list(HK.map(h => hookRow(h, { sm: true, sel: sel === h.id })).join(''))}
    <div style="height:var(--space-4)"></div>${grpHead(t('On your machines', '在你的机器上'))}${list(SC.flatMap(g => g.hooks.map(s => `<div class="hk sm sc${sel === s.id ? ' sel' : ''}${s.st === 'gone' ? ' gone' : ''}"><span class="lead">${I.term()}</span><div class="hx"><div class="h1"><b>${s.id}</b></div><div class="h2"><span>${g.m}</span></div></div>${I.lock()}</div>`)).join(''))}`;
  let right;
  if (st === 'b-script') {
    const s0 = SC[0].hooks[0];
    const cols = 'style="grid-template-columns:52px minmax(0,1fr) 96px 64px"';
    right = `<div class="hdt-h"><b>${s0.id}</b><span class="tag">${t('Declared on MacBook Pro', '在 MacBook Pro 上声明')}</span><span class="sp"></span>${sw(true, s0.id)}${btn(t('Send test event', '发送测试事件'), I.play())}</div>
      <div class="mp-list"><div class="hxd" style="background:transparent"><div class="hkv"><span class="k">${t('Command', '命令')}</span><span class="v mono">${s0.cmd}</span><span class="k">${t('Events', '事件')}</span><span class="v">${s0.ev.map(ch).join('')}</span><span class="k">${t('Projects', '项目')}</span><span class="v mono">${projText(s0)}</span><span class="k">${t('Timeout', '超时')}</span><span class="v">${s0.to} s</span><span class="k">${t('Passes env', '传入环境变量')}</span><span class="v">${s0.env.map(ch).join('')}</span></div></div></div>
      <div class="meta" style="margin:var(--space-4) 0 var(--space-2)">${t('Runs', '运行记录')}</div>${list(`<div class="dv th2" ${cols}><span>${t('Time', '时间')}</span><span>${t('Event', '事件')}</span><span>${t('Exit', '退出码')}</span><span class="n">${t('Took', '耗时')}</span></div><div class="dv" ${cols}><span class="mono num">14:06</span><span class="mono">turn.completed</span><span class="stt"><span class="hd ok"></span>0</span><span class="n">1.2 s</span></div><div class="dv" ${cols}><span class="mono num">13:41</span><span class="mono">session.ended</span><span class="stt"><span class="hd ok"></span>0</span><span class="n">1.0 s</span></div><div class="dv" ${cols}><span class="mono num">13:12</span><span class="mono">turn.completed</span><span class="stt"><span class="hd bad"></span>timeout</span><span class="n">10 s</span></div>`)}
      <div style="margin-top:var(--space-4)">${scriptNote()}</div>`;
    return `<h1>${t('Hooks', '钩子')}</h1><div class="hmd"><div>${left}</div><div>${right}</div></div>`;
  }
  const h = HK[0];
  const tabs = on => `<div class="mp-tabs" role="tablist"><span class="mp-tab" role="tab" aria-selected="${on === 'settings'}">${t('Settings', '设置')}</span><span class="mp-tab" role="tab" aria-selected="${on === 'deliveries'}">${t('Deliveries', '投递记录')}</span></div>`;
  const head = `<div class="hdt-h"><b>${h.label}</b><span class="sp"></span>${sw(h.on, h.label)}${btn(t('Send test event', '发送测试事件'), I.play())}${ib(I.more(), t('More', '更多'))}</div>`;
  if (st === 'b-deliveries') right = `${head}${tabs('deliveries')}${deliveries(DEL.slice(0, 8))}`;
  else if (st === 'b-add') right = `<div class="hdt-h"><b>${t('Add webhook', '添加 Webhook')}</b></div><div style="display:flex;flex-direction:column;gap:var(--space-4)">${editorFields(ADD, 'add')}</div><div class="mcard-f" style="margin-top:var(--space-4)">${btn(t('Cancel', '取消'), '', 'quiet')}${btn(t('Add hook', '添加钩子'), '', 'primary')}</div>`;
  else if (st === 'b-secret') right = `<div class="hdt-h"><b>${t('Hook added · deploy.example.org', '钩子已添加 · deploy.example.org')}</b></div><div style="display:flex;flex-direction:column;gap:var(--space-4)">${secretBody(false)}</div><div class="mcard-f" style="margin-top:var(--space-4)">${btn(t('Done', '完成'), '', 'primary')}</div>`;
  else right = `${head}${tabs('settings')}<div style="display:flex;flex-direction:column;gap:var(--space-4)">${editorFields(h, 'edit')}</div><div class="hacts" style="margin-top:var(--space-4)">${btn(t('Rotate secret', '轮换密钥'), I.retry())}${btn(t('Delete', '删除'), I.trash(), 'quiet del')}<span style="flex:1"></span>${btn(t('Save', '保存'), '', 'primary')}</div>`;
  return `<h1>${t('Hooks', '钩子')}</h1><div class="hmd"><div>${left}</div><div>${right}</div></div>`;
}

/* ---- direction C: tabs ---------------------------------------------------------------------------------------------- */
function cPage(st) {
  const on = st === 'c-scripts' ? 'scripts' : st === 'c-deliveries' ? 'deliveries' : 'webhooks';
  const tabs = `<div class="mp-tabs" role="tablist"><span class="mp-tab" role="tab" aria-selected="${on === 'webhooks'}">${t('Webhooks', 'Webhook')}<span class="meta">5</span></span><span class="mp-tab" role="tab" aria-selected="${on === 'scripts'}">${t('Scripts', '脚本')}<span class="meta">4</span></span><span class="mp-tab" role="tab" aria-selected="${on === 'deliveries'}">${t('Deliveries', '投递记录')}</span></div>`;
  const h1 = `<h1>${t('Hooks', '钩子')}</h1>${lead()}${tabs}`;
  if (st === 'c-empty') return `${h1}${list(emptyHooks())}`;
  if (on === 'scripts') return `${h1}${scriptNote()}${scriptGroups({ err: true })}`;
  if (on === 'deliveries') return `${h1}<div class="hfrow"><div class="sel" style="width:200px;flex:none"><span class="sl">${I.hook()}</span><span class="v">${t('All hooks', '所有钩子')}</span>${I.down()}</div><div class="sel" style="width:168px;flex:none"><span class="v">${t('Any state', '任意状态')}</span>${I.down()}</div><span class="sp"></span><span class="meta">${t('Webhook deliveries', 'Webhook 投递')}</span></div>${deliveries(DEL, { hookCol: true })}`;
  return `${h1}<div class="hfrow"><span class="sp"></span>${addHook()}</div>${list(HK.map(h => hookRow(h)).join(''))}`;
}
function cOverlay(st) {
  if (st === 'c-edit') return editorDialog(HK[1], 'edit', t('Edit CI trigger', '编辑 CI trigger'));
  if (st === 'c-secret') return secretDialog(t('Hook added · deploy.example.org', '钩子已添加 · deploy.example.org'), false);
  if (st === 'c-rotate') return secretDialog(t('New secret · Slack relay', '新密钥 · Slack relay'), true);
  return '';
}

/* ---- the states ------------------------------------------------------------------------------------------------ */
const STATES = [
  ['a-list', 'A · Webhooks and the machines’ scripts on one page'],
  ['a-deliveries', 'A · a hook opened in place with its deliveries'],
  ['a-needs-secret', 'A · a hook whose secret was lost'],
  ['a-add', 'A · adding a webhook'],
  ['a-edit', 'A · editing a webhook'],
  ['a-secret', 'A · the secret, shown once, after adding'],
  ['a-rotate-confirm', 'A · rotating a secret'],
  ['a-rotate-secret', 'A · the new secret after a rotation'],
  ['a-test', 'A · Send test event, delivered'],
  ['a-test-bad', 'A · Send test event, blocked'],
  ['a-script-run', 'A · a script hook that exited with an error'],
  ['a-empty', 'A · no hooks'],
  ['b-settings', 'B · a list with the hook beside it'],
  ['b-deliveries', 'B · the hook’s deliveries'],
  ['b-script', 'B · a script hook, read only'],
  ['b-add', 'B · adding a webhook'],
  ['b-secret', 'B · the secret, shown once'],
  ['b-empty', 'B · no hooks'],
  ['c-webhooks', 'C · a tab per kind: Webhooks'],
  ['c-edit', 'C · editing in a dialog'],
  ['c-secret', 'C · the secret, shown once, in a dialog'],
  ['c-rotate', 'C · the new secret after a rotation'],
  ['c-scripts', 'C · Scripts'],
  ['c-deliveries', 'C · Deliveries of every hook'],
  ['c-empty', 'C · no hooks'],
];
function frame(st, scheme) {
  let page; let wide = 'hwide'; let overlay = '';
  if (st.startsWith('a-')) {
    if (st === 'a-rotate-secret') { page = aPage('a-list'); overlay = secretDialog(t('New secret · Slack relay', '新密钥 · Slack relay'), true); }
    else { page = aPage(st); overlay = aOverlay(st); }
  } else if (st.startsWith('b-')) { page = bPage(st); wide = 'qwide3'; }
  else { page = cPage(st); overlay = cOverlay(st); }
  return `<div class="frame page ${scheme}" data-state="${st}"><main class="main">${settingsShell(page, wide)}</main>${overlay}</div>`;
}

const q = new URLSearchParams(location.search);
Z = q.get('lang') === 'zh-Hans';
document.documentElement.lang = Z ? 'zh-Hans' : 'en';
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  root.innerHTML = `<header class="intro"><h1>Hooks <span>Settings › Hooks</span></h1>
    <p>Lifecycle hooks (issue #97, ADR 0031) tell another program when a session starts, finishes a turn, asks for a permission, fails or is handed off. There are two kinds. A <b>webhook</b> is sent by the core: a URL, the events it wants, a scope, an opt-in summary, a signing secret that is shown once, and a history of the latest 100 deliveries. A <b>script hook</b> is declared in a machine’s agent configuration and run by that agent; the web UI only lists, switches and tests it, and never adds, edits or points one. Every mockup is in English and Simplified Chinese (<code>?lang=zh-Hans</code>), light and dark (<code>?state=&lt;id&gt;&amp;scheme=light|dark</code>). Secrets and hosts are invented.</p>
    <p><b>A</b> is one page: the webhooks as rows, a row opens in place to show its settings and deliveries, adding and editing happen in a card above the list, and the machines’ scripts are a read-only group below. <b>B</b> is a list with the selected hook beside it, on tabs for Settings and Deliveries; the scripts sit in the same list with a lock. <b>C</b> is a tab per kind (Webhooks, Scripts, Deliveries) with one delivery log for every hook, and editing in a dialog. They share one row, one editor form and one delivery table. No direction has been chosen.</p></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}

</script>
</body>
</html>
