<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* one type scale: meta 11/16 · UI 13/20 · prose 15/24 · title 15/20 600 · mono 12.5/20; weights 400/500/600 */
.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.with-insp{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.nosb,.frame.page{grid-template-columns:1fr}
.frame.nosb.with-insp{grid-template-columns:1fr var(--layout-inspector)}
.frame.with-insp.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}

/* icon buttons: the icon carries the intent, the title names it */
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib[disabled]{opacity:.4;cursor:default}
.ib.bd{color:var(--color-text-2);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .ib.bd{background:var(--color-raised)}
.side,.insp{min-height:0;overflow:hidden}
.side{background:var(--color-sidebar);display:flex;flex-direction:column;min-width:0;box-shadow:inset -1px 0 0 var(--color-line)}
.brand{position:relative;height:var(--layout-topbar);display:flex;align-items:center;gap:6px;padding:0 var(--space-2) 0 14px;flex:none}
.brand b{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.brand .sp{flex:1}
.brand .hb{display:flex;gap:0}
.mark{width:20px;height:20px;border-radius:6px;background:var(--color-accent);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.search{margin:0 var(--space-2);height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-surface);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);color:var(--color-text-3);flex:none;text-align:left;
  box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .search{background:var(--color-raised)}
.search .lbl{flex:1}
.kbd{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--color-line);font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.tree{flex:1;overflow:hidden;padding:0 var(--space-2)}
.devg{padding-top:var(--space-4)}
.dev{position:relative;height:var(--layout-row-device);display:flex;align-items:center;padding-right:var(--space-1);border-radius:var(--radius-sm);font-weight:var(--weight-semibold);color:var(--color-text);white-space:nowrap}
.dev .dt{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2)}
.dev .dt .dn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dev .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.dev .dchv{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.dev .dchv svg{transition:transform .12s}
.dev.open .dchv svg{transform:rotate(90deg)}
.dev .ib{width:24px;height:24px;display:none}
.dev.hov .ib,.dev.menu .ib{display:grid;color:var(--color-text-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-success);flex:none}
.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}
/* machine icon: the system's mark in the folder icon's column, the presence dot at its bottom-right, cut into the mark */
.mch{--md:7px;--mc:5.5px;--mo:-1.5px;position:relative;width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.mch svg{display:block;-webkit-mask-image:radial-gradient(circle at 14px 14px,transparent calc(var(--mc) - .5px),#000 var(--mc));mask-image:radial-gradient(circle at 14px 14px,transparent calc(var(--mc) - .5px),#000 var(--mc))}
.mch .mch-d{position:absolute;right:var(--mo);bottom:var(--mo);width:var(--md);height:var(--md);border-radius:50%;background:var(--color-success)}
.mch.off{color:var(--color-text-3)}
.mch.off .mch-d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}

/* machine resources (#88): a warning glyph on the row */
.rm{display:flex;align-items:center;flex:none;margin-right:var(--space-1);color:var(--color-attention-text)}
.rm svg{width:14px;height:14px;flex:none}
.dev.hov .rm,.dev.menu .rm{display:none}
.menu-item.dim{color:var(--color-text-2)}
.sdir,.sess{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap}
.sdir{color:var(--color-text-2);font-weight:var(--weight-medium)}
.sdir .fi{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sdir .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sdir .rt{display:flex;align-items:center;gap:var(--space-2);flex:none}
.sdir .cnt{font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-regular);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.sdir .ib{width:24px;height:24px;margin-right:-4px;display:none}
.sdir.hov{background:var(--color-hover)}
.sdir.hov .ib{display:grid;color:var(--color-text-2)}
.sdir.none{color:var(--color-text-3);font-weight:var(--weight-regular);padding-left:32px}
.sess{color:var(--color-text-2)}
.sess .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess .m{gap:var(--space-2);min-width:16px;display:flex;align-items:center;justify-content:flex-end;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;flex:none}
.sess.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.sess.dim{color:var(--color-text-3)}
.sess.dim.on{color:var(--color-text-2)}
.sess.two{height:calc(var(--leading-ui) + var(--leading-meta))}
.sess .t.tt{display:flex;flex-direction:column;overflow:visible}
.sess .t1,.sess .t2{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess .t2{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
/* a machine's view options: its name, then Organize and Sort as two radio groups under the row */
.pop{position:absolute;z-index:30;top:calc(100% - var(--space-1));left:var(--space-2);right:var(--space-2);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-title{padding:var(--space-2) var(--space-2) var(--space-1);font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-label{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.menu-check{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.menu-sep{height:1px;margin:var(--space-1) var(--space-2);background:var(--color-line)}
.pm{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sess.on .pm{color:var(--color-text-2)}
.gl{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.gl .spin{color:var(--color-accent)}
.need-dot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring)}
.bad-dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.ready-dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex:none}
.off-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.devg.off .dev,.devg.off .sdir,.devg.off .sess{color:var(--color-text-3)}
.devg.off .dev{font-weight:var(--weight-medium)}
.devg.off .sess.on{color:var(--color-text-2)}
.frozen-side .gl .spin{color:var(--color-text-3);animation:none}
.side-foot{height:var(--layout-foot);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4);box-shadow:inset 0 1px 0 var(--color-line);flex:none}
.conn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);white-space:nowrap}
.conn .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.conn.lost{color:var(--color-danger)}
.conn.lost .dot{background:var(--color-danger)}

/* modal chrome: command palette and New session */
.scrim{position:absolute;inset:0;z-index:19;background:var(--color-scrim)}
.modal{position:absolute;z-index:20;left:50%;top:var(--layout-modal-top);transform:translateX(-50%);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-float);overflow:hidden}
.hl{color:var(--color-accent-text);font-weight:var(--weight-semibold)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:4px;background:var(--color-hover);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;flex:none}
.pal{width:var(--layout-palette)}
.pal-in{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4) 0 18px;font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text)}
.pal-in .q{display:flex;align-items:center}
.pal-in svg{color:var(--color-text-3)}
.pal-in .cr2{width:1.5px;height:20px;background:var(--color-accent);margin-left:2px}
.pal-b{padding:0 var(--space-2) var(--space-2)}
.pal-sec{padding:var(--space-3) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.po{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.po .lead{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.po .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.po .t.ex{color:var(--color-text-2)}
.po .m{display:flex;align-items:baseline;min-width:0;max-width:52%;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.po .m .ms{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.po .m .ln{flex:none;white-space:pre}
.po.on{background:var(--color-selected);box-shadow:inset 0 1px 0 var(--color-highlight)}
.po.on .lead{color:var(--color-text-2)}
.po.on .kc{background:var(--color-raised);color:var(--color-text-2);box-shadow:0 0 0 1px var(--color-line)}
.dark .po.on .kc{background:var(--color-hover)}
.po.scan{color:var(--color-text-3)}
.pal-f{height:36px;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-4);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);box-shadow:inset 0 1px 0 var(--color-line)}
.pal-f span{display:flex;align-items:center;gap:var(--space-1)}
/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3) 0 var(--space-5);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.nosb .top{padding-left:var(--space-3)}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.top .sp{flex:1}

/* conversation */
.conv{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:0 0 148px}
.conv::-webkit-scrollbar{display:none}
.col{width:min(var(--layout-column),calc(100% - 104px));margin:0 auto;padding-top:var(--space-2)}
.wide .col{width:calc(100% - 48px)}

.badge{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-variant-numeric:tabular-nums}
/* text buttons: decisions only */
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}

const pageC = st => {
  switch (st) {
    case 'c-open': return screen(pal(`${input('')}<div class="pal2"><div class="pal-b" role="listbox">${sec(t('Recent', '最近'))}${[3, 4, 2, 1, 7].map((id, i) => sOpt(byId(id), '', i + 1, i === 0)).join('')}${A_GEN('')}</div>${pvSession(byId(3))}</div>${foot2(`<span>${kc('⇥')}${t('to the preview', '进入预览')}</span>`)}`, 'wide'));
    case 'c-fuzzy': return screen(pal(`${input('st')}<div class="pal2">${cList('st', 'm')}${pvMachine('studio')}</div>${foot2(`<span>${kc('⇥')}${t('to the preview', '进入预览')}</span>`)}`, 'wide'));
    case 'c-confirm': return screen(pal(`${input('st')}<div class="pal2">${cList('st', 'stop')}${pvStop()}</div><div class="pal-f"><span>${kc('↩')}${t('to stop', '停止')}</span><span>${kc('esc')}${t('to go back', '返回')}</span></div>`, 'wide'));
    case 'c-help': return screen(sheet());
    case 'c-none': return screen(pal(`${input('deploy staging')}<div class="pal2">${A_NONE('deploy staging')}<div class="pv"><div class="ph4">${I.search()}${t('Search lines', '搜索内容')}</div><div class="last">${t('Enter searches every session’s lines for “deploy staging”, a page at a time, newest first.', '回车会按页、从新到旧，在所有会话的内容中搜索“deploy staging”。')}</div></div></div>${foot2()}`, 'wide'));
  }
};

const STATES = [
  ['a-open', 'A · ⌘K with no query: Recent sessions, This session, General; shortcuts on the right'],
  ['a-fuzzy', 'A · “st” matches sessions, a machine, a project and commands; matched letters in accent'],
  ['a-confirm', 'A · Enter on Stop: the row opens into a confirmation that names the child session'],
  ['a-help', 'A · ⌘/ (or the palette entry) opens Keyboard shortcuts; new and browser-taken chords marked'],
  ['a-none', 'A · nothing matches: search the lines, or start a session with the text'],
  ['a-open-zh', 'A in Simplified Chinese'],
  ['a-confirm-zh', 'A confirmation in Simplified Chinese'],
  ['a-help-zh', 'A shortcut list in Simplified Chinese'],
  ['b-open', 'B · no query: Recent and the four prefixes'],
  ['b-actions', 'B · “>” narrows to Commands, a chip shows the mode, Backspace leaves it'],
  ['b-machines', 'B · “@” lists machines; → opens a machine’s projects'],
  ['b-confirm', 'B · Stop becomes a step: Commands › Stop, Enter confirms, Backspace goes back'],
  ['b-help', 'B · “?” lists the shortcuts inside the palette'],
  ['b-none', 'B · no command matches; Backspace widens to everything'],
  ['b-actions-zh', 'B in Simplified Chinese'],
  ['c-open', 'C · two panes: the list and a preview of the chosen session with its actions'],
  ['c-fuzzy', 'C · “st” with a machine chosen: the preview shows it and its sessions'],
  ['c-confirm', 'C · Stop confirms in the preview pane'],
  ['c-help', 'C · a full cheat sheet over the app'],
  ['c-none', 'C · nothing matches'],
  ['c-open-zh', 'C in Simplified Chinese'],
];

const LANG = new URLSearchParams(location.search).get('lang') === 'zh-Hans';
function frame(st, scheme) {
  Z = LANG || st.endsWith('-zh');
  const base = st.replace(/-zh$/, '');
  const body = base.startsWith('a-') ? pageA(base) : base.startsWith('b-') ? pageB(base) : pageC(base);
  return `<div class="frame ${scheme}" data-state="${st}">${body}</div>`;
}

const q = new URLSearchParams(location.search);
Z = LANG;
document.documentElement.lang = Z ? 'zh-Hans' : 'en';
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  root.innerHTML = `<header class="intro"><h1>Command palette <span>⌘K · ⌘/: one place to reach everything by keyboard (issue #92); the maintainer chose A</span></h1>
    <p>#92 asks for one place to reach everything by keyboard: sessions, machines, projects and the commands that act on the open session, with fuzzy matching, a confirmation before anything that stops work, and a list of the shortcuts. Nothing here needs the server: machines and projects come from the session list the page already has, commands are the page’s own.</p>
    <p><b>A</b> (chosen) grows today’s grouped list: Recent, This session and General with no query; a query matches every kind at once, letters in order (“st” finds <i>S</i>ession <i>t</i>ags and <i>st</i>udio); Stop opens a confirmation in place; ⌘/ opens a Keyboard shortcuts dialog. <b>B</b> keeps one kind at a time: <code>&gt;</code> commands, <code>@</code> machines, <code>#</code> projects, <code>?</code> shortcuts, shown as a chip that Backspace removes; a confirmation is a step of its own. <b>C</b> splits the palette in two panes and previews the chosen row with its actions; the confirmation sits in the preview, and the shortcuts are a full cheat sheet.</p>
    <p>Shortcuts marked <span class="newb" style="margin:0">new</span> come with #92 (⌘/, ⌥⌘↑/↓; ⌥⌘T comes with #91); <code>*</code> marks a chord a browser may take first. Child sessions in the confirmation come from #81. New icon: <code>keyboard</code>. Add <code>?state=&lt;id&gt;&amp;scheme=light|dark</code> for one frame at full size, <code>?lang=zh-Hans</code> for Simplified Chinese.</p></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}
</script>
</body>
</html>
