<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* one type scale: meta 11/16 · UI 13/20 · prose 15/24 · title 15/20 600 · mono 12.5/20; weights 400/500/600 */
.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.with-insp{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.nosb,.frame.page{grid-template-columns:1fr}
.frame.nosb.with-insp{grid-template-columns:1fr var(--layout-inspector)}
.frame.with-insp.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}

/* icon buttons: the icon carries the intent, the title names it */
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib[disabled]{opacity:.4;cursor:default}
.ib.bd{color:var(--color-text-2);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .ib.bd{background:var(--color-raised)}
.ib .cdg{position:absolute;top:4px;right:4px;width:6px;height:6px;border-radius:50%;background:var(--color-git-modified);box-shadow:0 0 0 2px var(--color-bg)}

/* a machine's view options: its name, then Organize and Sort as two radio groups under the row */
.pop{position:absolute;z-index:30;top:calc(100% - var(--space-1));left:var(--space-2);right:var(--space-2);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-title{padding:var(--space-2) var(--space-2) var(--space-1);font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-label{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.menu-check{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.menu-sep{height:1px;margin:var(--space-1) var(--space-2);background:var(--color-line)}
.pm{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sess.on .pm{color:var(--color-text-2)}
.gl{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.gl .spin{color:var(--color-accent)}
.need-dot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring)}
.bad-dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.ready-dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex:none}
.off-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.devg.off .dev,.devg.off .sdir,.devg.off .sess{color:var(--color-text-3)}
.devg.off .dev{font-weight:var(--weight-medium)}
.devg.off .sess.on{color:var(--color-text-2)}
.frozen-side .gl .spin{color:var(--color-text-3);animation:none}
.side-foot{height:var(--layout-foot);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4);box-shadow:inset 0 1px 0 var(--color-line);flex:none}
.conn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);white-space:nowrap}
.conn .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.conn.lost{color:var(--color-danger)}
.conn.lost .dot{background:var(--color-danger)}

/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3) 0 var(--space-5);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.nosb .top{padding-left:var(--space-3)}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.top .sp{flex:1}

/* conversation */
.conv{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:0 0 148px}
.conv::-webkit-scrollbar{display:none}
.col{width:min(var(--layout-column),calc(100% - 104px));margin:0 auto;padding-top:var(--space-2)}
.wide .col{width:calc(100% - 48px)}

.badge{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-variant-numeric:tabular-nums}
/* text buttons: decisions only */
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}
.light .btn{background:var(--color-raised)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);font-weight:var(--weight-semibold);padding:0 var(--space-4)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--color-text-2);padding:0 var(--space-2)}
.btn svg{color:currentColor}
.btn[disabled]{opacity:.5;cursor:default}

/* composer */
.dock{position:absolute;z-index:5;left:0;right:0;bottom:0;padding:var(--space-7) 0 var(--space-4);background:linear-gradient(var(--fade-bg),var(--color-bg) 42%);pointer-events:none}
.composer{pointer-events:auto;border-radius:var(--radius-xl);background:var(--color-raised);box-shadow:var(--shadow-float);padding:var(--space-3) var(--space-2) var(--space-2) var(--space-4);display:flex;flex-direction:column;gap:var(--space-2)}
.ph{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text-3)}
.cf{display:flex;align-items:center;gap:var(--space-1);min-height:var(--control-field);margin-left:calc(-1 * var(--space-2))}
.cf .cst{display:flex;align-items:center;gap:var(--space-2);height:20px;color:var(--color-text-2);margin:0 0 0 var(--space-1);padding-left:var(--space-3);box-shadow:inset 1px 0 0 var(--color-line)}
.cf .cst.bad{color:var(--color-danger)}
.cf .r{margin-left:auto;display:flex;align-items:center;gap:var(--space-1)}
.send{width:var(--control-field);height:var(--control-field);border-radius:50%;display:grid;place-items:center;background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);flex:none}
.send[disabled]{background:var(--color-hover);color:var(--color-text-3);box-shadow:none;cursor:default}
.composer.cbar{flex-direction:row;align-items:center;gap:var(--space-3);padding:var(--space-3) var(--space-3) var(--space-3) var(--space-5);min-height:56px}
.composer.cbar .cst{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2);flex:1}
.composer.cbar .cst svg{color:var(--color-text-3)}
.composer.ro{background:var(--color-surface);box-shadow:inset 0 0 0 1px var(--color-line)}
.recrow{display:flex;align-items:center;gap:var(--space-3);height:24px;padding-right:var(--space-2)}
.recrow .rdot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);box-shadow:0 0 0 4px var(--color-accent-soft);animation:pulse var(--motion-pulse) ease-in-out infinite;flex:none}
.recrow .el{font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);font-variant-numeric:tabular-nums;width:36px;flex:none}
.wave{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:2px;height:24px;overflow:hidden;-webkit-mask-image:linear-gradient(to right,transparent,#000 18%);mask-image:linear-gradient(to right,transparent,#000 18%)}
.wave i{flex:none;width:3px;border-radius:2px;background:var(--color-accent-text)}
.cf .note{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);margin-left:var(--space-3)}

.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);position:relative}
.light .seg{background:var(--color-hover)}
.seg button{height:24px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:6px;font-weight:var(--weight-medium);color:var(--color-text-2);white-space:nowrap}
.seg button .c{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;font-weight:var(--weight-regular)}
.seg button.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .seg button.on{background:var(--color-raised)}
.seg button.on .c{color:var(--color-text-2)}
.seg button[disabled]{color:var(--color-text-3);opacity:.6;cursor:default}
.fld{display:flex;flex-direction:column;gap:var(--space-1)}
.fld .l{color:var(--color-text-2)}
.input{height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);display:flex;align-items:center;padding:0 var(--space-3);font-family:var(--font-mono);font-size:var(--text-code);color:var(--color-text);white-space:nowrap;overflow:hidden}
.input.on{box-shadow:inset 0 0 0 1.5px var(--color-accent)}
.input.ui{font-family:var(--font-ui);font-size:var(--text-ui)}
.nt{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);display:flex;gap:var(--space-2);color:var(--color-text)}
.nt svg{margin-top:2px}
.nt.bad{background:var(--color-del-bg)}
.nt.bad svg{color:var(--color-danger)}
.nt.ok{background:var(--color-add-bg)}
.nt.ok svg{color:var(--color-success)}
.nt.snap{background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2)}
.nt.snap svg{color:var(--color-text-3)}
.sel{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);white-space:nowrap}
.sel .v{flex:1;overflow:hidden;text-overflow:ellipsis}
.sel > svg{color:var(--color-text-3)}
.sel .pm{color:var(--color-text-2)}
.sel .sl{width:16px;height:16px;display:grid;place-items:center;flex:none}
.tgls{display:flex;gap:var(--space-4);align-items:center;height:var(--control-field)}
.tgl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-2)}
.switch{width:28px;height:16px;border-radius:8px;background:var(--color-hover);box-shadow:inset 0 0 0 1px var(--color-line);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--color-text-3)}
.switch.on{background:var(--color-accent);box-shadow:none}
.switch.on::after{left:14px;background:var(--color-on-accent)}
/* settings */
.set{flex:1;min-height:0;display:grid;grid-template-columns:var(--layout-settings-nav) minmax(0,1fr)}
.snav{padding:var(--space-3) var(--space-2);box-shadow:inset -1px 0 0 var(--color-line);display:flex;flex-direction:column;gap:2px}
.ni{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2)}
.ni svg{color:var(--color-text-3)}
.ni.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ni.on svg{color:var(--color-text-2)}
.spage{overflow:auto;padding:var(--space-4) var(--space-7) var(--space-5)}
.spage .in{max-width:620px;margin:0 auto}
.spage h1{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;margin-bottom:var(--space-5)}
.sgrp + .sgrp{margin-top:var(--space-5)}
.sgrp .lb{font-weight:var(--weight-semibold);color:var(--color-text);margin-bottom:var(--space-2)}
.themes{display:flex;gap:var(--space-4)}
.thc{display:flex;flex-direction:column;gap:var(--space-2)}
.thp{width:164px;height:88px;border-radius:var(--radius-md);overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--color-line)}
.thc.on .thp{box-shadow:0 0 0 2px var(--color-accent)}
.thp .mini{position:absolute;inset:0;display:grid;grid-template-columns:40px 1fr}
.thp .mini.half{clip-path:polygon(100% 0,100% 100%,0 100%)}
.thp .ms{display:flex;flex-direction:column;gap:4px;padding:12px 8px}
.thp .ms i,.thp .mc i{display:block;height:4px;border-radius:2px}
.thp .mc{display:flex;flex-direction:column;gap:8px;padding:12px}
.thp .mc .cb{margin-top:auto;height:16px;border-radius:6px}
.rl{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text)}

/* stacked view */

/* prose */
.text{font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text);margin:var(--space-1) 0 var(--space-3);max-width:var(--measure-prose)}

const hdr = () => `<div class="ask-h">${I.cfg()}<span class="q">${reqTitle()}</span></div>`;

/* A: the diffs open in the card */
const cardA = open => `<div class="ask">${hdr()}${reqTags()}${objs().map(o => ocRow(o, open.includes(o.k))).join('')}<div class="ask-f">${approve()}${decline()}${takes()}</div>${reqNote()}</div>`;
/* B: a compact card; the review is in the wide inspector */
const cardB = () => `<div class="ask">${hdr()}${reqTags()}${objs().map(o => ocRow(o, false, false)).join('')}<div class="ask-f">${btn(t('Review changes', '查看更改'), I.panel(), 'primary')}${decline()}${takes()}</div>${reqNote()}</div>`;
/* C: one summary line and a dialog that walks through the objects */
const cardC = () => `<div class="ask">${hdr()}${reqTags()}<div class="sumrow">${I.file()}<span class="grow">${t('CLAUDE.md, 1 skill, 1 command and the effort setting', 'CLAUDE.md、1 个技能、1 个命令和推理强度设置')}</span><span class="cnt"><span class="a">+10</span><span class="d">−2</span></span></div>
  <div class="ask-f">${btn(t('Review and decide', '查看并决定'), '', 'primary')}${btn(t('Decline', '拒绝'), '', 'quiet')}${takes()}</div>${reqNote()}</div>`;

/* ---- outcomes, left in the turn ---------------------------------------------------------------------------------- */
const rowEnd = o => (o.k === 'eff' ? `<span class="cnt">${t('Medium → High', '中 → 高')}</span>` : cnt(o));
const resRows = (struck, chev) => objs().map(o => `<div class="cres-r${struck ? ' struck' : ''}">${o.ic}<span>${o.nm}</span><span class="mono">${o.path}</span>${rowEnd(o)}${chev ? I.chev() : ''}</div>`).join('');
function resApplied(d) {
  const extra = d === 'b' ? btn(t('Open review', '打开审阅'), '', 'quiet') : d === 'c' ? btn(t('Review again', '重新查看'), '', 'quiet') : '';
  return `<div class="cres ok"><div class="cres-h">${I.check()}<b>${t('Changes applied', '更改已应用')}</b>${mt(t('You approved · 14:09', '你已批准 · 14:09'))}</div>${resRows(false, d === 'a')}
    <div class="cres-f">${btn(t('Undo', '撤销'), I.undo())}${btn(t('Restart to apply', '重启以应用'), I.retry(), '', '', true)}${extra}${mt(t('Restart is offered when the session is idle. Effort already applies.', '会话空闲时才可重启。推理强度已生效。'))}</div></div>`;
}
const resUndone = () => `<div class="cres"><div class="cres-h">${I.undo()}<b>${t('Changes undone', '更改已撤销')}</b>${mt(t('You · 14:21', '你 · 14:21'))}</div>${resRows(true, false)}
  <p>${t('The earlier versions are back and effort is Medium again. The session was not interrupted. Hoplet keeps the undone versions for 30 days.', '旧版本已恢复，推理强度重新为“中”。会话没有被打断。Hoplet 会将撤销前的版本保留 30 天。')}</p></div>`;
const resExpired = () => `<div class="cres"><div class="cres-h">${I.clock()}<b>${t('Change request expired', '更改请求已过期')}</b>${mt('14:12')}</div>${resRows(false, false)}
  <p>${t(`The session was <b>handed off to ${STU}</b> before you decided. Nothing was written. The session on ${STU} can propose the changes again.`, `会话在你决定前已<b>交接到 ${STU}</b>。没有写入任何内容。${STU} 上的会话可以重新提议这些更改。`)}</p></div>`;
const resStale = () => `<div class="cres bad"><div class="cres-h">${I.alert()}<b>${t('Undo did not run', '撤销未执行')}</b>${mt('stale')}</div>
  <div class="cres-r">${I.file()}<span>CLAUDE.md</span><span class="mono">CLAUDE.md</span><span class="tag att">${t('Changed since', '此后被改动')}</span></div>
  <div class="cres-r">${I.skill()}<span>ingest-fixtures</span><span class="mono">.claude/skills/ingest-fixtures/SKILL.md</span><span class="tag line">${t('Unchanged', '未改动')}</span></div>
  <div class="cres-r">${I.term()}<span>/triage</span><span class="mono">.claude/commands/triage.md</span><span class="tag line">${t('Unchanged', '未改动')}</span></div>
  <p>${t('<b>CLAUDE.md changed after the change was applied</b>, so Hoplet restored nothing: an undo is all or none. All four stay as they are.', '<b>CLAUDE.md 在更改应用后又被改动</b>，因此 Hoplet 没有恢复任何内容：撤销要么全部执行，要么都不执行。四项都保持原样。')}</p>
  <div class="cres-f">${btn(t('Show differences', '查看差异'))}${btn(t('Dismiss', '关闭'), '', 'quiet')}</div></div>`;

/* ---- the conversation around it ------------------------------------------------------------------------------------ */
const PROMPT = () => t('Remember to run the checks, and make the fixture steps a skill.', '记得运行检查，并把生成测试数据的步骤做成技能。');
const leadActs = () => act(I.book(), t('Read', '读取'), code('get_config'), '<span>1.8 KiB</span>') + act(I.file(), t('Read', '读取'), code('read_memory') + ' CLAUDE.md', '<span>L1–40</span><i>·</i><span>1.2 KiB</span>');
const proposed = s => act(I.cfg(), t('Proposed', '已提议'), code('propose_config_change') + ' ' + t('4 objects', '4 个对象'), `<span>${s}</span>`);
const conv = (state, inside, outside = '', need = false, text = '') => live(`${turnHead(PROMPT())}<div class="tb"><div class="acts">${leadActs()}${proposed(state)}${inside}</div>${outside}${text ? `<p class="text">${text}</p>` : ''}</div>`, need);
const TXT_PEND = () => t('The changes are with you. I will carry on with the checks meanwhile.', '更改等你确认。我先继续运行检查。');
const TXT_OK = () => t('Done. The memory, the skill and the command are in place from the next start; effort is High now.', '完成。记忆、技能和命令会从下次启动起生效；推理强度现在已是“高”。');
const TXT_NO = () => t('Understood, nothing was changed. I will keep to the old instructions for now.', '明白，没有做任何更改。我暂时沿用旧的指示。');
const pendState = () => t('pending', '待确认');
const convCard = card => live(`${turnHead(PROMPT())}<div class="tb"><div class="acts">${proposed(pendState())}</div>${card}</div>`, true);
const convRes = (res, state, txt) => conv(state, res, '', false, txt);

const convRefused = () => live(`${turnHead(t('Tighten the notes and add a fixtures skill.', '整理笔记，并添加一个测试数据技能。'))}<div class="tb"><div class="acts">
  ${act(I.pen(), t('Refused', '已拒绝'), code('propose_memory_change') + ' CLAUDE.md', 'stale', 'bad')}
  <div class="hres err">${I.alert()}<span><b>stale</b> · ${t('CLAUDE.md changed after you read it. Read it again and propose again.', 'CLAUDE.md 在你读取后又被改动。请重新读取后再提议。')}</span></div>
  ${act(I.pen(), t('Refused', '已拒绝'), code('propose_skill_change') + ' ingest-fixtures', 'unsafe-content', 'bad')}
  <div class="hres err">${I.alert()}<span><b>unsafe-content</b> · ${t('The front matter has allowed-tools. A skill cannot grant itself tools; remove the key.', 'front matter 中有 allowed-tools。技能无法授予自己工具；请删除该键。')}</span></div>
  ${act(I.pen(), t('Refused', '已拒绝'), code('propose_config_change') + ' .claude/commands/triage.md', 'unsafe-content', 'bad')}
  <div class="hres err">${I.alert()}<span><b>unsafe-content</b> · ${t('Line 4 looks like an API key. A secret is never written to a file.', '第 4 行看起来像 API 密钥。密钥绝不会写入文件。')}</span></div>
  ${act(I.pen(), t('Refused', '已拒绝'), code('propose_config_change') + ' ' + t('~/.claude/CLAUDE.md', '~/.claude/CLAUDE.md'), 'unsupported', 'bad')}
  <div class="hres err">${I.alert()}<span><b>unsupported</b> · ${t('Files in your home directory are read only. Only this project’s files can change.', '主目录中的文件是只读的。只有此项目的文件可以更改。')}</span></div>
  </div></div>`);

/* ---- where the user turns it on ----------------------------------------------------------------------------------- */
const C0 = { read: true, write: false };
const C1 = { read: true, write: true };
function cfgRows(c, o = {}) {
  const cp = !!o.compact;
  const nR = t('Read configuration', '读取配置');
  const nW = t('Propose configuration changes', '提议配置更改');
  return [
    cr(I.book(), nR, (cp ? '' : tl('get_config · list_skills · read_skill · read_memory')) + (c.write ? mt(t('Included with proposing changes.', '随“提议配置更改”一并开启。')) : ''), sw(c.read || c.write, nR, c.write)),
    cr(I.pen(), nW, (cp ? '' : tl('propose_config_change · propose_memory_change · propose_skill_change') + mt(t('You confirm every change request, in every permission mode. Nothing is written first.', '每个更改请求都由你确认，不论哪种权限模式。写入前不会改动任何文件。'))), sw(c.write, nW)),
    cr(I.ban(), t('Change rules, hooks, providers or its own access', '更改规则、钩子、提供方或自身权限'), cp ? '' : mt(t('Only you can. A session cannot be given this.', '只有你可以，无法授予会话。')), lockTag(t('Never', '永不'))),
  ].join('');
}
const cfgNote = c => `<div class="nt snap" role="note">${c.write ? I.shield() : I.info()}<span>${c.write
  ? t('It can propose changes to this project’s CLAUDE.md or AGENTS.md, skills and commands, and to model and effort. Files in your home directory stay read only.', '它可以提议更改此项目的 CLAUDE.md 或 AGENTS.md、技能和命令，以及模型和推理强度。主目录中的文件仍为只读。')
  : t('Off. The session can read the configuration but cannot propose changes.', '已关闭。会话可以读取配置，但不能提议更改。')}</span></div>`;
const NOTHING = () => mt(t('This session only. A request waits 24 hours for your decision.', '仅此会话。请求会等待你 24 小时。'));

/* A: the inspector tab, retitled Hoplet tools, with a Configuration group under the other-sessions summary */
const inspA = c => `<aside class="insp"><div class="insp-h"><div class="seg" role="tablist" aria-label="${t('Inspector', '检查器')}"><button${tip(t('Changes', '变更'))}>${I.file()}</button><button${tip(t('Terminal', '终端'))}>${I.term()}</button><button class="on"${tip(t('Hoplet tools', 'Hoplet 工具'))}>${I.link()}</button></div><span class="ttl">${t('Hoplet tools', 'Hoplet 工具')}</span></div>
  <div class="insp-b"><div class="sumrow">${I.link()}<span class="grow">${t('Other sessions', '其他会话')}</span>${mt(t('Read only', '只读'))}${I.chev()}</div>
  <div class="glab">${t('Configuration', '配置')}</div><div class="plist">${cfgRows(c, { compact: true })}</div>${cfgNote(c)}${NOTHING()}</div></aside>`;

/* B: a chip and a popover, beside the other-sessions chip's place in the top bar */
const chipCfg = (c, open) => `<button class="mchip ${c.read || c.write ? 'on' : 'off'}${open ? ' open' : ''}" aria-haspopup="dialog" aria-expanded="${!!open}"${tip(t('Configuration', '配置'))}>${I.cfg()}<span>${c.write ? t('Can propose changes', '可提议更改') : t('Reads configuration', '读取配置')}</span>${I.down()}</button>`;
const popCfg = c => `<div class="cpop" role="dialog" aria-label="${t('Configuration', '配置')}"><div class="cph">${t('Configuration', '配置')}${mt(t('This session', '此会话'))}</div>
  <div class="plist tight">${cfgRows(c, { compact: true })}</div>${cfgNote(c)}<div class="cpf"><span class="grow"></span>${mt(t('Saved as you change it', '更改即保存'))}</div></div>`;

/* C: presets in a dialog */
const CPRE = [
  ['off', 'Off', '关闭', 'The session cannot see the configuration and proposes nothing.', '会话看不到配置，也不提议更改。'],
  ['ro', 'Read only', '只读', 'Reads CLAUDE.md, skills, commands and settings. Changes nothing.', '读取 CLAUDE.md、技能、命令和设置，不做任何更改。'],
  ['rw', 'Read and propose changes', '读取并提议更改', 'Also proposes changes. You approve each request before anything is written.', '还可提议更改。写入前，每个请求都需要你批准。'],
];
function dlgCfg(on) {
  const body = `<p class="dlg-p">${t('What this session may do with the configuration of this project. It can never change its own access, rules, hooks or providers.', '此会话可以对此项目的配置做什么。它永远无法更改自身权限、规则、钩子或提供方。')}</p>
    <div class="blk">${CPRE.map(([k, en, zh, de, dz]) => `<div class="pre${k === on ? ' on' : ''}"><span class="radio${k === on ? ' on' : ''}"></span><div class="tx"><b>${t(en, zh)}</b><span>${t(de, dz)}</span></div></div>`).join('')}</div>
    ${on === 'rw' ? cfgNote(C1) : ''}`;
  return `<div class="scrim"></div><div class="modal dlg mc" role="dialog" aria-modal="true" aria-label="${t('Configuration', '配置')}"><div class="dlg-h">${t('Configuration', '配置')}</div>
    <div class="dlg-b">${body}</div>
    <div class="dlg-f"><span class="l">${I.info()}${t('Applies to this session now.', '立即应用于此会话。')}</span>${btn(t('Close', '关闭'), '', 'quiet')}${btn(t('Save', '保存'), '', 'primary')}</div></div>`;
}

/* ---- B: the review as a wide inspector ----------------------------------------------------------------------------- */
function reviewB(key) {
  const os = objs();
  const cur = os.find(o => o.k === key);
  return `<aside class="insp"><div class="insp-h"><div class="seg" role="tablist" aria-label="${t('Inspector', '检查器')}"><button${tip(t('Changes', '变更'))}>${I.file()}</button><button${tip(t('Terminal', '终端'))}>${I.term()}</button><button class="on"${tip(t('Change request', '更改请求'))}>${I.cfg()}</button></div><span class="ttl">${t('Change request', '更改请求')}</span><span style="flex:1"></span>${ib(I.x(), t('Close · Esc', '关闭 · Esc'))}</div>
  <div class="rw"><div class="rw-l"><div class="rw-lh">${t('4 objects', '4 个对象')}</div>${os.map(o => `<div class="rw-i${o.k === key ? ' on' : ''}">${o.ic}<span class="nm"><b>${o.nm}</b>${o.k === 'eff' ? `<span class="cnt">${t('Medium → High', '中 → 高')}</span>` : cnt(o)}</span></div>`).join('')}</div>
  <div class="rw-v"><div class="rw-vh"><b>${cur.nm}</b><span class="tag line">${cur.kind}</span>${cur.flag ? `<span class="tag att">${I.warn()}${t('Read first', '先读一遍')}</span>` : ''}<span class="sp"></span>${tmTag(cur)}</div><span class="meta mono">${cur.path}</span>${objBody(cur)}</div></div>
  <div class="rw-f">${approve()}${decline()}<span class="meta">${I.clock()}<span>${t('Takes effect when the session next starts', '会话下次启动时生效')}</span></span></div></aside>`;
}

/* ---- C: the review as a dialog with steps -------------------------------------------------------------------------- */
function reviewC(step) {
  const os = objs();
  const cur = os[step];
  const last = step === os.length - 1;
  const stepper = `<div class="stp" role="list">${os.map((o, i) => `<div class="stp-i${i < step ? ' done' : i === step ? ' on' : ''}" role="listitem"><span class="n">${i < step ? I.check() : i + 1}</span><span class="tx">${o.nm}</span></div>`).join('')}</div>`;
  const stepBody = `<div class="rw-vh"><b>${cur.nm}</b><span class="tag line">${cur.kind}</span>${cur.flag ? `<span class="tag att">${I.warn()}${t('Read first', '先读一遍')}</span>` : ''}<span class="sp"></span>${cnt(cur) === '<span></span>' ? '' : cnt(cur)}${tmTag(cur)}</div><span class="meta mono">${cur.path}</span>${objBody(cur)}`;
  return `<div class="scrim"></div><div class="modal rvm" role="dialog" aria-modal="true" aria-label="${t('Review 4 changes', '查看 4 项更改')}">
    <div class="rvm-h">${t('Review 4 changes', '查看 4 项更改')}${mt(t(`Step ${step + 1} of 4`, `第 ${step + 1} 步，共 4 步`))}</div>
    <div class="rvm-s">${t(`Claude Code proposes these for hoplet on ${MAC}. You decide on all of them at once.`, `Claude Code 为 ${MAC} 上的 hoplet 提议了这些更改。你一次决定全部。`)}</div>
    ${stepper}<div class="rvm-b">${stepBody}</div>
    <div class="rvm-f"><span class="l">${I.info()}${last ? t('Approve is available on the last step.', '最后一步才能批准。') : t('Nothing is written until you approve.', '批准前不会写入任何内容。')}</span>${decline()}${btn(t('Back', '上一步'), '', '', '', step === 0)}${last ? approve() : btn(t('Next', '下一步'), I.chev(), 'primary')}</div></div>`;
}

/* ---- the notification ---------------------------------------------------------------------------------------------- */
const ntf = () => `<div class="ntf" role="alert"><span class="app"><b>H</b></span><div class="tx"><div class="row"><b>Hoplet</b><span class="meta">${t('now', '现在')}</span></div>
  <span>${t('Claude Code proposes 4 changes to hoplet', 'Claude Code 提议对 hoplet 做 4 项更改')}</span>
  <p>${t('CLAUDE.md, a skill, a command and the effort setting wait for your decision.', 'CLAUDE.md、一个技能、一个命令和推理强度设置等待你的决定。')}</p>
  <span class="meta fine">${I.lock()}<span>${t('Open Hoplet to approve or decline. A notification cannot decide for you.', '请打开 Hoplet 批准或拒绝。通知无法代你决定。')}</span></span></div></div>`;

/* ---- the frames ---------------------------------------------------------------------------------------------------- */
const TITLE = () => t('Check the chunk store', '检查分块存储');
const dock = (above = '') => `<div class="dock"><div class="col">${above}<div class="composer"><div class="ph">${t('Ask Claude Code…', '向 Claude Code 提问…')}</div><div class="cf">${ib(I.clip(), t('Attach', '附件'))}<span class="r">${ib(I.mic(), t('Dictate · transcribed on your machines', '听写 · 在你的机器上转写'))}<button class="send" disabled${tip(t('Send · ↩', '发送 · ↩'))}>${I.up()}</button></span></div></div></div></div>`;
const topbar = o => `<header class="top">${ib(I.sidebar(), t('Show sidebar · ⌘\\', '显示侧边栏 · ⌘\\'))}<span class="title">${TITLE()}</span><span class="ctx meta">hoplet · ${MAC}</span><span class="sp"></span>${o.topx || ''}${ib(I.panel(), t('Show inspector', '显示检查器'), (o.insp ? 'on ' : '') + (o.dot ? 'hasdot' : ''))}</header>`;
const badge = tm => `<span class="badge" role="img"${tip(t('Running', '运行中'))}><span class="sdot"></span><span>${tm}</span></span>`;
const turnHead = (prompt, tm = '', pTop = '') => `<header class="th"><div class="p">${pTop}${prompt}</div><div class="rt">${badge('00:31')}${ib(I.stop(), t('Interrupt · Esc', '中断 · Esc'), 'bd')}</div><div class="tm"><span class="meta">14:06</span>${tm}</div></header><div class="tsep"></div>`;
const live = (inner, need = false) => `<section class="turn live${need ? ' need' : ''}">${inner}</section>`;
const plain = () => conv(t('approved', '已批准'), '', '', false, '').replace(/<div class="acts">[\s\S]*<\/div><\/div><\/section>$/, '</div></div></section>');

function sessionState(base) {
  const d = base.slice(0, 1);
  const k = base.slice(2);
  if (base === 'conv-refused') return { body: convRefused() };
  if (base === 'conv-undo-stale') return { body: convRes(resStale(), t('approved', '已批准'), '') };
  const card = d === 'a' ? cardA(k === 'card-warn' ? ['skill'] : k === 'card-open' ? ['mem'] : []) : d === 'b' ? cardB() : cardC();
  const cardBody = convCard(card);
  if (k === 'card' || k === 'card-warn' || k === 'card-open') return { body: cardBody, dot: d === 'b', topx: d === 'c' ? `<span class="tag att">${I.bell()}${t('1 change request', '1 个更改请求')}</span>` : '' };
  if (k === 'notify') return { body: cardBody, over: ntf(), dot: d === 'b', topx: d === 'c' ? `<span class="tag att">${I.bell()}${t('1 change request', '1 个更改请求')}</span>` : '' };
  if (k === 'applied') return { body: convRes(resApplied(d), t('approved', '已批准'), TXT_OK()) };
  if (k === 'undone') return { body: convRes(resUndone(), t('undone', '已撤销'), TXT_NO()) };
  if (k === 'expired') return { body: convRes(resExpired(), t('expired', '已过期'), '') };
  if (k === 'review' || k === 'review-warn') {
    if (d === 'b') return { body: cardBody, insp: reviewB(k === 'review' ? 'mem' : 'skill'), cls: ' with-insp wide' };
    return { body: cardBody, over: reviewC(k === 'review' ? 0 : 1) };
  }
  if (k === 'review-last') return { body: cardBody, over: reviewC(3) };
  /* session: the switches */
  const c = k === 'session-write' ? C1 : C0;
  const body = live(`${turnHead(PROMPT())}<div class="tb"><div class="acts">${leadActs()}</div><p class="text">${t('CLAUDE.md already covers the checks. I will draft the skill next.', 'CLAUDE.md 已涵盖检查事项。接下来我起草技能。')}</p></div>`);
  if (d === 'a') return { body, insp: inspA(c), cls: ' with-insp' };
  if (d === 'b') return { body, topx: chipCfg(c, true), over: popCfg(c) };
  return { body, over: dlgCfg(c.write ? 'rw' : 'ro') };
}
function sessionFrame(st, scheme) {
  const o = sessionState(st.replace(/-zh$/, ''));
  const lang = Z ? ' lang="zh-Hans"' : '';
  return `<div${lang} class="frame nosb${o.cls || ''} ${scheme}" data-state="${st}"><main class="main">${topbar({ topx: o.topx, insp: !!o.insp, dot: o.dot })}<div class="conv"><div class="col">${o.body}</div></div>${dock('')}${o.over || ''}</main>${o.insp || ''}</div>`;
}

/* screen: begin */
const STATES = [
  ['a-card', 'A, the diffs open in the card: the request in the turn with four collapsed object rows; Approve all 4, Decline, takes effect at the next start'],
  ['a-card-open', 'A: the first row opened to its diff, with the content-check line'],
  ['a-card-warn', 'A: the skill opened; the content check passed but line 5 runs a script, so the row carries Read first and a warning'],
  ['a-applied', 'A: after approval, the objects as rows with a chevron, Undo, and Restart disabled while the session is running'],
  ['a-undone', 'A: after Undo, the rows struck through and the earlier versions restored'],
  ['a-expired', 'A: the request expired because the session was handed off to studio; nothing was written'],

/* ---- the page --------------------------------------------------------------------------------------------------- */
const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  root.innerHTML = `<header class="intro"><h1>Self-configuration requests <span>A session proposes changes to its own configuration (issue #69, ADR 0036)</span></h1>
    <p>ADR 0036 lets a session read its configuration over MCP and, when the user turns on <b>write-config</b>, propose changes to the project’s CLAUDE.md or AGENTS.md, skills, commands, and to model and effort. A proposal is a <b>change request</b>: up to five objects, decided as a whole, always confirmed, expiring after 24 hours, at a hand-off or when the session stops. Nothing is written before the user approves, the change takes effect when the session next starts (effort applies at once), and the earlier versions are kept for 30 days for an Undo. This file mocks up the request in the turn with a diff per object, the outcome after approval, after Undo and after a hand-off, where the user turns the two capabilities on, and the notification. <b>Three directions, none chosen:</b> they are candidates for the maintainer.</p>
    <p><b>A, the diff in the card.</b> The request is a card in the turn in the permission card’s style. Each object is a row that opens to its diff, so the user decides without leaving the conversation. The switches are a Configuration group in the inspector tab, which this direction retitles Hoplet tools; Other sessions folds into a summary row above it.</p>
    <p><b>B, a compact card and a wide review.</b> The card in the turn only lists the objects and offers Review changes. The review opens in a wide inspector with the object list on the left, the diff on the right and Approve in its footer, so a long diff has room. The switches are a chip and a popover in the top bar, a dot on the inspector button marks a pending request.</p>
    <p><b>C, a dialog with steps.</b> The card has one action, Review and decide. A dialog walks through the objects one by one with a stepper, and Approve is offered on the last step only, so the user has seen every object. The switches are three presets in a dialog (Off, Read only, Read and propose changes). A pill in the top bar marks a pending request.</p>
    <p><b>Shared.</b> A skill or command with allowed-tools, model or hooks, or a secret-shaped line, is refused before it reaches the user; the session sees the refusal (conv-refused). A card can therefore only warn about what the content check cannot judge: prose that asks Claude to do something. Approve, decline and Undo are host-token actions; a notification only opens the card. Each state is also shown in Simplified Chinese (ids ending <b>-zh</b>); strings that are not in <b>zh-Hans.json</b> yet are proposals for it.</p></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}
document.querySelectorAll('.conv').forEach(c => { c.scrollTop = c.scrollHeight; });
