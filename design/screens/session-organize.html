<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

/* one type scale: meta 11/16 · UI 13/20 · prose 15/24 · title 15/20 600 · mono 12.5/20; weights 400/500/600 */
.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.with-insp{grid-template-columns:var(--layout-sidebar) 1fr var(--layout-inspector)}
.frame.nosb,.frame.page{grid-template-columns:1fr}
.frame.nosb.with-insp{grid-template-columns:1fr var(--layout-inspector)}
.frame.with-insp.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}

/* icon buttons: the icon carries the intent, the title names it */
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none;position:relative}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib[disabled]{opacity:.4;cursor:default}
.ib.bd{color:var(--color-text-2);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .ib.bd{background:var(--color-raised)}
.side,.insp{min-height:0;overflow:hidden}
.side{background:var(--color-sidebar);display:flex;flex-direction:column;min-width:0;box-shadow:inset -1px 0 0 var(--color-line)}
.brand{position:relative;height:var(--layout-topbar);display:flex;align-items:center;gap:6px;padding:0 var(--space-2) 0 14px;flex:none}
.brand b{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.brand .sp{flex:1}
.brand .hb{display:flex;gap:0}
.mark{width:20px;height:20px;border-radius:6px;background:var(--color-accent);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex:none}
.search{margin:0 var(--space-2);height:var(--control-field);border-radius:var(--radius-sm);background:var(--color-surface);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);color:var(--color-text-3);flex:none;text-align:left;
  box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .search{background:var(--color-raised)}
.search .lbl{flex:1}
.kbd{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);padding:0 4px;border-radius:4px;box-shadow:inset 0 0 0 1px var(--color-line);font-family:var(--font-ui);font-variant-numeric:tabular-nums}
.tree{flex:1;overflow:hidden;padding:0 var(--space-2)}
.devg{padding-top:var(--space-4)}
.dev{position:relative;height:var(--layout-row-device);display:flex;align-items:center;padding-right:var(--space-1);border-radius:var(--radius-sm);font-weight:var(--weight-semibold);color:var(--color-text);white-space:nowrap}
.dev .dt{flex:1;min-width:0;height:100%;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2)}
.dev .dt .dn{min-width:0;overflow:hidden;text-overflow:ellipsis}
.dev .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.dev .dchv{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.dev .dchv svg{transition:transform .12s}
.dev.open .dchv svg{transform:rotate(90deg)}
.dev .ib{width:24px;height:24px;display:none}
.dev.hov .ib,.dev.menu .ib{display:grid;color:var(--color-text-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--color-success);flex:none}
.dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}
/* machine icon: the system's mark in the folder icon's column, the presence dot at its bottom-right, cut into the mark */
.mch{--md:7px;--mc:5.5px;--mo:-1.5px;position:relative;width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.mch svg{display:block;-webkit-mask-image:radial-gradient(circle at 14px 14px,transparent calc(var(--mc) - .5px),#000 var(--mc));mask-image:radial-gradient(circle at 14px 14px,transparent calc(var(--mc) - .5px),#000 var(--mc))}
.mch .mch-d{position:absolute;right:var(--mo);bottom:var(--mo);width:var(--md);height:var(--md);border-radius:50%;background:var(--color-success)}
.mch.off{color:var(--color-text-3)}
.mch.off .mch-d{background:transparent;box-shadow:inset 0 0 0 1.5px var(--color-text-3)}

/* machine resources (#88): a warning glyph on the row */
.rm{display:flex;align-items:center;flex:none;margin-right:var(--space-1);color:var(--color-attention-text)}
.rm svg{width:14px;height:14px;flex:none}
.dev.hov .rm,.dev.menu .rm{display:none}
.menu-item.dim{color:var(--color-text-2)}
.sdir,.sess{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap}
.sdir{color:var(--color-text-2);font-weight:var(--weight-medium)}
.sdir .fi{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sdir .dn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sdir .rt{display:flex;align-items:center;gap:var(--space-2);flex:none}
.sdir .cnt{font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-regular);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.sdir .ib{width:24px;height:24px;margin-right:-4px;display:none}
.sdir.hov{background:var(--color-hover)}
.sdir.hov .ib{display:grid;color:var(--color-text-2)}
.sdir.none{color:var(--color-text-3);font-weight:var(--weight-regular);padding-left:32px}
.sess{color:var(--color-text-2)}
.sess .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess .m{gap:var(--space-2);min-width:16px;display:flex;align-items:center;justify-content:flex-end;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;flex:none}
.sess.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.sess.dim{color:var(--color-text-3)}
.sess.dim.on{color:var(--color-text-2)}
.sess.two{height:calc(var(--leading-ui) + var(--leading-meta))}
.sess .t.tt{display:flex;flex-direction:column;overflow:visible}
.sess .t1,.sess .t2{min-width:0;overflow:hidden;text-overflow:ellipsis}
.sess .t2{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
/* a machine's view options: its name, then Organize and Sort as two radio groups under the row */
.pop{position:absolute;z-index:30;top:calc(100% - var(--space-1));left:var(--space-2);right:var(--space-2);padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-title{padding:var(--space-2) var(--space-2) var(--space-1);font-weight:var(--weight-semibold);color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-label{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.menu-check{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-2)}
.menu-sep{height:1px;margin:var(--space-1) var(--space-2);background:var(--color-line)}
.pm{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.sess.on .pm{color:var(--color-text-2)}
.gl{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.gl .spin{color:var(--color-accent)}
.need-dot{width:8px;height:8px;border-radius:50%;background:var(--color-attention);box-shadow:0 0 0 3px var(--color-attention-ring)}
.bad-dot{width:8px;height:8px;border-radius:50%;background:var(--color-danger);flex:none}
.ready-dot{width:8px;height:8px;border-radius:50%;background:var(--color-accent);flex:none}
.off-dot{width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none}
.devg.off .dev,.devg.off .sdir,.devg.off .sess{color:var(--color-text-3)}
.devg.off .dev{font-weight:var(--weight-medium)}
.devg.off .sess.on{color:var(--color-text-2)}
.frozen-side .gl .spin{color:var(--color-text-3);animation:none}
.side-foot{height:var(--layout-foot);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2) 0 var(--space-4);box-shadow:inset 0 1px 0 var(--color-line);flex:none}
.conn{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);white-space:nowrap}
.conn .lead{width:16px;height:16px;display:grid;place-items:center;flex:none}
.conn.lost{color:var(--color-danger)}
.conn.lost .dot{background:var(--color-danger)}

/* modal chrome: command palette and New session */
.scrim{position:absolute;inset:0;z-index:19;background:var(--color-scrim)}
.modal{position:absolute;z-index:20;left:50%;top:var(--layout-modal-top);transform:translateX(-50%);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-float);overflow:hidden}
.hl{color:var(--color-accent-text);font-weight:var(--weight-semibold)}
.kc{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;padding:0 4px;border-radius:4px;background:var(--color-hover);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums;flex:none}
.pal{width:var(--layout-palette)}
.pal-in{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-3);padding:0 var(--space-4) 0 18px;font-size:var(--text-body);line-height:var(--leading-body);color:var(--color-text)}
.pal-in .q{display:flex;align-items:center}
.pal-in svg{color:var(--color-text-3)}
.pal-in .cr2{width:1.5px;height:20px;background:var(--color-accent);margin-left:2px}
.pal-b{padding:0 var(--space-2) var(--space-2)}
.pal-sec{padding:var(--space-3) var(--space-2) var(--space-1);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);color:var(--color-text-3)}
.po{height:var(--control-field);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text);white-space:nowrap}
.po .lead{width:16px;height:16px;display:grid;place-items:center;flex:none;color:var(--color-text-3)}
.po .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.po .t.ex{color:var(--color-text-2)}
.po .m{display:flex;align-items:baseline;min-width:0;max-width:52%;font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.po .m .ms{overflow:hidden;text-overflow:ellipsis;max-width:150px}
.po .m .ln{flex:none;white-space:pre}
.po.on{background:var(--color-selected);box-shadow:inset 0 1px 0 var(--color-highlight)}
.po.on .lead{color:var(--color-text-2)}
.po.on .kc{background:var(--color-raised);color:var(--color-text-2);box-shadow:0 0 0 1px var(--color-line)}
.dark .po.on .kc{background:var(--color-hover)}
.po.scan{color:var(--color-text-3)}
.pal-f{height:36px;display:flex;align-items:center;gap:var(--space-4);padding:0 var(--space-4);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);box-shadow:inset 0 1px 0 var(--color-line)}
.pal-f span{display:flex;align-items:center;gap:var(--space-1)}
/* top bar */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3) 0 var(--space-5);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap}
.nosb .top{padding-left:var(--space-3)}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.top .sp{flex:1}

/* conversation */
.conv{position:relative;flex:1;min-height:0;overflow:auto;scrollbar-width:none;padding:0 0 148px}
.conv::-webkit-scrollbar{display:none}
.col{width:min(var(--layout-column),calc(100% - 104px));margin:0 auto;padding-top:var(--space-2)}
.wide .col{width:calc(100% - 48px)}

.badge{display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-variant-numeric:tabular-nums}

const side = (body, o = {}) => `<aside class="side">${brand()}${o.search || searchBox()}${o.strip || ''}<div class="tree">${body}</div>${foot(ARCH.length, o.archOn)}${o.pop || ''}</aside>`;
/* the main column: a session's top bar, a quiet conversation and the composer */
const convo = s => `<div class="conv"><div class="col convo">
  <div class="um">${esc(t('The e2e suite fails about one run in five on build-box. Find out why and fix it.', 'build-box 上的 e2e 大约五次失败一次。找出原因并修复。'))}</div>
  <div class="prose">${esc(t('The failures all come from the reconnect flow: the page asserts the session list before the socket has replayed. I will wait for the replay marker instead of a fixed delay.', '失败都来自重连流程：页面在 socket 重放完成前就断言了会话列表。我会改为等待重放标记，而不是固定延时。'))}</div>
  <div class="prose dim"><i class="skl" style="width:92%"></i><i class="skl" style="width:76%"></i><i class="skl" style="width:84%"></i></div>
</div></div>
<div class="dock"><div class="col"><div class="composer"><div class="ph">${t('Reply…', '回复…')}</div><div class="cf"><span class="cst">${I.branch()}${M[s.m].name} / ${P[s.p].name} / ${s.br || ''}</span><span class="r"><button class="send"${tip(t('Send', '发送'))} disabled>${I.up()}</button></span></div></div></div></div>`;
const topBar = (s, extra = '') => `<div class="top"><span class="title">${esc(title(s))}</span>${extra}<span class="sp"></span>${ib(I.more(), t('Session menu', '会话菜单'))}${ib(I.panel(), t('Workspace (⌘I)', '工作区 (⌘I)'))}</div>`;
const sessionMain = (s, extra = '', over = '') => `<main class="main">${topBar(s, extra)}${convo(s)}${over}</main>`;
/* ==== #91: organizing sessions ===================================================================================== */
const SEL = 4;
const hl = (s, q) => { const i = s.indexOf(q); return i < 0 ? `<span>${esc(s)}</span>` : `<span>${esc(s.slice(0, i))}<span class="hl">${esc(q)}</span>${esc(s.slice(i + q.length))}</span>`; };
const where = s => `${M[s.m].name} · ${P[s.p].name}`;
const pinnedOf = list => list.filter(s => s.pin);
/* Machine: today's sidebar (a Pinned group, then folders), per machine */
const treeMachine = (list, o = {}) => Object.keys(M).map(k => {
  const ss = list.filter(s => s.m === k);
  if (!ss.length && o.hideEmpty) return '';
  if (o.shut) return `<div class="devg${M[k].on ? '' : ' off'}">${devRow(k, ss.length).replace('dev open', 'dev shut')}</div>`;
  const pins = o.noPins ? [] : ss.filter(s => s.pin);
  const rest = ss.filter(s => !pins.includes(s));
  const dirs = [...new Set(rest.map(s => s.p))];
  return `<div class="devg${M[k].on ? '' : ' off'}">${devRow(k)}${pins.length ? grpH(I.pin(), t('Pinned', '已置顶'), pins.length) + pins.map(s => row(s, { ...o, sub: P[s.p].name })).join('') : ''}${dirs.map(p => { const r = rest.filter(s => s.p === p); return dirRow(P[p].name, r.length) + r.map(s => row(s, o)).join(''); }).join('')}</div>`;
}).join('');
/* Project: one group per git origin across machines; a folder without a remote stays its machine's */
const treeProject = (list, o = {}) => {
  const pins = o.noPins ? [] : pinnedOf(list);
  const rest = list.filter(s => !pins.includes(s));
  const ps = [...new Set(rest.map(s => s.p))];
  return `<div class="devg">${pins.length ? grpH(I.pin(), t('Pinned', '已置顶'), pins.length) + pins.map(s => row(s, { ...o, sub: where(s) })).join('') : ''}${ps.map(p => {
    const r = rest.filter(s => s.p === p);
    const label = P[p].origin ? `${P[p].name}<span class="prj-o">${new Set(r.map(s => s.m)).size > 1 ? t(`${new Set(r.map(s => s.m)).size} machines`, `${new Set(r.map(s => s.m)).size} 台机器`) : ''}</span>` : `${P[p].name}<span class="prj-o">${t('no remote', '无远程仓库')}</span>`;
    return dirRow(label, r.length, { icon: I.folder() }) + r.map(s => row(s, { ...o, sub: M[s.m].name })).join('');
  }).join('')}</div>`;
};
/* Time: last activity, newest first */
const BUCKETS = [[0, 0, 'Today', '今天'], [1, 1, 'Yesterday', '昨天'], [2, 6, 'This week', '本周'], [7, 999, 'Earlier', '更早']];
const treeTime = (list, o = {}) => {
  const pins = o.noPins ? [] : pinnedOf(list);
  const rest = list.filter(s => !pins.includes(s));
  return `<div class="devg">${pins.length ? grpH(I.pin(), t('Pinned', '已置顶'), pins.length) + pins.map(s => row(s, { ...o, sub: where(s) })).join('') : ''}${BUCKETS.map(([a, b, en, zh]) => {
    const r = rest.filter(s => s.day >= a && s.day <= b);
    return r.length ? grpH(I.clock(), t(en, zh), r.length) + r.map(s => row(s, { ...o, sub: where(s) })).join('') : '';
  }).join('')}</div>`;
};
const TREE = { machine: treeMachine, project: treeProject, time: treeTime };

/* ---- A: a filter strip and a Group menu ----------------------------------------------------------------------- */
const stripA = (on, list = LIVE) => `<div class="strip" role="toolbar" aria-label="${t('Filter by tag', '按标签筛选')}">${TAGS.map(x => `<button class="fch${x === on ? ' on' : ''}" aria-pressed="${x === on}">${esc(x)}<span class="c">${count(x, list)}</span></button>`).join('')}</div>`;
const groupBtn = g => ib(g === 'time' ? I.clock() : I.layers(), t(`Group: ${{ machine: 'Machine', project: 'Project', time: 'Time' }[g]}`, `分组：${{ machine: '机器', project: '项目', time: '时间' }[g]}`));
const brandA = (g, on) => `<div class="brand"><span class="mark" aria-hidden="true">${mark}</span><b>Hoplet</b><span class="sp"></span><span class="hb">${groupBtn(g).replace('class="ib ', `class="ib ${on ? 'on ' : ''}`)}${ib(I.compose(), t('New session (⌘N)', '新建会话 (⌘N)'))}${ib(I.sidebar(), t('Hide sidebar (⌘\\)', '隐藏侧栏 (⌘\\)'))}</span></div>`;
const sideA = (o = {}) => {
  const g = o.group || 'machine';
  const list = o.tag ? LIVE.filter(s => s.tags.includes(o.tag)) : LIVE;
  const bar = o.tag ? `<div class="fbar">${t(`${list.length} of ${LIVE.length} sessions · tagged ${o.tag}`, `${LIVE.length} 个会话中的 ${list.length} 个 · 标签 ${o.tag}`)}${btn(t('Clear', '清除'), '', 'quiet')}</div>` : '';
  const strip = o.noTags ? '' : stripA(o.tag);
  const body = TREE[g](list, { sel: SEL, hov: o.hov, hideEmpty: !!o.tag });
  return `<aside class="side">${brandA(g, o.groupOpen)}${searchBox()}${strip}${bar}<div class="tree">${body}</div>${foot(ARCH.length, o.archOn)}${o.pop || ''}</aside>`;
};
const groupPop = g => `<div class="fpop" style="top:46px;left:8px;width:232px" role="menu">
  <div class="menu-label">${t('Group sessions by', '会话分组方式')}</div>
  ${[['machine', I.laptop(), 'Machine', '机器'], ['project', I.folder(), 'Project', '项目'], ['time', I.clock(), 'Last activity', '最近活动']].map(([k, ic, en, zh]) => `<div class="menu-item${k === g ? ' on' : ''}" role="menuitemradio" aria-checked="${k === g}"><span class="lead">${ic}</span>${t(en, zh)}<span class="menu-check" style="margin-left:auto">${k === g ? I.check() : ''}</span></div>`).join('')}
  <div class="menu-sep"></div>
  <div class="note">${t('Project joins the machines that share a git remote. Pinned stays on top in every grouping.', '“项目”把共用同一 git 远程仓库的机器合在一起。任何分组下置顶都在最上面。')}</div></div>`;
const sessMenu = (s, top, pinned) => `<div class="fpop" style="top:${top}px;left:16px;width:232px" role="menu">
  <div class="menu-title">${esc(title(s))}</div>
  <div class="menu-item"><span class="lead">${I.pen()}</span>${t('Rename…', '重命名…')}${kc('⌥⌘R')}</div>
  <div class="menu-item on"><span class="lead">${pinned ? I.unpin() : I.pin()}</span>${pinned ? t('Unpin', '取消置顶') : t('Pin', '置顶')}${kc('⌥⌘P')}</div>
  <div class="menu-item"><span class="lead">${I.tag()}</span>${t('Tags…', '标签…')}<span class="newb">${t('new', '新')}</span>${kc('⌥⌘T')}</div>
  <div class="menu-sep"></div>
  <div class="menu-item"><span class="lead">${I.archive()}</span>${t('Archive', '归档')}${kc('⇧⌘A')}</div></div>`;
const topTags = (s, o = {}) => `<span class="tags">${s.tags.map(x => tagChip(x)).join('')}${s.tags.length ? ib(I.plus(), t('Edit tags (⌥⌘T)', '编辑标签 (⌥⌘T)'), o.on ? 'on' : '') : btn(t('Add tag', '添加标签'), I.tag(), 'quiet', t('Add tag (⌥⌘T)', '添加标签 (⌥⌘T)'))}</span>`;
/* the tag editor: a combobox whose chips are the session's tags */
const tagEditor = (s, q, style) => {
  const m = TAGS.filter(x => x.includes(q) && !s.tags.includes(x));
  return `<div class="fpop" style="${style}" role="dialog" aria-label="${t('Tags', '标签')}">
  <div class="input on tok-in" role="combobox" aria-expanded="true">${s.tags.map(x => tagChip(x, { x: 1 })).join('')}<span>${esc(q)}<i class="caret"></i></span></div>
  <div class="menu-label">${t('Existing tags', '已有标签')}</div>
  ${m.map((x, i) => `<div class="menu-item${i === 0 ? ' on' : ''}" role="option"><span class="lead">${I.tag()}</span>${hl(x, q)}<span class="c">${count(x)}</span></div>`).join('')}
  <div class="menu-item new" role="option"><span class="lead">${I.plus()}</span>${t(`Create “${q}”`, `创建“${q}”`)}</div>
  <div class="note">${t('Letters, digits and hyphens, up to 32. Enter adds, Backspace removes the last, Esc closes.', '字母、数字和连字符，最多 32 个字符。回车添加，退格删除最后一个，Esc 关闭。')}</div></div>`;
};
/* the Archived page, kept from today, with the tag filter */
const archPage = (o = {}) => {
  const A2 = ARCH.filter(s => s.id !== o.gone);
  const list = (o.tag ? ARCH.filter(s => s.tags.includes(o.tag)) : ARCH).filter(s => s.id !== o.gone);
  const chips = `<div class="chips"><span class="l">${t('Tag', '标签')}</span>${TAGS.filter(x => count(x, A2) || x === o.tag).map(x => `<button class="fch${x === o.tag ? ' on' : ''}">${esc(x)}<span class="c">${count(x, A2)}</span></button>`).join('')}</div>`;
  const body = !list.length ? `<div class="empty">${I.archive()}<b>${o.tag ? t(`No archived sessions tagged ${o.tag}`, `没有标签为 ${o.tag} 的已归档会话`) : t('Nothing archived', '没有已归档的会话')}</b><p>${o.tag ? t('The filter is kept while this page is open.', '此页面打开期间保留筛选。') : t('Archive a session from its menu (⇧⌘A). It leaves the sidebar and comes back with Restore.', '从会话菜单归档（⇧⌘A）。它会离开侧栏，可用“恢复”找回。')}</p>${o.tag ? btn(t('Clear filter', '清除筛选')) : ''}</div>`
    : Object.keys(M).map(k => { const r = list.filter(s => s.m === k); return r.length ? `<div class="mh">${mIcon(M[k].os, M[k].on)}${M[k].name}</div>${[...new Set(r.map(s => s.p))].map(p => `<div class="fh"><span class="fi">${I.folder()}</span>${P[p].name}${btn(t('Restore all', '全部恢复'), '', 'quiet')}</div>${r.filter(s => s.p === p).map(s => `<div class="arow${s.id === o.hov ? ' hov' : ''}">${pmark()}<span class="tt"><span class="t1">${esc(title(s))}</span><span class="t2">${t(`archived ${s.arch} ago`, `${ageT(s.arch)}前归档`)}</span></span><span class="rtags">${s.tags.map(x => tagChip(x)).join('')}</span>${ib(I.restore(), t('Restore', '恢复'))}</div>`).join('')}`).join('')}` : ''; }).join('');
  return `<main class="main"><div class="top">${ib(I.back(), t('Back', '返回'), 'back')}<span class="title">${t('Archived', '已归档')}</span><span class="cnt2">${ARCH.length - (o.gone ? 1 : 0)}</span><span class="sp"></span></div><div class="apage"><div class="arch-list">${o.empty ? '' : chips}${o.empty ? `<div class="empty">${I.archive()}<b>${t('Nothing archived', '没有已归档的会话')}</b><p>${t('Archive a session from its menu (⇧⌘A). It leaves the sidebar and comes back with Restore.', '从会话菜单归档（⇧⌘A）。它会离开侧栏，可用“恢复”找回。')}</p></div>` : body}</div></div>${o.toast ? `<div class="toast">${I.check()}${t('Restored to build-box · hoplet', '已恢复到 build-box · hoplet')}${btn(t('Undo', '撤销'), '', 'quiet')}</div>` : ''}</main>`;
};
/* the phone: direction A at 390 px, for the native client of #139 */
const phone = () => {
  const r = (s, swiped) => swiped
    ? `<div class="ph-r sw"><div class="slide">${pmark()}<span class="tt"><span class="t1">${esc(title(s))}</span><span class="t2">${where(s)}</span></span><span class="m">${glyph(s)}</span></div><div class="ph-act"><button>${I.pin()}${t('Pin', '置顶')}</button><button>${I.tag()}${t('Tags', '标签')}</button><button>${I.archive()}${t('Archive', '归档')}</button></div></div>`
    : `<div class="ph-r">${pmark()}<span class="tt"><span class="t1">${esc(title(s))}</span><span class="t2">${where(s)}${s.tags.length ? ` · ${s.tags.join(' · ')}` : ''}</span></span><span class="m">${glyph(s)}</span></div>`;
  return `<div class="cap"><b>${t('A on a phone (390 px)', 'A 在手机上（390 px）')}</b><span>${t('The web UI stays desktop only (ADR 0011). This is how the same model reads in the native client of #139: tag chips scroll sideways, grouping is the Time list with Pinned on top, and a row swipes left to Pin, Tags and Archive. Archived is the last row of the list.', 'Web UI 仍只面向桌面（ADR 0011）。这是同一模型在 #139 原生客户端中的样子：标签横向滚动，分组用“时间”且置顶在上，行左滑出现置顶、标签和归档。已归档是列表的最后一行。')}</span></div>
  <div class="phone"><div class="ph-sb"><span>9:41</span><span></span></div>
  <div class="ph-h"><b>${t('Sessions', '会话')}</b>${ib(I.layers(), t('Group', '分组'))}${ib(I.compose(), t('New session', '新建会话'))}</div>
  <div class="ph-s">${I.search()}${t('Search', '搜索')}</div>
  <div class="strip" style="padding:12px 16px 4px">${TAGS.map(x => `<button class="fch">${esc(x)}<span class="c">${count(x)}</span></button>`).join('')}</div>
  <div class="ph-list"><div class="ph-g">${I.pin()}${t('Pinned', '已置顶')}</div>${pinnedOf(LIVE).map(s => r(s)).join('')}
  <div class="ph-g">${t('Today', '今天')}</div>${[2, 3, 5].map(id => r(byId(id), id === 3)).join('')}
  <div class="ph-g">${t('Yesterday', '昨天')}</div>${r(byId(7))}
  <div class="ph-g">${I.archive()}${t('Archived · 3', '已归档 · 3')}</div></div></div>`;
};
function pageA(st) {
  const s = byId(SEL);
  switch (st) {
    case 'a-default': return sideA() + sessionMain(s, topTags(s));
    case 'a-pinned': return sideA({ hov: 3, pop: sessMenu(byId(3), 320, false) }) + sessionMain(s, topTags(s));
    case 'a-filter': return sideA({ tag: 'bug' }) + sessionMain(s, topTags(s));
    case 'a-project': return sideA({ group: 'project', groupOpen: true, pop: groupPop('project') }) + sessionMain(s, topTags(s));
    case 'a-time': return sideA({ group: 'time' }) + sessionMain(s, topTags(s));
    case 'a-archive': return sideA({ archOn: true }) + archPage({ hov: 11 });
    case 'a-restore': return sideA({ archOn: true }) + archPage({ gone: 11, toast: true });
    case 'a-edit': return sideA() + sessionMain(s, topTags(s, { on: true }), tagEditor(s, 're', 'top:46px;left:150px;width:288px'));
    case 'a-empty': { const s2 = { ...byId(3) }; return sideA({ noTags: true }) + sessionMain(s2, topTags(s2)); }
    case 'a-nomatch': return sideA({ archOn: true }) + archPage({ tag: 'release' });
    default: return '';
  }
}

/* ---- B: sections (Pinned, Tags, Sessions) ---------------------------------------------------------------------- */
const sideB = (o = {}) => {
  const g = o.group || 'machine';
  const pins = pinnedOf(LIVE);
  const tagsSec = `<div class="sec">${t('Tags', '标签')}<span class="sp"></span>${ib(I.plus(), t('New tag', '新建标签'))}</div>${o.noTags ? `<div class="mini-empty">${t('No tags yet. Add one from a session’s menu.', '还没有标签。从会话菜单添加。')}</div>` : TAGS.map(x => {
    const open = x === o.tag;
    const r = LIVE.filter(s => s.tags.includes(x));
    return `<div class="sdir${open ? ' on' : ''}"><span class="fi">${I.tag()}</span><span class="dn">${esc(x)}</span><span class="rt"><span class="cnt">${r.length}</span></span></div>${open ? r.map(s => row(s, { sel: SEL, sub: where(s) })).join('') : ''}`;
  }).join('')}`;
  const label = { machine: t('By machine', '按机器'), project: t('By project', '按项目'), time: t('By time', '按时间') }[g];
  const sess = `<div class="sec">${t('Sessions', '会话')}<span class="sp"></span><button class="chooser${o.chooser ? ' on' : ''}">${label}${I.down()}</button></div>${o.tag ? treeMachine(LIVE, { shut: true }) : TREE[g](LIVE.filter(s => !s.pin), { sel: SEL, noPins: true, shut: o.shut })}`;
  const arch = o.arch ? `<div class="sec">${t('Archived', '已归档')}<span class="sp"></span><span class="meta">${ARCH.length}</span></div>${ARCH.map(s => row(s, { sub: where(s), hov: o.hov, end: s.id === o.hov ? ib(I.restore(), t('Restore', '恢复')) : `<span class="num">${ageT(s.arch)}</span>` })).join('')}` : `<div class="sec">${I.chev()}${t('Archived', '已归档')}<span class="sp"></span><span class="meta">${ARCH.length}</span></div>`;
  const pinSec = `<div class="sec">${t('Pinned', '已置顶')}</div>${pins.map(s => row(s, { sel: SEL, sub: where(s) })).join('')}`;
  return `<aside class="side">${brand()}${searchBox()}<div class="tree">${pinSec}${tagsSec}${sess}${o.arch || o.shut ? arch : ''}</div><div class="side-foot"><span class="conn"><span class="lead"><i class="dot"></i></span>hoplet.home.arpa</span>${ib(I.settings(), t('Settings (⌘,)', '设置 (⌘,)'))}</div>${o.pop || ''}</aside>`;
};
const chooserPop = g => `<div class="fpop" style="top:392px;left:60px;width:180px" role="menu">${[['machine', 'By machine', '按机器'], ['project', 'By project', '按项目'], ['time', 'By time', '按时间']].map(([k, en, zh]) => `<div class="menu-item${k === g ? ' on' : ''}" role="menuitemradio" aria-checked="${k === g}">${t(en, zh)}<span class="menu-check" style="margin-left:auto">${k === g ? I.check() : ''}</span></div>`).join('')}</div>`;
const tagDialog = (s, q) => {
  const m = TAGS.filter(x => x.includes(q) && !s.tags.includes(x));
  return `<div class="scrim"></div><div class="modal dlg" role="dialog" aria-label="${t('Tags', '标签')}"><div class="dlg-h">${t('Tags', '标签')}</div><div class="dlg-b">
  <div class="dlg-u"><span class="vt">${esc(title(s))}</span><span class="gap"></span>${M[s.m].name}</div>
  <div class="input on tok-in">${s.tags.map(x => tagChip(x, { x: 1 })).join('')}<span>${esc(q)}<i class="caret"></i></span></div>
  <div>${m.map((x, i) => `<div class="menu-item${i === 0 ? ' on' : ''}" style="border-radius:6px${i === 0 ? ';background:var(--color-selected)' : ''}"><span class="menu-check">${I.tag()}</span>${hl(x, q)}<span class="meta" style="margin-left:auto">${count(x)}</span></div>`).join('')}<div class="menu-item" style="color:var(--color-text-2)"><span class="menu-check">${I.plus()}</span>${t(`Create “${q}”`, `创建“${q}”`)}</div></div>
  <div class="meta">${t('Letters, digits and hyphens, up to 32. A session takes up to 10.', '字母、数字和连字符，最多 32 个字符。每个会话最多 10 个。')}</div>
  </div><div class="dlg-f">${btn(t('Cancel', '取消'))}${btn(t('Save', '保存'), '', 'primary')}</div></div>`;
};
function pageB(st) {
  const s = byId(SEL);
  const tags = `<span class="tags">${s.tags.map(x => tagChip(x)).join('')}</span>`;
  switch (st) {
    case 'b-default': return sideB() + sessionMain(s, tags);
    case 'b-tag': return sideB({ tag: 'bug' }) + sessionMain(s, tags);
    case 'b-project': return sideB({ group: 'project', chooser: true, pop: chooserPop('project') }) + sessionMain(s, tags);
    case 'b-time': return sideB({ group: 'time' }) + sessionMain(s, tags);
    case 'b-archive': return sideB({ arch: true, shut: true, hov: 11 }) + sessionMain(s, tags);
    case 'b-edit': return sideB() + sessionMain(s, tags) + tagDialog(s, 're');
    case 'b-empty': return sideB({ noTags: true }) + sessionMain(s, '');
    default: return '';
  }
}

/* ---- C: one filter field (tag:, is:, machine:, group:) ----------------------------------------------------------- */
const qt = (k, v) => `<span class="qt"><i>${k}:</i>${esc(v)}</span>`;
const sideC = (o = {}) => {
  const field = `<div class="qf${o.focus ? ' on' : ''}">${I.search()}${(o.tokens || []).map(([k, v]) => qt(k, v)).join('')}${o.typed ? `<span class="qtyp">${esc(o.typed)}<i class="caret"></i></span>` : ''}${!o.tokens && !o.typed ? `<span class="ph2">${t('Filter: tag: is: machine: group:', '筛选：tag: is: machine: group:')}</span><span class="kbd">/</span>` : ''}</div>`;
  let list = o.arch ? ARCH : LIVE;
  for (const [k, v] of o.tokens || []) {
    if (k === 'tag') list = list.filter(s => s.tags.includes(v));
    if (k === 'machine') list = list.filter(s => M[s.m].name === v);
  }
  const res = o.tokens ? `<div class="qres">${o.arch ? t(`${list.length} archived`, `${list.length} 个已归档`) : t(`${list.length} of ${LIVE.length}`, `${LIVE.length} 个中的 ${list.length} 个`)}${btn(t('Clear', '清除'), '', 'quiet')}</div>` : '';
  const g = o.group || 'machine';
  const rowO = o.arch ? { sub: where, hov: o.hov } : { sel: SEL, tm: true, hideEmpty: !!o.tokens };
  const body = !list.length ? `<div class="empty" style="padding:32px 8px">${I.search()}<b>${t('No sessions match', '没有匹配的会话')}</b><p>${t('studio is offline and has no session tagged release. Archived sessions need is:archived.', 'studio 离线，且没有标签为 release 的会话。已归档的会话需要 is:archived。')}</p></div>`
    : o.arch ? list.map(s => row(s, { sub: where(s), hov: o.hov, end: `${s.id === o.hov ? ib(I.restore(), t('Restore', '恢复')) : `<span class="tm">${s.tags.join(' · ')}</span>`}` })).join('')
    : TREE[g](list, rowO);
  return `<aside class="side">${brand()}${field}${res}<div class="tree">${body}</div><div class="side-foot"><span class="conn"><span class="lead"><i class="dot"></i></span>hoplet.home.arpa</span>${ib(I.settings(), t('Settings (⌘,)', '设置 (⌘,)'))}</div>${o.pop || ''}</aside>`;
};
const qSuggest = () => `<div class="fpop" style="top:88px;left:8px;width:232px" role="listbox">
  <div class="menu-label">${t('Tags', '标签')}</div>
  ${TAGS.filter(x => x.startsWith('b') || x.startsWith('r')).map((x, i) => `<div class="menu-item${i === 0 ? ' on' : ''}"><span class="mono"><span class="meta">tag:</span>${hl(x, x[0])}</span><span class="d">${count(x)}</span></div>`).join('')}
  <div class="menu-label">${t('Filters', '筛选')}</div>
  <div class="menu-item"><span class="mono">is:pinned</span><span class="d">${t('pinned only', '仅置顶')}</span></div>
  <div class="menu-item"><span class="mono">is:archived</span><span class="d">${t('the archive', '已归档')}</span></div>
  <div class="menu-item"><span class="mono">machine:</span><span class="d">${t('one machine', '一台机器')}</span></div>
  <div class="menu-item"><span class="mono">group:</span><span class="d">machine · project · time</span></div></div>`;
const inlineTags = (s, q) => `<span class="inl">${s.tags.map(x => tagChip(x, { x: 1 })).join('')}<span>${esc(q)}<i class="caret"></i></span></span>`;
const inlineSuggest = (s, q) => `<div class="fpop" style="top:46px;left:160px;width:260px" role="listbox">${TAGS.filter(x => x.includes(q) && !s.tags.includes(x)).map((x, i) => `<div class="menu-item${i === 0 ? ' on' : ''}"><span class="lead">${I.tag()}</span>${hl(x, q)}<span class="c">${count(x)}</span></div>`).join('')}<div class="menu-item new"><span class="lead">${I.plus()}</span>${t(`Create “${q}”`, `创建“${q}”`)}</div><div class="note">${t('Enter adds · Backspace removes · Esc saves and closes', '回车添加 · 退格删除 · Esc 保存并关闭')}</div></div>`;
function pageC(st) {
  const s = byId(SEL);
  const tags = `<span class="tags">${s.tags.map(x => tagChip(x)).join('')}</span>`;
  switch (st) {
    case 'c-default': return sideC() + sessionMain(s, tags);
    case 'c-filter': return sideC({ focus: true, tokens: [['tag', 'bug']], typed: 'tag:r', pop: qSuggest() }) + sessionMain(s, tags);
    case 'c-project': return sideC({ tokens: [['group', 'project']], group: 'project' }) + sessionMain(s, tags);
    case 'c-archive': return sideC({ tokens: [['is', 'archived']], arch: true, hov: 11 }) + sessionMain(s, tags);
    case 'c-edit': return sideC() + sessionMain(s, inlineTags(s, 're'), inlineSuggest(s, 're'));
    case 'c-empty': return sideC({ tokens: [['tag', 'release'], ['machine', 'studio']] }) + sessionMain(s, tags);
    default: return '';
  }
}

const STATES = [
  ['a-default', 'A · Tag chips under Search; tags beside the title; grouped by machine as today'],
  ['a-pinned', 'A · the row’s menu: Pin, and the new Tags… (⌥⌘T); the Pinned group on each machine'],
  ['a-filter', 'A · one tag chip on: only its sessions, a count and Clear'],
  ['a-project', 'A · the Group menu: Project joins hoplet on MacBook Pro, build-box and studio'],
  ['a-time', 'A · grouped by last activity: Pinned, Today, Yesterday, This week'],
  ['a-archive', 'A · the Archived page (as today) with a tag filter and tags on each row'],
  ['a-restore', 'A · one session restored, a toast with Undo'],
  ['a-edit', 'A · editing tags: the session’s chips, matches for “re”, Create'],
  ['a-empty', 'A · no tags yet: no strip, an Add tag button in the top bar'],
  ['a-nomatch', 'A · the archive filter matches nothing'],
  ['a-phone', 'A at phone width, for the #139 client (not the web UI)'],
  ['a-default-zh', 'A in Simplified Chinese'],
  ['a-edit-zh', 'A tag editor in Simplified Chinese'],
  ['a-archive-zh', 'A Archived page in Simplified Chinese'],
  ['b-default', 'B · sections: Pinned (all machines), Tags like folders, Sessions with a grouping chooser'],
  ['b-tag', 'B · a tag opened: its sessions with their machine and project'],
  ['b-project', 'B · the chooser set to By project'],
  ['b-time', 'B · Sessions by time'],
  ['b-archive', 'B · Archived as a fold at the bottom of the sidebar, Restore on hover'],
  ['b-edit', 'B · tags edited in a dialog'],
  ['b-empty', 'B · no tags yet'],
  ['b-default-zh', 'B in Simplified Chinese'],
  ['c-default', 'C · Search becomes a filter field; tags as text at the end of a row'],
  ['c-filter', 'C · tag:bug set, typing tag:r, suggestions for tags and filters'],
  ['c-project', 'C · group:project'],
  ['c-archive', 'C · is:archived, Restore on the row'],
  ['c-edit', 'C · tags edited in place in the top bar'],
  ['c-empty', 'C · nothing matches'],
  ['c-filter-zh', 'C in Simplified Chinese'],
];

const LANG = new URLSearchParams(location.search).get('lang') === 'zh-Hans';
function frame(st, scheme) {
  Z = LANG || st.endsWith('-zh');
  const base = st.replace(/-zh$/, '');
  if (base === 'a-phone') return `<div class="frame canvas ${scheme}" data-state="${st}">${phone()}</div>`;
  const body = base.startsWith('a-') ? pageA(base) : base.startsWith('b-') ? pageB(base) : pageC(base);
  return `<div class="frame ${scheme}" data-state="${st}">${body}</div>`;
}

const q = new URLSearchParams(location.search);
Z = LANG;
document.documentElement.lang = Z ? 'zh-Hans' : 'en';
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  root.innerHTML = `<header class="intro"><h1>Organizing sessions <span>Sidebar · Archived · session menu — #91, direction A confirmed by the maintainer</span></h1>
    <p>Pin and Archive already exist (the session menu, ⌥⌘P and ⇧⌘A, a Pinned group per machine, the Archived page with Restore). What #91 adds is <b>tags</b> on a session, <b>grouping across machines</b> by project (a project is its git remote, so <code>hoplet</code> on three machines is one group) or by last activity, a tag filter that works on the sidebar and on the archive, and a phone layout. Tags are plain words with no colour: in Hoplet a hue always means a state (orange working, amber needs you, red failed, green online), so a coloured tag would read as one. The sample has three machines (studio is offline), four projects (one without a remote) and four tags.</p>
    <p><b>A</b> (confirmed) keeps today’s sidebar and adds two things: a row of tag chips under Search, one on at a time, and a Group menu in the header (Machine, Project, Last activity). Tags sit beside the title in the top bar and are edited in a small combobox from there, from the row menu or with ⌥⌘T. The Archived page stays and gets the same chips. <b>B</b> turns the sidebar into sections: Pinned across all machines, Tags listed like folders, then Sessions with a grouping chooser and Archived as a fold at the bottom; tags are edited in a dialog. <b>C</b> keeps the sidebar plain and turns Search into a filter field with tokens (<code>tag:</code>, <code>is:pinned</code>, <code>is:archived</code>, <code>machine:</code>, <code>group:</code>); the archive is a filter, tags are text at the end of a row and are edited in place.</p>
    <p>Phone width is out of scope for the web UI (ADR 0011: desktop only, at least 1024 px); <code>a-phone</code> shows how A carries over to the native client of #139. New icons: <code>tag</code>. Add <code>?state=&lt;id&gt;&amp;scheme=light|dark</code> for one frame at full size, <code>?lang=zh-Hans</code> for Simplified Chinese.</p></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}
</script>
</body>
