<style>
@font-face{font-family:"Inter Variable";src:url(../fonts/inter-latin-wght-normal.woff2) format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"JetBrains Mono Variable";src:url(../fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2");font-weight:100 800;font-display:swap}

*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#131210}
body.solo{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
svg{display:block;flex:none}
.spin{animation:rot var(--motion-spin) linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}

.frame{width:1280px;height:800px;overflow:hidden;position:relative;display:grid;grid-template-columns:var(--layout-sidebar) 1fr;grid-template-rows:100%;
  background:var(--color-bg);color:var(--color-text);font-family:var(--font-ui);font-size:var(--text-ui);line-height:var(--leading-ui);font-weight:var(--weight-regular);
  -webkit-font-smoothing:antialiased;letter-spacing:-0.003em}
.frame.wide{grid-template-columns:1fr var(--layout-inspector-wide)}
.mono{font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0}
.meta{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-variant-numeric:tabular-nums}
.ib{width:var(--control-icon);height:var(--control-icon);border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--color-text-3);flex:none}
.ib.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.ib.sm{width:24px;height:24px}
.btn{height:var(--control-field);display:inline-flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:var(--radius-sm);font-weight:var(--weight-medium);color:var(--color-text);background:var(--color-hover);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line);white-space:nowrap}
.light .btn{background:var(--color-raised)}
.btn.primary{background:var(--color-accent);color:var(--color-on-accent);box-shadow:var(--shadow-accent);font-weight:var(--weight-semibold);padding:0 var(--space-4)}
.btn.quiet{background:transparent;box-shadow:none;color:var(--color-text-2);padding:0 var(--space-2)}
.btn.sm{height:24px;padding:0 var(--space-2)}
.btn[disabled]{opacity:.5;cursor:default}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);height:20px;padding:0 6px;border-radius:4px;background:var(--color-hover);color:var(--color-text-2);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium);white-space:nowrap;flex:none}
.light .tag{background:var(--color-selected)}
.tag.att{background:var(--color-attention-soft);color:var(--color-attention-text)}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:8px;background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line)}
.light .seg{background:var(--color-hover)}
.seg button{height:24px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);border-radius:6px;font-weight:var(--weight-medium);color:var(--color-text-2);white-space:nowrap}
.seg button.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .seg button.on{background:var(--color-raised)}
.nt{padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);display:flex;gap:var(--space-2);color:var(--color-text)}
.nt svg{margin-top:2px}
.nt.bad{background:var(--color-del-bg)}
.nt.bad svg{color:var(--color-danger)}
.nt.att{background:var(--color-attention-soft)}
.nt.att svg{color:var(--color-attention)}
.nt.snap{background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);color:var(--color-text-2)}
.nt.snap svg{color:var(--color-text-3)}
.nt b{font-weight:var(--weight-semibold)}
.cbx{width:16px;height:16px;border-radius:4px;box-shadow:inset 0 0 0 1.5px var(--color-text-3);display:grid;place-items:center;color:var(--color-on-accent);flex:none;margin-top:2px}
.cbx svg{width:12px;height:12px}
.cbx.on{background:var(--color-accent);box-shadow:none}
.radio{width:16px;height:16px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--color-text-3);flex:none;margin-top:2px}

.bar{height:6px;border-radius:3px;background:var(--color-hover);overflow:hidden}
.bar i{display:block;height:100%;background:var(--color-accent);border-radius:3px}

/* sidebar */
.side{background:var(--color-sidebar);box-shadow:var(--shadow-drawer);display:flex;flex-direction:column;min-height:0;padding:0 var(--space-2);z-index:2}
.brand{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);font-weight:var(--weight-semibold)}
.mark{width:20px;height:20px;border-radius:6px;background:var(--color-accent)}
.devg{margin-top:var(--space-3);padding:0 var(--space-2);height:24px;display:flex;align-items:center;gap:var(--space-2);color:var(--color-text-3);font-size:var(--text-meta);line-height:var(--leading-meta);font-weight:var(--weight-medium)}
.sess{height:var(--layout-row-tree);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2);white-space:nowrap;overflow:hidden}
.sess span{overflow:hidden;text-overflow:ellipsis}
.sess.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--color-text-3);flex:none}

/* main column */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.top{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);flex:none;box-shadow:inset 0 -1px 0 var(--color-line);white-space:nowrap;position:relative}
.top .title{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em;overflow:hidden;text-overflow:ellipsis}
.top .sp{flex:1}
.conv{position:relative;flex:1;min-height:0;overflow:hidden}
.col{width:calc(100% - 64px);max-width:var(--layout-column);margin:0 auto;padding-top:var(--space-2)}
.turn{position:relative;padding-bottom:var(--space-5)}
.turn + .turn{border-top:1px solid var(--color-line)}
.th{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:var(--space-4);align-items:baseline;padding:var(--space-5) 0 var(--space-3)}
.th .p{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.012em;max-width:var(--measure-prose)}
.th .tm{grid-column:1;margin-top:var(--space-1)}
.text{font-family:var(--font-prose);font-size:var(--text-body);line-height:var(--leading-body);margin:var(--space-1) 0 var(--space-3);max-width:var(--measure-prose)}
.act{display:grid;grid-template-columns:16px minmax(var(--layout-act-verb),max-content) minmax(0,1fr) auto;column-gap:var(--space-2);align-items:center;height:var(--layout-row);white-space:nowrap}
.act .i{color:var(--color-text-3)}
.act .k{color:var(--color-text-2);font-weight:var(--weight-medium)}
.act .a{min-width:0;overflow:hidden;text-overflow:ellipsis;color:var(--color-text-2)}
.act .m{font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3)}
.hodiv{display:flex;align-items:center;gap:var(--space-2);margin:var(--space-2) 0;color:var(--color-text-3);font-size:var(--text-meta);line-height:var(--leading-meta)}
.hodiv::before,.hodiv::after{content:"";flex:1;height:1px;background:var(--color-line)}

/* menus */
.pop{position:absolute;z-index:8;width:260px;padding:var(--space-1);border-radius:var(--radius-md);background:var(--color-raised);box-shadow:var(--shadow-float)}
.menu-item{height:var(--layout-row);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);white-space:nowrap}
.menu-item svg{color:var(--color-text-2)}
.menu-item .r{margin-left:auto;color:var(--color-text-3)}
.menu-item.on{background:var(--color-selected)}
.menu-item.danger{color:var(--color-danger)}
.menu-item.danger svg{color:var(--color-danger)}
.menu-item.new{box-shadow:inset 0 0 0 1px var(--color-accent)}
.menu-item.tall{height:auto;padding:var(--space-2);align-items:flex-start}
.menu-item.tall .meta{display:block;white-space:normal}
.menu-item.tall svg{margin-top:2px}
.menu-sep{height:1px;background:var(--color-line);margin:var(--space-1) var(--space-2)}
.menu-label{padding:var(--space-1) var(--space-2);font-size:var(--text-meta);line-height:var(--leading-meta);color:var(--color-text-3);font-weight:var(--weight-medium)}

/* dialog */
.scrim{position:absolute;inset:0;z-index:19;background:var(--color-scrim)}
.dlg{position:absolute;z-index:20;left:50%;top:40px;transform:translateX(-50%);width:var(--layout-dialog);border-radius:var(--radius-lg);background:var(--color-raised);box-shadow:var(--shadow-float);overflow:hidden}
.dlg.big{width:720px}
.dlg-h{padding:var(--space-4) var(--space-4) var(--space-1);font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold);letter-spacing:-0.01em}
.dlg-sub{padding:0 var(--space-4) var(--space-3);color:var(--color-text-3)}
.dlg-b{padding:0 var(--space-4);display:flex;flex-direction:column;gap:var(--space-3)}
.dlg-f{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-2);padding:var(--space-4)}
.dlg-f .l{margin-right:auto;display:flex;align-items:center;gap:var(--space-2)}
.grp{display:flex;flex-direction:column;gap:var(--space-1)}
.grp > .gl{color:var(--color-text-2);font-weight:var(--weight-medium);margin-bottom:var(--space-1)}
.opt{display:grid;grid-template-columns:16px minmax(0,1fr) auto;column-gap:var(--space-2);align-items:start;padding:var(--space-1) 0}
.opt .meta{display:block}
.opt .nm{font-weight:var(--weight-medium)}
.opt .ex{grid-column:2 / 4;margin-top:var(--space-2)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4)}
.big-ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--color-accent-soft);color:var(--color-accent-text)}
.big-ico.ok{background:var(--color-add-bg);color:var(--color-success)}
.big-ico.bad{background:var(--color-del-bg);color:var(--color-danger)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-5) var(--space-4) var(--space-2)}
.center b{font-size:var(--text-title);line-height:var(--leading-title);font-weight:var(--weight-semibold)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:var(--space-1) var(--space-4);color:var(--color-text-2);font-variant-numeric:tabular-nums}
.kv span:nth-child(odd){color:var(--color-text-3)}

/* the redaction list and the Markdown preview */
.red{border-radius:var(--radius-md);box-shadow:inset 0 0 0 1px var(--color-line);overflow:hidden}
.red .rr{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:var(--space-3);align-items:center;padding:var(--space-2) var(--space-3)}
.red .rr + .rr{box-shadow:inset 0 1px 0 var(--color-line)}
.red .rr .k{font-weight:var(--weight-medium)}
.red .rr .where{grid-column:1;color:var(--color-text-3);font-size:var(--text-meta);line-height:var(--leading-meta)}
.red .rr .n{grid-row:1 / 3;grid-column:2;color:var(--color-text-2);font-variant-numeric:tabular-nums}
.red .rr .x{grid-row:1 / 3;grid-column:3}
.mdv{border-radius:var(--radius-md);background:var(--color-bg);box-shadow:inset 0 0 0 1px var(--color-line);padding:var(--space-2) var(--space-3);font-family:var(--font-mono);font-size:var(--text-code);line-height:var(--leading-code);letter-spacing:0;white-space:pre-wrap;word-break:break-word;overflow:hidden;color:var(--color-text);-webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 40px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 40px),transparent)}
.mdv .h{color:var(--color-accent-text);font-weight:var(--weight-semibold)}
.mdv .d{color:var(--color-text-3)}

.mdv .ad{color:var(--color-add-text)} .mdv .dl{color:var(--color-del-text)}

/* the Export tab (B) */
.insp{background:var(--color-sidebar);box-shadow:var(--shadow-drawer);display:flex;flex-direction:column;min-width:0;min-height:0;z-index:4;overflow:hidden;position:relative}
.insp-h{height:var(--layout-topbar);display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-3);flex:none;box-shadow:inset 0 -1px 0 var(--color-line)}
.tabs{flex:1;display:flex;align-items:center;gap:2px}
.tab{height:28px;display:flex;align-items:center;gap:var(--space-2);padding:0 var(--space-2);border-radius:var(--radius-sm);color:var(--color-text-2);font-weight:var(--weight-medium);white-space:nowrap}
.tab.on{background:var(--color-selected);color:var(--color-text);box-shadow:inset 0 1px 0 var(--color-highlight),0 0 0 1px var(--color-line)}
.light .tab.on{background:var(--color-raised)}
.ex2{flex:1;min-height:0;display:grid;grid-template-columns:272px minmax(0,1fr)}

  if (st === 'a-menu') return side() + main(menu(), true);
  const dlg = (body, foot, title = t('Export as Markdown', '导出为 Markdown'), sub = `${SESSION()} · ${EST()}`, big = false) =>
    `<div class="scrim"></div><div class="dlg${big ? ' big' : ''}" role="dialog" aria-label="${title}">${title ? `<div class="dlg-h">${title}</div><div class="dlg-sub">${sub}</div>` : ''}<div class="dlg-b">${body}</div>${foot}</div>`;
  if (st === 'a-dialog') {
    return side() + main() + dlg(convOpts(0) + incOpts({ sumOpen: true }) + sensNote(),
      `<div class="dlg-f"><span class="l">${btn(t('Preview', '预览'), I.eye(), 'quiet')}</span>${btn(t('Cancel', '取消'))}${btn(t('Export', '导出'), I.dl(), 'primary')}</div>`);
  }
  if (st === 'a-sensitive') {
    return side() + main() + dlg(`<div class="cols"><div style="display:flex;flex-direction:column;gap:var(--space-3)">${redList()}${alsoMask()}<div class="nt snap" role="note">${I.shield()}<span>${t('Masked: tokens and keys Hoplet knows, URL credentials, Bearer headers, private keys, NAME=value secrets. Not masked: anything else.', '会遮盖：Hoplet 能识别的令牌和密钥、URL 中的凭据、Bearer 请求头、私钥、NAME=value 形式的机密。其他内容不会遮盖。')}</span></div></div>
      <div class="mdv" style="max-height:470px">${sample().split('\n').slice(31, 56).join('\n')}</div></div>`,
      `<div class="dlg-f"><span class="l meta">${t('Preview of turns 1 and 9', '预览第 1 轮和第 9 轮')}</span>${btn(t('Back', '返回'))}${btn(t('Export', '导出'), I.dl(), 'primary')}</div>`, t('Masked values', '已遮盖的内容'), t('3 values in 3 turns · masked in the file, never in the session', '3 轮中的 3 处 · 只在文件中遮盖，不改动会话'), true);
  }
  if (st === 'a-progress') {
    return side() + main() + dlg(`<div class="center"><div class="big-ico">${spin()}</div><b>${t('Exporting…', '正在导出…')}</b><span class="meta">${t('Turn 140 of 312 · 0.8 MiB written', '第 140 / 312 轮 · 已写入 0.8 MiB')}</span></div><div class="bar"><i style="width:45%"></i></div>
      <div class="nt snap" role="note">${I.alert()}<span>${t('The file downloads as it is written. You can close this dialog; the export keeps going in the background.', '文件会边生成边下载。你可以关闭此对话框，导出会在后台继续。')}</span></div>`,
      `<div class="dlg-f">${btn(t('Cancel export', '取消导出'))}${btn(t('Hide', '隐藏'))}</div>`, '', '');
  }
  if (st === 'a-done') {
    return side() + main() + dlg(`<div class="center"><div class="big-ico ok">${I.check()}</div><b>${t('Exported', '已导出')}</b><span class="mono" style="color:var(--color-text-2)">${FILE}</span></div>
      <div class="kv"><span>${t('Size', '大小')}</span><span>1.84 MiB · 312 ${t('turns', '轮')}</span><span>${t('Masked', '已遮盖')}</span><span>${t('3 values', '3 处')}</span><span>${t('Elided', '已省略')}</span><span>${t('27 long outputs, 1 diff over 256 KiB', '27 段过长输出，1 个超过 256 KiB 的差异')}</span></div>${sensNote()}`,
      `<div class="dlg-f"><span class="l">${btn(t('Copy as Markdown', '复制为 Markdown'), I.copy(), 'quiet', false)}</span>${btn(t('Show in Finder', '在访达中显示'))}${btn(t('Done', '完成'), '', 'primary')}</div>`, '', '');
  }
  if (st === 'a-failed') {
    return side() + main() + dlg(`<div class="center"><div class="big-ico bad">${I.alert()}</div><b>${t('Export stopped', '导出已中断')}</b><span class="meta">${t('At turn 188 of 312: the connection to Hoplet dropped.', '在第 188 / 312 轮时与 Hoplet 的连接断开了。')}</span></div>
      <div class="nt bad" role="alert">${I.alert()}<span>${t('The partial file was discarded, so nothing incomplete is left in Downloads.', '不完整的文件已丢弃，下载目录里不会留下残缺的文件。')}</span></div>`,
      `<div class="dlg-f">${btn(t('Close', '关闭'))}${btn(t('Try again', '重试'), I.retry(), 'primary')}</div>`, '', '');
  }
  return '';
}

/* ---- direction B: an Export tab with a live preview ------------------------------------------------------------- */
function bFrame(st) {
  const tabs = `<div class="insp-h"><div class="tabs"><button class="tab">${t('Changes', '变更')}</button><button class="tab">${t('Files', '文件')}</button><button class="tab on">${I.exp()}${t('Export', '导出')}</button></div>${ib(I.x(), t('Close tab', '关闭标签页'))}</div>`;
  const opts = (sel) => `<div class="exo">${convOpts(sel)}${incOpts()}</div>`;
  let foot, prev = sample(), head = `<b>${FILE}</b><span class="meta">${EST()}</span>`;
  if (st === 'b-tab') foot = `<div class="exf"><span class="meta">${t('Preview of the first turns', '前几轮的预览')}</span>${btn(t('Copy', '复制'), I.copy())}${btn(t('Download', '下载'), I.dl(), 'primary')}</div>`;
  if (st === 'b-sensitive') { prev = sample({ raw: false }).split('\n').slice(35, 60).join('\n'); foot = `<div class="exf" style="flex-direction:column;align-items:stretch">${sensNote()}<div style="display:flex;gap:var(--space-2);justify-content:flex-end">${btn(t('Previous', '上一处'))}${btn(t('Next masked value', '下一处遮盖'))}${btn(t('Download', '下载'), I.dl(), 'primary')}</div></div>`; head = `<b>${t('Masked 2 of 3', '第 2 / 3 处遮盖')}</b><span class="tag att">github-token</span><span class="meta">${t('Turn 9', '第 9 轮')}</span>`; }
  if (st === 'b-progress') foot = `<div class="exf">${spin()}<span class="meta" style="margin-right:var(--space-2)">${t('Turn 140 of 312 · 0.8 MiB', '第 140 / 312 轮 · 0.8 MiB')}</span><div class="bar" style="flex:1"><i style="width:45%"></i></div>${btn(t('Cancel', '取消'))}</div>`;
  if (st === 'b-done') foot = `<div class="exf"><span style="color:var(--color-success)">${I.check()}</span><span class="meta">${t('Saved 1.84 MiB to Downloads · 3 values masked', '已保存 1.84 MiB 到下载目录 · 已遮盖 3 处')}</span>${btn(t('Copy', '复制'), I.copy())}${btn(t('Show in Finder', '在访达中显示'))}</div>`;
  if (st === 'b-failed') foot = `<div class="exf" style="flex-direction:column;align-items:stretch"><div class="nt bad" role="alert">${I.alert()}<span>${t('Export stopped at turn 188: the connection to Hoplet dropped. The partial file was discarded.', '导出在第 188 轮中断：与 Hoplet 的连接断开了。不完整的文件已丢弃。')}</span></div><div style="display:flex;justify-content:flex-end">${btn(t('Try again', '重试'), I.retry(), 'primary')}</div></div>`;
  return main() + `<div class="insp">${tabs}<div class="ex2">${opts(st === 'b-done' ? 1 : 0)}<div class="exp"><div class="vh">${head}<span class="sp"></span><div class="seg"><button class="on">${t('Source', '源码')}</button><button>${t('Rendered', '渲染')}</button></div></div><div class="mdv">${prev}</div>${foot}</div></div></div>`;
}

/* ---- direction C: presets from the menu, background toasts ------------------------------------------------------ */
function cFrame(st) {
  if (st === 'c-menu') {
    const sub = `<div class="pop" style="right:316px;top:204px;width:300px" role="menu"><div class="menu-label">${t('Export as Markdown', '导出为 Markdown')}</div>
      <div class="menu-item tall on">${I.exp()}<div>${t('Full transcript', '完整记录')}<span class="meta">${t('Everything, with changes and commands', '全部内容，含变更和命令')}</span></div></div>
      <div class="menu-item tall">${I.exp()}<div>${t('Messages and replies', '消息与回复')}<span class="meta">${t('Your messages and the final reply of each turn', '你的消息和每轮的最终回复')}</span></div></div>
      <div class="menu-item tall">${I.exp()}<div>${t('PR description', 'PR 描述')}<span class="meta">${t('Summary, changes and commands; no conversation', '摘要、变更和命令；不含对话')}</span></div></div>
      <div class="menu-sep"></div><div class="menu-item">${t('Custom…', '自定义…')}</div></div>`;
    return side() + main(menu({ presets: true }) + sub, true);
  }
  const toasts = (inner) => `<div class="toasts">${inner}</div>`;
  if (st === 'c-confirm') {
    return side() + main() + `<div class="scrim"></div><div class="dlg" role="dialog" aria-label="${t('Export full transcript', '导出完整记录')}"><div class="dlg-h">${t('Export full transcript', '导出完整记录')}</div><div class="dlg-sub">${SESSION()} · ${EST()}</div>
      <div class="dlg-b"><div class="kv"><span>${t('Includes', '包含')}</span><span>${t('Everything, summary, changes, commands, machines', '全部对话、摘要、变更、命令、机器')}</span><span>${t('Machines', '机器')}</span><span>MacBook Pro → studio ${t('(turn 9)', '（第 9 轮）')}</span></div>${sensNote()}${alsoMask()}</div>
      <div class="dlg-f"><span class="l">${btn(t('Change options…', '修改选项…'), '', 'quiet')}</span>${btn(t('Cancel', '取消'))}${btn(t('Export', '导出'), I.dl(), 'primary')}</div></div>`;
  }
  if (st === 'c-progress') return side() + main() + toasts(`<div class="toast" role="status">${spin()}<div><b>${t('Exporting full transcript', '正在导出完整记录')}</b><div class="meta">${t('Turn 140 of 312 · 0.8 MiB', '第 140 / 312 轮 · 0.8 MiB')}</div></div>${ib(I.x(), t('Cancel export', '取消导出'), 'sm')}<div class="bar"><i style="width:45%"></i></div></div>`);
  if (st === 'c-done') return side() + main() + toasts(`<div class="toast ok" role="status">${I.check()}<div><b>${t('Exported', '已导出')}</b><div class="meta mono">${FILE}</div><div class="meta">${t('1.84 MiB · 3 values masked, check before sharing', '1.84 MiB · 已遮盖 3 处，分享前请检查')}</div></div>${ib(I.x(), t('Dismiss', '关闭'), 'sm')}<div class="acts">${btn(t('Show in Finder', '在访达中显示'), '', 'sm')}${btn(t('Review masked', '查看遮盖'), '', 'sm')}</div></div>`);
  if (st === 'c-failed') return side() + main() + toasts(`<div class="toast bad" role="alert">${I.alert()}<div><b>${t('Export stopped', '导出已中断')}</b><div class="meta">${t('At turn 188: the connection to Hoplet dropped. The partial file was discarded.', '在第 188 轮中断：与 Hoplet 的连接断开了。不完整的文件已丢弃。')}</div></div>${ib(I.x(), t('Dismiss', '关闭'), 'sm')}<div class="acts">${btn(t('Try again', '重试'), I.retry(), 'sm')}</div></div>`);
  return '';
}

/* ---- states ----------------------------------------------------------------------------------------------------- */
const STATES = [
  ['a-menu', 'A, a dialog: Export as Markdown… joins the Copy group of the session menu'],
  ['a-dialog', 'A: the options: conversation (Everything, your messages and final replies, None), Summary prefilled from the last reply, Changes, Commands, Machines and hand-offs; the masked count'],
  ['a-sensitive', 'A: Review on the masked note: what was masked, by kind and turn, with the redacted preview and an Also mask list'],
  ['a-progress', 'A: a large session: progress by turn and bytes, the download streams, Hide keeps it going'],
  ['a-done', 'A: exported, with the size, what was masked and elided, and the reminder to check'],
  ['a-failed', 'A: the export stopped; the partial file is discarded; Try again'],
  ['a-dialog-zh', 'A in Simplified Chinese: the options'],
  ['a-sensitive-zh', 'A in Simplified Chinese: masked values'],
  ['a-done-zh', 'A in Simplified Chinese: exported'],
  ['b-tab', 'B, an Export tab: options on the left, the Markdown as it will be written on the right'],
  ['b-sensitive', 'B: stepping through the masked values in the preview'],
  ['b-progress', 'B: progress in the tab footer'],
  ['b-done', 'B: saved, with Copy and Show in Finder'],
  ['b-failed', 'B: the export stopped'],
  ['b-tab-zh', 'B in Simplified Chinese'],
  ['c-menu', 'C, presets: Full transcript, Messages and replies, PR description, Custom… (opens A’s dialog)'],
  ['c-confirm', 'C: one confirm sheet with what the preset includes and the masked count'],
  ['c-progress', 'C: the export runs in a toast; the session stays usable'],
  ['c-done', 'C: done toast with Show in Finder and Review masked'],
  ['c-failed', 'C: failure toast with Try again'],
  ['c-menu-zh', 'C in Simplified Chinese: presets'],
];

function frame(st, scheme) {
  Z = st.endsWith('-zh');
  const s = st.replace(/-zh$/, '');
  const body = s[0] === 'a' ? aFrame(s) : s[0] === 'b' ? bFrame(s) : cFrame(s);
  return `<div class="frame ${s[0] === 'b' ? 'wide ' : ''}${scheme}" lang="${Z ? 'zh-Hans' : 'en'}">${body}</div>`;
}

/* ---- the page --------------------------------------------------------------------------------------------------- */
const q = new URLSearchParams(location.search);
const root = document.getElementById('root');
const solo = STATES.find(([s]) => s === q.get('state'));
if (q.get('state') && !solo) {
  document.body.className = 'solo';
  root.textContent = `Unknown state: ${q.get('state')}`;
} else if (solo) {
  document.body.className = 'solo';
  root.innerHTML = frame(solo[0], q.get('scheme') === 'light' ? 'light' : 'dark');
} else {
  document.body.className = 'stacked';
  Z = false;
  root.innerHTML = `<header class="intro"><h1>Session export <span>Export a session as a Markdown file (issue #93)</span></h1>
    <p><b>A proposal awaiting the maintainer: three directions, none chosen, and a format to confirm.</b> The user picks what goes in (the whole conversation, only their messages and the final replies, or neither; a summary; the net diff; the commands; the machines and hand-off points) and gets one Markdown file. Values that look like credentials are masked in the file, never in the session, with a warning that other secrets may remain. A large session streams, with progress by turn.</p>
    <p><b>A, a dialog from the session menu.</b> Export as Markdown… opens one dialog with every option, a masked count with Review, then progress, done and failure in the same dialog. One place, familiar, no new surface; the content itself is seen only in the masked-value review.</p>
    <p><b>B, an Export tab in the wide inspector.</b> Options on the left, the Markdown as it will be written on the right, and a stepper through masked values. The user sees exactly what leaves; costs a tab and the wide inspector, and the preview needs the first pages of the export before the user commits.</p>
    <p><b>C, presets.</b> Three presets in a submenu (Full transcript, Messages and replies, PR description) and Custom…, which opens A’s dialog; one confirm sheet, then a toast that runs in the background. Fastest for the common cases; the options hide behind Custom.</p>
    <p><b>Shared.</b> The summary is never written by Hoplet: it starts as the last reply and the user edits it. The Changes section is the net diff against the base, capped like the Changes tab. <b>file-down</b> and <b>triangle-alert</b> are new to the closed icon set. Secrets in this mockup are placeholders (<span style="font-family:monospace">hpt_EXAMPLE…</span>). States ending <b>-zh</b> are in Simplified Chinese. The file, as proposed (shortened where it says …):</p>
    <pre>${esc(plain())}</pre></header>` +
    STATES.map(([s, desc]) => `<section class="st"><h2>${s}<span>${desc}</span></h2><div class="pair">
      <div class="scaled">${frame(s, 'light')}</div><div class="scaled">${frame(s, 'dark')}</div></div></section>`).join('');
}
</script></body></html>
