name: HopletPrototype
options:
  bundleIdPrefix: dev.hoplet
  deploymentTarget:
    iOS: "26.0"
packages:
  HopletKit:
    path: ../HopletKit
targets:
  HopletPrototype:
    type: application
    platform: iOS
    sources: [Sources, Shared]
    dependencies:
      - target: HopletActivity
        embed: true
      - package: HopletKit
        product: HopletClient
    info:
      path: Sources/Info.plist
      properties:
        NSBonjourServices: [_hoplet._tcp]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Hoplet
        INFOPLIST_KEY_NSSupportsLiveActivities: "YES"
        INFOPLIST_KEY_NSCameraUsageDescription: 扫描 hoplet pair 显示的二维码
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: 在同一网络里直接连接你的机器
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  HopletActivity:
    type: app-extension
    platform: iOS
    sources:
      - Extension
      - Shared
      - Sources/Assets.xcassets
    info:
      path: Extension/Info.plist
      properties:
        CFBundleDisplayName: Hoplet
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hoplet.HopletPrototype.HopletActivity
        SWIFT_VERSION: "6.0"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: "YES"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        ASSETCATALOG_COMPILER_WIDGET_BACKGROUND_COLOR_NAME: ""
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
