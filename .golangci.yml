version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: errorf
        - name: unused-parameter
    gosec:
      excludes:
        - G104
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      # The shim and ExecStdio exist to run the harness command the daemon chose;
      # the session spawner runs the hoplet binary itself as the shim.
      - path: internal/(shim/shim|harness/execstdio|session/spawn)\.go
        linters: [gosec]
        text: G204
      # BuildBinary runs `go build` with the output path a test chose.
      - path: internal/harness/fake/build\.go
        linters: [gosec]
        text: G204
      # fakeharness reads the script file named by its test-controlled environment.
      - path: internal/harness/fake/fakeharness/main\.go
        linters: [gosec]
        text: G703
      # runCommand runs launchctl with arguments package launchd builds.
      - path: cmd/hoplet/launchctl\.go
        linters: [gosec]
        text: G204
      # login runs the user's own login shell to read its environment.
      - path: internal/env/login\.go
        linters: [gosec]
        text: G204
      # dsclShell asks the directory service for the account's shell.
      - path: internal/env/dscl\.go
        linters: [gosec]
        text: G204
      # usableShell checks that the shell the user database names is an
      # executable file.
      - path: internal/env/shellcheck\.go
        linters: [gosec]
        text: G703
      # doctor requests the probe URL from the daemon's configuration.
      - path: internal/daemon/probe\.go
        linters: [gosec]
        text: G704
      # G302 asks for 0600 or less; the daemon's home is a directory, which
      # needs the execute bit and is tightened to 0700.
      - path: internal/daemon/secure\.go
        linters: [gosec]
        text: G302

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yangflow/hoplet
