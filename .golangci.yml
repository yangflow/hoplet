version: "2"

linters:
  default: standard
  enable:
    - errorlint
    - gosec
    - misspell
    - nolintlint
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
        - name: context-as-argument
        - name: errorf
        - name: unused-parameter
    gosec:
      excludes:
        - G104
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [gosec, unparam]
      # The shim and ExecStdio exist to run the harness command the daemon chose.
      - path: internal/(shim/shim|harness/execstdio)\.go
        linters: [gosec]
        text: G204
      # BuildBinary runs `go build` with the output path a test chose.
      - path: internal/harness/fake/build\.go
        linters: [gosec]
        text: G204
      # fakeharness reads the script file named by its test-controlled environment.
      - path: internal/harness/fake/fakeharness/main\.go
        linters: [gosec]
        text: G703

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/yangflow/hoplet
