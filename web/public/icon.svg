<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>Hoplet</title>
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffc25a"/><stop offset=".45" stop-color="#ff7a24"/><stop offset="1" stop-color="#d63d1a"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".22" cy=".12" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".55" stop-color="#7a1c08" stop-opacity="0"/><stop offset="1" stop-color="#7a1c08" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".25" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf2"/><stop offset="1" stop-color="#f6d8b8"/>
    </linearGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8361a"/><stop offset="1" stop-color="#7d1e0b"/>
    </linearGradient>
    <radialGradient id="orb" cx=".38" cy=".34" r=".7">
      <stop offset="0" stop-color="#fff"/><stop offset=".35" stop-color="#fff3c4"/><stop offset=".8" stop-color="#ffc24a"/><stop offset="1" stop-color="#ff9a2e"/>
    </radialGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <filter id="lift" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#6b1606" flood-opacity=".45"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="26" result="b"/>
      <feColorMatrix in="b" type="matrix" values="1 0 0 0 0  0 .9 0 0 0  0 0 .5 0 0  0 0 0 .9 0" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#tile-shadow)"><rect x="100" y="100" width="824" height="824" rx="185" fill="url(#field)"/></g>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#shade)"/>
  <rect x="102" y="102" width="820" height="820" rx="183" fill="none" stroke="url(#rim)" stroke-width="4"/>
  <g fill="none" stroke-linecap="round" stroke-width="128">
    <path transform="translate(0 26)" stroke="url(#ember)" d="M392 250V744M392 560C392 420 652 420 652 560V600"/>
    <path filter="url(#lift)" stroke="url(#cream)" d="M392 250V744M392 560C392 420 652 420 652 560V600"/>
    <g stroke="#fff" stroke-width="22" opacity=".7"><path d="M356 262V700"/><path d="M432 482C484 448 560 448 612 482"/></g>
  </g>
  <g filter="url(#glow)"><circle cx="652" cy="780" r="74" fill="url(#orb)"/></g>
  <ellipse cx="628" cy="752" rx="26" ry="15" fill="#fff" opacity=".9"/>
</svg>
